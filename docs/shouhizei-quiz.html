<h1>税理士試験 消費税法 計算4択ドリル</h1>
<p class="sub">第69回〜第76回の〔第二問〕計算問題を論点ごとに4択に分解。資料つき・計算式つきで、電卓なしで解けます。年度を選んで挑戦できます。</p>
<div id="hud"></div>
<div class="card" id="main"></div>
<p class="src">出典：税理士試験 消費税法 本試験問題（第69回〜第76回）。解答は大手予備校の解答速報を参考に作成したもので、公式の解答ではありません。古い年度は現行法（令和8年4月時点）に合わせて解答を改めた箇所があり、その問題には注記があります。間違えた問題と最高得点はこのブラウザに保存されます。</p>
</div>
<script>
const D=[{"year": "R08", "label": "令和8年度（第76回）", "questions": [{"cat": "甲・納税義務", "ctx": "個人事業者甲の令和6年（基準期間）の取引（税込経理）\n・資産の譲渡等の金額 54,944,632円\n　うち飲食料品の譲渡 726,253円\n　うち非課税取引 43,211円\n・売上げに係る対価の返還等 354,344円（全て標準税率分）", "q": "甲の基準期間における課税売上高はいくらか。", "choices": ["49,600,478円（＝(54,944,632−726,253−43,211)×100/110＋726,253×100/108−354,344×100/110）", "49,922,609円（＝(54,944,632−726,253−43,211)×100/110＋726,253×100/108）", "49,639,761円（＝(54,944,632−726,253)×100/110＋726,253×100/108−354,344×100/110）", "49,588,251円（＝(54,944,632−43,211−354,344)×100/110）"], "exp": "(54,944,632−726,253−43,211)×100/110＋726,253×100/108−354,344×100/110＝49,600,478円。非課税分を除き、軽減税率分は108で割り戻し、返還等も税抜にして控除します。", "note": ""}, {"cat": "甲・納税義務", "ctx": "甲の基準期間の課税売上高は49,600,478円。甲は令和5年10月1日から適格請求書発行事業者。課税事業者選択届出書は未提出。", "q": "甲の令和8年分の納税義務の判定として正しいものはどれか。", "choices": ["基準期間の課税売上高が1,000万円を超えるため納税義務あり", "基準期間の課税売上高が5,000万円以下のため免税", "適格請求書発行事業者の登録があるときだけ納税義務あり", "特定期間の給与支払額で判定する"], "exp": "基準期間の課税売上高が1,000万円を超えているので、事業者免税点制度（法9①）は適用されず、納税義務があります。", "note": ""}, {"cat": "甲・簡易課税", "ctx": "甲は平成16年12月1日に簡易課税制度選択届出書を提出し、その後取りやめていない。基準期間の課税売上高は49,600,478円。", "q": "甲の令和8年分に簡易課税制度は適用されるか。", "choices": ["適用される", "適用されない（5,000万円超のため）", "適用されない（届出の効力は2年で切れるため）", "適用されない（適格請求書発行事業者のため）"], "exp": "届出の効力は取りやめるまで続き、基準期間の課税売上高が5,000万円以下なので適用されます。", "note": ""}, {"cat": "甲・事業区分", "ctx": "自動二輪車販売店の甲は、新車の販売価格に「安心保証サービス料（購入後3年以内の修理工賃が無料になるサービス）」を上乗せして受け取っている。", "q": "安心保証サービス料の簡易課税の事業区分はどれか。", "choices": ["第五種事業", "第一種事業", "第二種事業", "第三種事業"], "exp": "修理という役務提供の対価なので、サービス業等の第五種事業です。新車本体の販売とは分けて区分します。", "note": ""}, {"cat": "甲・事業区分", "ctx": "甲は中古車を仕入れ、点検・清掃だけを行って消費者に販売した。", "q": "この売上の事業区分はどれか。", "choices": ["第二種事業", "第一種事業", "第三種事業", "第五種事業"], "exp": "点検・清掃では性質・形状は変わらないので、消費者への販売は小売業の第二種です（事業者への販売なら卸売業の第一種）。", "note": ""}, {"cat": "甲・事業区分", "ctx": "甲は仕入れた中古車に塗装や部品の取替えを行ってから、消費者に販売した。", "q": "この売上の事業区分はどれか。", "choices": ["第三種事業", "第二種事業", "第四種事業", "第一種事業"], "exp": "塗装や部品の取替えは性質・形状を変える加工にあたるため、製造業等の第三種です。", "note": ""}, {"cat": "甲・事業区分", "ctx": "甲は仕入れた新車を、顧客の希望に合わせてレース用に改造して販売した（カスタム新車）。", "q": "この売上の事業区分はどれか。", "choices": ["第三種事業", "第二種事業", "第一種事業", "第五種事業"], "exp": "仕入れた商品を改造して販売するのは加工・製造にあたるため第三種です。", "note": ""}, {"cat": "甲・課税区分", "ctx": "甲のバイクレンタルの売上には、借主が負担する「補償料（事故のときに車両の損害が免責になるもの）」が含まれている。", "q": "補償料の消費税の扱いとして正しいものはどれか。", "choices": ["レンタル料と一体の課税売上（第五種）", "保険料として非課税", "損害賠償金として不課税", "第四種の課税売上"], "exp": "免責補償料は保険契約ではなく、レンタルという役務の対価の一部です。課税売上で、サービス業の第五種になります。", "note": ""}, {"cat": "甲・課税区分", "ctx": "甲は顧客が加入した自賠責保険・任意保険の代理店として保険会社から手数料を受け取っている。", "q": "代理店手数料の扱いとして正しいものはどれか。", "choices": ["課税売上（第五種）", "保険料なので非課税", "不課税", "課税売上（第四種）"], "exp": "保険料は非課税ですが、代理店手数料は保険会社への役務提供の対価なので課税され、第五種になります。", "note": ""}, {"cat": "甲・課税区分", "ctx": "甲はメーカーからモーターショーの入場チケットを148,500円で仕入れ、消費者に165,000円で売った。\nチケットは、提示するとモーターショーに入場できるもの（メーカーが発行）。\n（本問の前提）このチケットは、提示した人がモーターショーに入場するサービスの提供を受けられることを示す証書で、甲は券面の権利をそのまま消費者に売り渡している（甲自身が入場のサービスを提供するわけではない）。", "q": "チケットの売却の扱いとして正しいものはどれか。", "choices": ["物品切手等の譲渡なので非課税", "第二種事業の課税売上", "第五種事業の課税売上", "差額16,500円だけが課税売上"], "exp": "入場券のように、それと引換えに役務の提供を受けられることを示す証書は「物品切手等」に当たり、その譲渡は非課税です。課税標準額には入れません。入場のサービス自体はチケットと引換えに主催者が提供するもので、甲の売上げではありません。", "note": "【資料の補足】本試験の問題文には「チケットが「役務の提供を受けられる証書」であることと、甲が入場のサービスを提供しないこと」の記載がないため、大手予備校の解答速報の考え方に合わせて前提を補っています。"}, {"cat": "甲・課税標準", "ctx": "甲の当期の課税売上（税込）\n・標準税率分 61,990,963円\n・軽減税率分 697,680円", "q": "標準税率（7.8％）分の課税標準額はいくらか。", "choices": ["56,355,000円（＝61,990,963×100/110→千円未満切捨）", "56,355,420円（＝61,990,963×100/110（切捨てなし））", "57,399,000円（＝61,990,963×100/108→千円未満切捨）", "56,989,000円（＝(61,990,963＋697,680)×100/110→千円未満切捨）"], "exp": "61,990,963×100/110＝56,355,420円。課税標準額は千円未満を切り捨てて56,355,000円です。", "note": ""}, {"cat": "甲・課税標準", "ctx": "甲の軽減税率対象の売上（税込）\n・事業者向けサプリメント 75,600円\n・消費者向けサプリメント 622,080円", "q": "軽減税率（6.24％）分の課税標準額はいくらか。", "choices": ["646,000円（＝(75,600＋622,080)×100/108）", "634,000円（＝(75,600＋622,080)×100/110→千円未満切捨）", "697,000円（＝75,600＋622,080→千円未満切捨）", "576,000円（＝622,080×100/108（事業者分を除く））"], "exp": "(75,600＋622,080)×100/108＝646,000円（千円未満切捨て）。", "note": ""}, {"cat": "甲・課税標準", "ctx": "課税標準額：標準税率分 56,355,000円、軽減税率分 646,000円", "q": "課税標準額に対する消費税額はいくらか。", "choices": ["4,436,000円（＝56,355,000×7.8％＋646,000×6.24％）", "4,395,690円（＝56,355,000×7.8％）", "4,446,078円（＝(56,355,000＋646,000)×7.8％）", "3,556,862円（＝(56,355,000＋646,000)×6.24％）"], "exp": "56,355,000×7.8％＝4,395,690円、646,000×6.24％＝40,310円、合計4,436,000円。", "note": ""}, {"cat": "甲・返還等", "ctx": "甲が修理工賃を請求したとき、売上先が双方の合意のうえで振込手数料相当額42,115円を差し引いて入金してきた。", "q": "この42,115円の扱いとして正しいものはどれか。", "choices": ["売上げに係る対価の返還等（値引き）", "課税仕入れ（支払手数料）", "不課税", "非課税の金融取引"], "exp": "合意のうえで売上代金から差し引かれたものなので、売上値引き（売上げに係る対価の返還等）として扱います。", "note": ""}, {"cat": "甲・返還等", "ctx": "甲の売上返品・値引き（すべて標準税率分、税込）\n・事業者向け中古車の返品 315,700円\n・消費者向け中古車の返品 143,500円\n・振込手数料相当額の値引き 42,115円", "q": "売上げに係る対価の返還等に係る消費税額はいくらか。", "choices": ["35,547円（＝(315,700＋143,500＋42,115)×7.8/110）", "39,102円（＝(315,700＋143,500＋42,115)×7.8/100）", "45,574円（＝(315,700＋143,500＋42,115)×10/110）", "32,561円（＝(315,700＋143,500)×7.8/110）"], "exp": "(315,700＋143,500＋42,115)×7.8/110＝35,547円。", "note": ""}, {"cat": "甲・貸倒れ", "ctx": "取引先が破産し、次の売掛金（すべて標準税率の課税売上）が回収できなくなった。\n・中古車代 132,000円\n・タイヤ代 18,700円\n・交換工賃 3,300円", "q": "貸倒れに係る消費税額はいくらか。", "choices": ["10,920円（＝(132,000＋18,700＋3,300)×7.8/110）", "9,360円（＝132,000×7.8/110）", "12,012円（＝(132,000＋18,700＋3,300)×7.8/100）", "14,000円（＝(132,000＋18,700＋3,300)×10/110）"], "exp": "(132,000＋18,700＋3,300)×7.8/110＝10,920円。", "note": ""}, {"cat": "甲・中間納付", "ctx": "甲の前年分の確定消費税額（国税分）は1,008,200円。", "q": "甲の中間申告の回数はどれか。", "choices": ["年1回（6月中間申告）", "年3回", "年11回", "中間申告は不要"], "exp": "48万円超400万円以下なので年1回です（400万円超4,800万円以下で年3回、4,800万円超で年11回）。", "note": ""}, {"cat": "乙・納税義務", "ctx": "乙は令和7年7月に事業を始めた個人で、乙自身の基準期間（令和6年）・特定期間の課税売上高はどちらも0円。課税事業者選択届出書は出していない。\n令和8年9月30日に父の甲（課税事業者・適格請求書発行事業者）が死亡し、乙が相続で甲の事業を引き継いだ。\n甲の基準期間（令和6年）の課税売上高は49,600,478円。", "q": "乙が令和8年中に納税義務を負う期間はどれか。", "choices": ["令和8年10月1日〜12月31日", "令和8年1月1日〜12月31日", "令和8年12月15日〜12月31日", "納税義務はない"], "exp": "乙自身の数字だけで見ると免税です。ただし相続した年は、被相続人（甲）の基準期間の課税売上高が1,000万円を超えていれば、相続の日の翌日から12 係る消費税額の調整（免税→課税）の対象はどれか。", "choices": ["乙自身が免税期間中に仕入れた794,577円だけ", "甲店から引き継いだ4,215,550円と乙自身の794,577円の合計", "甲店から引き継いだ4,215,550円だけ", "どちらも対象外（相続で課税事業者になった場合は調整しない）"], "exp": "免税事業者が課税事業者になるときの棚卸資産の調整（法36条）の対象は、免税期間中の仕入れで控除を受けていないものです。相続の場合は、被相続人が免税事業者だったときだけ、引き継いだ棚卸資産も対象になります。甲は課税事業者ですでに控除しているので、甲店分は対象外です。対象は乙自身の794,577円だけです。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "乙は10月1日から課税事業者になった。乙が免税期間中に仕入れた期首棚卸資産は794,577円（税込）で、品名・数量などの明細は保存している。\n・うち飲食料品（軽減税率）25,920円（適格請求書発行事業者以外から仕入れたもの）\n・残りは車両（標準税率）\n（本問では、非適格分も割合を掛けずに全額を調整対象とする）", "q": "棚卸資産の調整で加算する消費税額はいくらか（この問題では非適格分も全額対象とする）。", "choices": ["56,001円", "54,504円", "57,498円", "55,253円"], "exp": "(794,577−25,920)×7.8/110＝54,504円、25,920×6.24/108＝1,497円、合計56,001円。", "note": "【資料の補足】本試験の問題文には「適格請求書発行事業者以外から仕入れた期首棚卸資産も、割合を掛けずに全額を調整の対象とすること」の記載がないため、大手予備校の解答速報の考え方に合わせて前提を補っています。"}, {"cat": "乙・仕入控除", "ctx": "乙は、定期購読契約による日刊新聞の購読料と、月刊誌の購読料を支払った。", "q": "日刊新聞の購読料の税率はどれか。", "choices": ["6.24％（軽減税率）", "7.8％（標準税率）", "非課税", "不課税"], "exp": "週2回以上発行される新聞の定期購読は軽減税率の対象です。月刊誌は標準税率です。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "乙は同業者団体に通常会費（団体の業務運営に必要な通常会費）を支払った。", "q": "通常会費の扱いとして正しいものはどれか。", "choices": ["不課税（課税仕入れに該当しない）", "課税仕入れ（標準税率）", "非課税", "課税仕入れ（軽減税率）"], "exp": "通常会費には明確な対価関係がないので不課税です（課税仕入れにはなりません）。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "乙は軽油代256,296円を支払った。領収書では軽油引取税23,447円が区分して記載されている。", "q": "課税仕入れの金額はいくらか。", "choices": ["232,849円", "256,296円", "279,743円", "0円"], "exp": "軽油引取税は、明確に区分されていれば課税仕入れの対価に含めません。256,296−23,447＝232,849円。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "乙は従業員とのバーベキューのために、飲食料品25,464円と酒類17,004円を買った。", "q": "酒類17,004円の税率はどれか。", "choices": ["7.8％（標準税率）", "6.24％（軽減税率）", "福利厚生なので不課税", "非課税"], "exp": "酒類は軽減税率の対象となる飲食料品から除かれているので、標準税率です。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "乙は自転車レース大会に協賛金50,000円を支払い、パンフレットに店名が載った。主催団体は適格請求書発行事業者ではない。", "q": "協賛金の扱いとして正しいものはどれか。", "choices": ["広告宣伝の課税仕入れ（適格請求書発行事業者以外からの仕入れの経過措置で控除）", "寄附金なので不課税", "全額を仕入税額控除できる", "非課税"], "exp": "店名が載るという対価関係があるので、広告宣伝費として課税仕入れになります。相手が適格請求書発行事業者以外なので、経過措置の割合だけ控除します。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "古物商の許可を受けている乙は、新車を売るときに消費者から中古車を下取りした（適格請求書はない）。必要事項を記載した帳簿は保存している。", "q": "下取りした中古車の仕入税額控除はどうなるか。", "choices": ["必要事項を記載した帳簿の保存により仕入税額控除の対象になる（古物商の特例）", "適格請求書がないので仕入税額控除はできない", "適格請求書発行事業者以外からの仕入れの経過措置で一定割合だけ控除できる", "下取りは仕入れに当たらないので対象外"], "exp": "古物商が適格請求書発行事業者以外から古物を仕入れた場合、一定の事項を記載した帳簿を保存すれば、請求書等がなくても控除できます。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "乙が適格請求書発行事業者から行った標準税率の課税仕入れの合計は15,863,750円（税込）。", "q": "この課税仕入れに係る消費税額はいくらか（割戻し計算）。", "choices": ["1,124,884円（＝15,863,750×7.8/110）", "1,442,159円（＝15,863,750×10/110）", "1,237,372円（＝15,863,750×7.8/100）", "916,572円（＝15,863,750×6.24/108）"], "exp": "15,863,750×7.8/110＝1,124,884円。", "note": ""}, {"cat": "乙・仕入控除", "ctx": "乙は新車を仕入れたときに、メーカーからリベート83,170円（税込）を受け取った。", "q": "仕入れに係る対価の返還等の消費税額はいくらか。", "choices": ["5,897円", "7,561円", "6,487円", "6,161円"], "exp": "83,170×7.8/110＝5,897円。仕入税額から差し引きます。", "note": ""}, {"cat": "乙・中間納付", "ctx": "乙は令和7年に事業を始め、令和7年分は免税事業者で、確定消費税額はない。\n被相続人の甲は前年分の確定消費税額が1,008,200円で、令和8年分の中間納付504,000円を済ませている。\n乙は令和8年9月30日の相続で甲の事業を引き継いだ。", "q": "乙の令和8年分の中間納付税額はいくらか。", "choices": ["0円（中間申告は不要）", "甲の中間納付額504,000円を引き継ぐ", "課税期間の税額の半分", "252,000円"], "exp": "乙の中間申告が必要かどうかは、乙自身の前の課税期間の確定消費税額で判断します。乙は前年が免税で確定税額がないので、中間申告は不要です。甲の中間納付は甲の申告で精算されるもので、乙には引き継がれません。", "note": ""}, {"cat": "乙・納税義務", "ctx": "乙は令和7年7月に事業を始めた個人で、乙自身の基準期間・特定期間の課税売上高はどちらも0円。令和8年9月30日に父の甲（課税事業者）が死亡し、乙が相続で事業を引き継いだ。\n甲の基準期間（令和6年）の課税売上高は49,600,478円。", "q": "乙の令和8年1月1日〜9月30日の納税義務はどうなるか。", "choices": ["免税（相続の特例は相続の日の翌日以後だけに適用）", "課税（相続の特例は相続した年の1月1日にさかのぼる）", "課税（父の事業を手伝っていたため）", "1月1日〜9月30日の分は甲の申告に含める"], "exp": "相続があった年の納税義務の特例（法10条1項）は、相続の日の翌日からその年の12月31日までの期間だけに適用されます。相続前の期間は乙自身の基準期間（0円）で判定するので免税です。", "note": ""}, {"cat": "乙・納税義務", "ctx": "令和8年9月30日に父の甲（課税事業者）が死亡し、乙が相続で事業を引き継いだ。乙は令和7年7月に開業し、令和7年の乙の課税売上高は1,000万円以下。\n甲の課税売上高：令和6年 49,600,478円、令和7年 約5,600万円", "q": "乙の令和9年分の納税義務の判定に使う基準期間（令和7年）の課税売上高はどれか。", "choices": ["乙の令和7年分と甲の令和7年分の合計", "乙の令和7年分だけ", "甲の令和7年分だけ", "甲の令和6年分"], "exp": "相続の翌年・翌々年は、相続人の基準期間の課税売 "], "exp": "前受賃貸料の性質を持つ建設協力金は、収益に振り替えた時に貸付けの対価となります。住宅の貸付けなので非課税売上げです。", "note": ""}, {"cat": "甲社・課税区分", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\n土地を商業施設経営事業者に更地で貸し付け（期間1月以上）、借主がアスファルト舗装して駐車場として利用している。使用料6,000,000円。", "q": "この土地使用料の取扱いはどれか。", "choices": ["非課税（土地の貸付け）", "課税（駐車場としての利用のため）", "不課税", "課税（期間1月以上のため）"], "exp": "貸主が更地で貸し、舗装等の駐車場施設を借主が設けた場合は土地の貸付けとして非課税です。貸主が駐車場施設を設けて貸す場合は課税になります。", "note": ""}, {"cat": "甲社・課税標準額", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\nビルB及びその敷地を令和8年1月31日に1,050,000,000円で売却（契約書：土地550,000,000円、建物500,000,000円、合理的区分）。別に買主から未経過固定資産税相当額（建物330,233円、土地82,550円）を収受し、不動産賃貸原価から控除していた。", "q": "ビルB売却に係る課税資産の譲渡等の対価の額（税込）はいくらか。", "choices": ["500,330,233円（＝500,000,000＋330,233）", "500,000,000円（＝建物代金のみ）", "500,412,783円（＝500,000,000＋330,233＋82,550）", "1,050,412,783円（＝1,050,000,000＋330,233＋82,550）"], "exp": "未経過固定資産税相当額は譲渡対価の一部です。建物部分は課税（10%）、土地部分82,550円は土地代金とともに非課税売上げになります。", "note": ""}, {"cat": "甲社・課税標準額", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\n課税資産の譲渡等（10%・税込）の合計は1,008,530,242円。国外事業者に支払ったインターネット広告料（事業者向け電気通信利用役務の提供＝特定課税仕入れ）50,184,347円がある。甲社の課税売上割合は95%未満。", "q": "標準税率分の課税標準額はいくらか。", "choices": ["967,030,000円（＝1,008,530,242×100/110＋50,184,347→千円未満切捨）", "916,845,000円（＝1,008,530,242×100/110→千円未満切捨）", "966,729,000円（＝(1,008,530,242−330,233)×100/110＋50,184,347→千円未満切捨）", "962,467,000円（＝(1,008,530,242＋50,184,347)×100/110→千円未満切捨）"], "exp": "課税売上割合95%未満の事業者はリバースチャージが適用され、特定課税仕入れの支払対価（税抜扱いでそのまま）を課税標準に加えます。割戻しはしません。", "note": ""}, {"cat": "甲社・課税標準額に対する消費税額", "ctx": "標準税率分の課税標準額967,030,000円、軽減税率分2,980,717,000円。", "q": "課税標準額に対する消費税額の合計はいくらか。", "choices": ["261,425,080円（＝967,030,000×7.8%＋2,980,717,000×6.24%）", "335,160,360円（＝967,030,000×10%＋2,980,717,000×8%）", "307,924,266円（＝3,947,747,000×7.8%）", "246,339,412円（＝3,947,747,000×6.24%）"], "exp": "国税分の税率は標準7.8%、軽減6.24%。地方消費税分は含めません。", "note": ""}, {"cat": "甲社・課税売上割合", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\n売上値引・戻り高14,247, 474＋1,037,200）", "9,786円（＝預金利息のみ）", "1,046,986円（＝9,786＋1,037,200）"], "exp": "預金利息・公社債投資信託の収益分配金は非課税。株式配当金は出資者の地位に基づく分配で不課税です。", "note": ""}, {"cat": "甲社・課税売上割合", "ctx": "課税売上高（税抜・返還控除後・輸出含む）4,314,835,920円、非課税売上高（返還控除後）985,162,942円。", "q": "課税売上割合はいくらか（端数処理せず）。", "choices": ["4,314,835,920/5,299,998,862≒81.4%", "4,314,835,920/985,162,942", "985,162,942/5,299,998,862≒18.6%", "(4,314,835,920−467,874,500)/5,299,998,862≒72.6%"], "exp": "課税売上割合＝課税売上高（免税売上含む）÷（課税売上高＋非課税売上高）。95%未満なので個別対応方式か一括比例配分方式で計算します。", "note": ""}, {"cat": "甲社・課税仕入れ", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\n給料手当には、在宅ワークのため一人当たり一律に支給される通信費用の補助手当1,245,000円、通常必要と認められる通勤手当8,922,956円が含まれる。", "q": "課税仕入れとなるものはどれか。", "choices": ["通勤手当のみ課税仕入れとなる", "両方とも課税仕入れとなる", "在宅勤務手当のみ課税仕入れとなる", "いずれも給与なので課税仕入れとならない"], "exp": "通常必要な通勤手当は課税仕入れ。実費精算でない一律の在宅勤務手当は給与扱いで課税仕入れになりません。", "note": ""}, {"cat": "甲社・課税仕入れ", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\n①従業員に配付した博覧会（令和7年10月開催）の入場チケット：当期中に従業員が引換給付を受けたことを主催者の請求書等で確認済。②キャンペーン応募者に抽選で配付した博覧会チケット。\n②は景品として外部の当選者に配付したもので、甲社自身や従業員が引換給付を受けたものではない。", "q": "課税仕入れとして仕入税額控除の対象となるものはどれか。", "choices": ["①のみ", "②のみ", "①と②の両方", "いずれも対象外"], "exp": "入場券は物品切手等で購入時は非課税。引換給付を受けた時に課税仕入れになりますが、甲社が引換給付を受けたといえるのは従業員が使用した①のみ。第三者に配付した②は課税仕入れになりません。", "note": "【資料の補足】本試験の問題文には「抽選で配付したチケットについて、甲社自身や従業員が引換えを受けていないこと」の記載がないため、大手予備校の解答速報の考え方に合わせて前提を補っています。"}, {"cat": "甲社・課税仕入れ", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\n販売部門従業員の国内出張旅費3,819,476円（宿泊施設に支払った宿泊税相当額3,000円が請求書等で明確に区分されている）、海外出張旅費3,509,847円（国内空港旅客サービス施設利用料8,200円を含む）。いずれも実費精算・通常必要な金額。", "q": "販売部門の出張旅費のうち課税仕入れとなる金額はいくらか。", "choices": ["3,824,676円（＝3,819,476−3,000＋8,200）", "7,329,323円（＝3,819,476＋3,509,847）", "3,819,476円（＝国内出張旅費の全額）", "3,816,476円（＝3,819,476−3,000）"], "exp": "国内出張旅費は課税仕入れ（明確に区分された宿泊税は不課税）。海外出張旅費は輸出免税等で課税仕入れになりませんが、国内空港の旅客サービス施設利用料は国内の役務で課税仕入れです。", "note": ""}, {"cat": "甲社・課税仕入れ", "ctx": "甲社（食料品製造業・3月決算・適格請求書発行事業者）の令和7年4月1日〜令和8年3月31日の課税期間。税込経理。\n従業員への日当2,200,000円 税率が適用されます。", "note": ""}, {"cat": "甲社・取引分類", "ctx": "甲社（調剤薬局・通所介護施設・サ高住・化粧品販売店を経営、税込経理、当課税期間R4.10.1〜R5.9.30、当期に初めて課税事業者、原則課税）\n介護保険法の「通所介護」に係る介護事業収入 277,144,500円。この中に施設利用者から徴収した食事の提供に要する費用 19,215,560円とおやつ代 1,850,890円が含まれる。\n食事代・おやつ代は、通所介護のサービスの一環として利用者から受け取るもので、介護保険法で利用者負担とされる範囲内のもの。", "q": "食事代・おやつ代の取扱いとして正しいものはどれか。", "choices": ["介護事業収入全体（食事代・おやつ代を含む）が非課税", "食事代・おやつ代だけ軽減税率6.24%の課税", "食事代・おやつ代だけ標準税率7.8%の課税", "食事代は非課税、おやつ代は軽減税率6.24%の課税"], "exp": "介護保険法の居宅サービス（通所介護）に伴う、保険給付対象外の食事の提供等も非課税の居宅サービス等に含まれます（基通6-7-2）。大手予備校の解答速報でも全額非課税として扱われています。", "note": "【資料の補足】本試験の問題文には「食事代・おやつ代が介護保険法で利用者負担とされる範囲内であること」の記載がないため、大手予備校の解答速報の考え方に合わせて前提を補っています。"}, {"cat": "甲社・取引分類", "ctx": "甲社（調剤薬局・通所介護施設・サ高住・化粧品販売店を経営、税込経理、当課税期間R4.10.1〜R5.9.30、当期に初めて課税事業者、原則課税）\nサ高住入居者から徴収した、福祉用具（身体障害者用物品ではない）の貸与費 613,510円と、安否確認・掃除洗濯サポートのサービス費用 643,220円", "q": "これらの取扱いはどれか。", "choices": ["いずれも課税（標準税率7.8%）", "いずれも非課税（住宅の貸付けに付随）", "いずれも非課税（介護保険の居宅サービス）", "福祉用具は非課税、サポート費用は課税"], "exp": "サ高住の福祉用具貸与やサポートサービスは介護保険法に基づく居宅サービス等ではなく、身体障害者用物品にも当たらないため、課税取引（標準税率）です。", "note": ""}, {"cat": "甲社・税率", "ctx": "甲社（調剤薬局・通所介護施設・サ高住・化粧品販売店を経営、税込経理、当課税期間R4.10.1〜R5.9.30、当期に初めて課税事業者、原則課税）\nサ高住での入居者への食事提供の代金 2,957,180円（税抜対価が一人一食640円以下・一日1,920円以下）。また、サ高住で職員に食事を提供して徴収した食事代金 318,250円がある。", "q": "それぞれの税率の組合せとして正しいものはどれか。", "choices": ["入居者分：軽減6.24%／職員分：標準7.8%", "入居者分：標準7.8%／職員分：軽減6.24%", "いずれも軽減6.24%", "いずれも標準7.8%"], "exp": "サ高住入居者への一定金額以下の食事提供は「食事の提供」から除かれ、軽減税率の対象です（平28改正法附則34①一ロ、令）。職員への食事提供はこの特例に当たらず、通常の食事の提供として標準税率になります。", "note": ""}, {"cat": "甲社・取引分類", "ctx": "甲社（調剤薬局・通所介護施設・サ高住・化粧品販売店を経営、税込経理、当課税期間R4.10.1〜R5.9.30、当期に初めて課税事業者、原則課税）\n化粧品売上高 26,077,950円のうち、輸出物品販売場（R4.10.1許可）で所定の手続により免税販売したもの 3,375,950円", "q": "免税販売分の取扱いとして正しいものはどれか。", "choices": ["消費税が免除され、課税売上割合の分母・分子の両方に含める", "消費税が免除され、課税売上割合の計算から除く", "課税（標準税率7.8%）として課税標準額に含める", "非課税として分母のみに含める"], "exp": "輸出物品販売場での免税販売（法8）は免税取引で、輸出取引等と同様に課税売上割合の分子・分母に含めます。", "note": "※令和7年度改正により、令和8年11月1日以後は輸出物品販売場制度がリファンド方式（いったん課税して出国時に返金）に移行します。令和8年4月時点では従来の免税販売方式のため、現行法でも結論は同じです。"}, {"cat": "甲社・取引分類", "ctx": "甲社（調剤薬局・通所介護施設・サ高住・化粧品販売店を経営、税込経理、当課税期間R4.10.1〜R5.9.30、当期に初めて課税事業者、原則課税）\n営業用車両を売却（売却価額2,120,000円、売却益1,082,360円）。売却代金とは別にリサイクル預託金 14,330円が返還された。", "q": "課税標準額に算入する車両売却の金額はどれか。", "choices": ["2,120,000円（売却価額）", "1,082,360円（売却益）", "2,134,330円（売却価額＋リサイクル預託金）", "1,096,690円（売却益＋リサイクル預託金）"], "exp": "資産の譲渡の対価は売却益ではなく売却価額（税込）で捉えます。リサイクル預託金の譲渡は金銭債権の譲渡で非課税です。", "note": ""}, {"cat": "甲社・課税売上割合", "ctx": "甲社（調剤薬局・通所介護施設・サ高住・化粧品販売店を経営、税込経理、当課税期間R4.10.1〜R5.9.30、当期に初めて課税事業者、原則課税）\nリサイクル預託金の譲渡 14,330円、内国法人株式の売却価額 4,764,800円\n（リサイクル預託金は、預託金の返還を受ける権利＝金銭債権として扱う）", "q": "課税売上割合の分母に算入する額の組合せとして正しいものはどれか。", "choices": ["預託金716.5円（＝14,330×5%）＋株式238,240円（＝4,764,800×5%）", "預託金14,330円＋株式4,764,800円", "預託金0円＋株式238,240円（＝4,764,800×5%）", "預託金716.5円（＝14,330×5%）＋株式0円"], "exp": "有価証券や、資産の譲渡等の対価として取得したもの以外の金銭債権の譲渡は、対価の5%相当額を分母に算入します（令48⑤）。リサイクル預託金もこれに当たります。", "note": "【資料の補足】本試験の問題文には「リサイクル預託金を金銭債権として扱うこと」の記載がないため、大手予備校の解答速報の考え方に合わせて前提を補っています。"}, {"cat": "甲社・課税標準額", "ctx": "甲社（調剤薬局・通所介護施設・サ高住・化粧品販売店を経営、税込経理、当課税期間R4.10.1〜R5.9.30、当期に初めて課税事業者、原則課税）\n標準税率の課税売上（税込）：自由調剤2,457,380円、市販薬1,274,650円、福祉用具貸与613,510円、サポート費用643,220円、化粧品（免税分除く）22,702,000円、車両売却2,120,000円、職員食事代318,250円　合計30,129,010円", "q": "7.8%分の課税標準額はどれか。", "choices": ["27,390,000円（＝30,129,010×100/110→千円未満切捨）", "27,897,000円（＝30,129,010×100/108→千円未満切捨）", "27,390,009円（＝30,129,010×100/110、端数処理なし）", "26,446,000円（＝(30,129,010−2,120,000+1,082,360)×100/110→千円未満切捨）"], "exp": "税込金額を100/110で割り戻し、千円未満を切り捨てます。車両は売却益ではなく売却価額で含めます。大手予備校の解答速報の数値とも一致します。", "note": ""}, {"cat": "甲社・課税標準額に対する消費税額", "ctx": "7.8%分の課税標準額 27,390,000円、6.24%分の課税標準額 3,526,000円", "q": "課税標準額に対する消費税額の合計はどれか。", "choices": ["2,356,442円（＝27,390,000×7.8%＋3,526,000×6.24%）", "2,411,448円（＝(27,390,000+3,526,000)×7.8%）", "1,929,158円（＝(27,390,000+3,526,000)×6.24%）", "2,198,477円（＝27,390,000×7.8%＋3,526,000×1.76%）"], "exp": "税率ごとに国税分の税率（7.8%・6.24%）を掛けて合計します。", "note": ""}, {"cat": "甲社・課税売上割合", "ctx": "課税売上割合の分子：税抜課税売上 27,390,009円（7.8%）＋3,526,990円（6.24%）＋輸出物品販売場の免税売上 3,375,950円。売上値引（税込）は7.8 ,700)→百円未満切捨）", "27,956,450円（＝28,102,854−146,404、端数処理なし）", "20,276,700円（＝28,102,854−7,826,104→百円未満切捨、調整なし）", "12,597,000円（＝28,102,854−7,826,104−7,679,700→百円未満切捨）"], "exp": "減算調整額は控除対象仕入税額から差し引きます（146,404円）。差引税額は百円未満切捨てです。予備校により調整前の控除税額が数千円ずれるため、ここでは前提金額を指定しています。", "note": ""}, {"cat": "X社・中間納付", "ctx": "X社（不動産業、税込経理、当課税期間R5.1.1〜R5.9.30の9か月、原則課税）\n前課税期間（第7期・12か月）の確定差引税額：当初申告 5,133,600円。R5.3.27に更正の請求をし、R5.5.10に更正処分で 4,863,200円に確定。仮決算による中間申告はしていない。", "q": "一月中間申告・三月中間申告の要否の組合せとして正しいものはどれか。", "choices": ["一月中間：不要（直前期の年税額4,800万円以下）／三月中間：必要（3か月分100万円超）", "一月中間：必要／三月中間：不要", "いずれも必要", "いずれも不要"], "exp": "一月中間申告は直前期の年税額が4,800万円超（月額400万円超）の場合、三月中間申告は400万円超4,800万円以下の場合です（法42）。5,133,600÷12×3＝1,283,400円＞100万円。三月中間申告があるため六月中間申告は不要です。", "note": ""}, {"cat": "X社・中間納付", "ctx": "三月中間申告対象期間：第1（R5.1〜3月）、第2（R5.4〜6月）。第3（7〜9月）は当期末を含むので中間申告なし。直前期の確定差引税額は当初 5,133,600円、R5.5.10の更正で 4,863,200円。", "q": "中間納付税額の合計はどれか。", "choices": ["2,499,100円（＝5,133,600÷12＝427,800×3→1,283,400＋4,863,200÷12＝405,266（円未満切捨）×3＝1,215,798→百円未満切捨1,215,700）", "2,566,800円（＝5,133,600÷12×3×2）", "2,431,600円（＝4,863,200÷12×3×2）", "3,782,500円（＝第1〜第3の3期分）"], "exp": "各中間申告対象期間の末日までに確定した税額が基準です。第1期末（3/31）時点では更正前の5,133,600円、第2期末（6/30）時点では更正後の4,863,200円で計算します。更正の請求日ではなく確定日で判断する点がポイントです。大手予備校3校の解答速報で一致しています。（月数按分は1か月当たりの額で円未満を切り捨ててから乗じるため、4,863,200÷12×3＝1,215,798円→百円未満切捨1,215,700円です。）", "note": ""}]}, {"year": "R04", "label": "令和4年度（第72回）", "questions": [{"cat": "甲社・納税義務", "ctx": "甲社（3月決算）は令和3年2月1日に乙社が全額出資して設立（資本金9,900,000円）。当課税期間は令和4年4月1日〜令和5年3月31日。前々課税期間＝令和3年2月1日〜3月31日、前課税期間＝令和3年4月1日〜令和4年3月31日。", "q": "当課税期間の基準期間はどれか。", "choices": ["令和3年2月1日〜令和3年3月31日（前々事業年度）", "令和3年4月1日〜令和4年3月31日（前事業年度）", "令和3年4月1日〜令和3年9月30日", "基準期間はない（設立2期目まで）"], "exp": "法人の基準期間は「その事業年度の前々事業年度」です（法2①十四）。設立初年度が2か月でも前々事業年度に当たります。", "note": ""}, {"cat": "甲社・納税義務", "ctx": "甲社の基準期間（令和3年2月1日〜3月31日、2か月）の資産の譲渡等の金額326,550円、うち非課税取引25円。返還等なし。", "q": "基準期間における課税売上高（年換算）はいくらか。", "choices": ["1,959,150円（＝(326,550−25)÷2×12）", "326,525円（＝326,550−25、年換算なし）", "1,959,300円（＝326,550÷2×12、非課税を控除しない）", "1,781,045円（＝(326,550−25)×100/110÷2×12）"], "exp": "基準期間が1年でない法人は、課税売上高を月数で割って12を掛け年換算します（法9②二）。前々期は設立期で免税事業者のため税抜処理はしません（税込金額のまま）。1,000万円以下なので法9①ではまだ免税です。", "note": ""}, {"cat": "甲社・納税義務", "ctx": "甲社：基準期間の課税売上高1,959,150円。資本金9,900,000円。全株式を乙社が保有（乙社の基準期間相当期間の課税売上高は5億円以下）。", "q": "法12の2（新設法人の特例）は適用されるか。", "choices": ["適用されない（基準期間がある事業年度で、かつ資本金も1,000万円未満のため）", "適用される（設立3期目までは常に適用）", "適用される（資本金が1,000万円以上のため）", "適用される（乙社の売上が5億円以下のため）"], "exp": "新設法人の特例は「基準期間がない事業年度」で資本金1,000万円以上の法人が対象です。甲社は3期目で基準期間があり、資本金も990万円なので適用されません。", "note": ""}, {"cat": "甲社・納税義務", "ctx": "甲社は乙社の飲食店部門の分社化目的で設立され、設立時に予定されていた事後設立契約に基づき、令和3年7月1日に乙社から内装工事4,763,000円・厨房機器4,356,000円・調理器具561,000円（税込）の譲渡を受けた。甲社の資本金は9,900,000円。", "q": "法12の3（分割等）の「一定の事後設立」に該当するかの判定で、譲渡資産の対価の合計額と比較するのはどれか。", "choices": ["9,680,000円（＝4,763,000＋4,356,000＋561,000）が資本金9,900,000円の50%（4,950,000円）を超えるので該当", "9,680,000円が資本金9,900,000円以下なので該当しない", "8,800,000円（＝9,680,000×100/110）が1,000万円未満なので該当しない", "9,680,000円が1,000万円未満なので該当しない"], "exp": "事後設立は、設立時に予定されていた資産の譲渡で、その対価の額が新設法人の設立時の資本金等の額の50％を超えるものが対象です。9,680,000円＞4,950,000円（＝9,900,000×50％）なので一定の事後設立に該当し、分割等があった場合の特例の対象になります。大手予備校の解答速報も同じ結論です。", "note": ""}, {"cat": "甲社・納税義務", "ctx": "甲社は法12の3の分割等（一定の事後設立）の新設分割子法人に該当し、分割等があった日は令和3年7月1日（前事業年度中）。乙社（新設分割親法人）は甲社株式を100%保有。甲社自身の基準期間の課税売上高は1,000万円以下、特定期間はない。乙社の当課税期間の基準期間に対応する期間の課税売上高は約4億3,630万円。", "q": "甲社の当課税期間（令和4年4月〜令和5年3月）の納税義務はどうなるか。", "choices": ["新設分割親法人の課税売上高が1,000万円超のため納税義務あり", "甲社自身の基準期間の課税売上高が1,000万円以下なので免税", "特定期間の給与等の額で判定し免税", "乙社の課税売上高が5億円以下なので免税"], "exp": "分割等があった事業年度の翌事業年度（当課税期間）は、新設分割親法人の基準期間に対応する期間の課税売上高が1,000万円を超える場合、新設分割子法人は納税義務を免除されません（法12②）。翌事業年度は特定要件の判定は不要です（特定要件で判定するのは翌々事業年度以後の法12③）。約4億3,630万円＞1,000万円なので納税義務があります。", "note": ""}, {"cat": "甲社・税率区分", "ctx": "店舗Aの飲食売上（店内飲食）41,283,049円のうち146,295円は開店1周年キャンペーンで飲食代金の5%を決済時に値引きしたもの。甲社は「借方 売上値引・貸方 売上高」と処理している。", "q": "この146,295円の取扱いとして正しいものはどれか。", "choices": ["決済時の値引きなので課税標準から直接控除する（売上の減額）", "売上げに係る対価の返還等として税額控除する", "不課税取引", "非課税取引"], "exp": "取引時点で値引きした金額は、そもそも対価の 000,000円・入会金500,000円で取得）。\n製造機器とゴルフ会員権は、いずれもA社が事業用に保有していた資産。", "q": "製造機器の下取りとゴルフ会員権の譲渡の事業区分はどれか。", "choices": ["いずれも第四種事業", "製造機器は第三種、ゴルフ会員権は非課税", "いずれも第六種事業", "製造機器は第四種、ゴルフ会員権は非課税"], "exp": "事業用固定資産の売却は第四種です。ゴルフ会員権は株式や預託金債権ではなく利用権の譲渡で課税され、これも第四種です。店舗スペースの賃貸は不動産業の第六種です。", "note": "【資料の補足】本試験の問題文には「製造機器とゴルフ会員権がいずれも事業用の資産であること」の記載がないため、大手予備校の解答速報の考え方に合わせて前提を補っています。"}, {"cat": "A社・課税区分", "ctx": "A社が受けた雇用調整助成金1,400,000円と、従業員から収受した社宅の家賃665,000円。", "q": "それぞれの取扱いとして正しいものはどれか。", "choices": ["助成金は不課税、社宅家賃は非課税", "いずれも第六種事業の課税売上", "助成金は非課税、社宅家賃は不課税", "いずれも不課税"], "exp": "雇用調整助成金は対価性がないので不課税、住宅の貸付けは非課税です。どちらも簡易課税の計算には関係しません。", "note": ""}, {"cat": "A社・課税標準", "ctx": "A社の標準税率分の課税売上（税込）合計4,408,250円、軽減税率分の課税売上（税込）合計67,741,680円。", "q": "課税標準額の合計はいくらか。", "choices": ["66,730,000円（＝4,408,250×100/110→4,007,000＋67,741,680×100/108→62,723,000）", "66,731,277円（＝4,408,250×100/110＋67,741,680×100/108）", "65,590,000円（＝(4,408,250＋67,741,680)×100/110→千円未満切捨）", "62,723,000円（＝67,741,680×100/108→千円未満切捨、標準税率分を漏らす）"], "exp": "税率ごとに税抜にして千円未満を切り捨てます。4,007,500→4,007,000円、62,723,777→62,723,000円、合計66,730,000円。", "note": ""}, {"cat": "A社・貸倒れ", "ctx": "A社は事業者に販売した食パンの売掛金519,480円が貸倒れた。内訳は設立事業年度（免税事業者だった期間）に販売した98,280円と、前事業年度（課税事業者）に販売した421,200円。", "q": "貸倒れに係る消費税額はいくらか。", "choices": ["24,336円（＝421,200×6.24/108）", "30,014円（＝519,480×6.24/108）", "29,866円（＝421,200×7.8/110）", "36,836円（＝519,480×7.8/110）"], "exp": "免税事業者であった期間の売上げに係る債権の貸倒れは、控除の対象になりません（基通14-2-4）。421,200×6.24/108＝24,336円。", "note": ""}, {"cat": "A社・貸倒回収", "ctx": "A社が前事業年度に貸倒れとして消費税額の控除を受けた食パン（軽減税率）の売掛金の一部320,760円を当期に回収した（償却済債権取立益）。", "q": "貸倒回収に係る消費税額はいくらか。", "choices": ["18,532円（＝320,760×6.24/108）", "22,744円（＝320,760×7.8/110）", "25,660円（＝320,760×8/100）", "0円（不課税なので加算しない）"], "exp": "控除を受けた貸倒債権を回収したときは、回収額に係る消費税額を課税標準額に対する消費税額に加算します（法39③）。", "note": ""}, {"cat": "A社・みなし仕入率", "ctx": "A社の各事業の売上割合：第一種3.30%、第二種7.99%、第三種83.91%、第四種2.69%、第六種2.09%。", "q": "特例計算（75%ルール）のうち、2種類の事業の組合せで適用できるものとして正しいものはどれか。", "choices": ["第一種＋第三種、第二種＋第三種、第三種＋第四種、第三種＋第六種（いずれも75%以上 614,241,600×100/108÷9×12）"], "exp": "法人の基準期間が1年でない場合は、基準期間の課税売上高を月数で割って12を掛けて年換算します（法9②二）。基準期間に課税事業者なので税抜きにします。1,000万円を超えるので納税義務があります。", "note": ""}, {"cat": "問1・課税標準", "ctx": "Ａ建物（居住用マンション）の賃貸料収入25,340,000円には、退去した賃借人の敷金から差し引いた原状回復費相当額580,000円が含まれる（実費精算はしない）。", "q": "原状回復費相当額580,000円の扱いとして正しいものはどれか。", "choices": ["原状回復という役務提供の対価として課税売上げ", "住宅の貸付けの対価として非課税売上げ", "敷金の精算なので不課税（対象外）", "損害賠償金として不課税"], "exp": "賃借人に代わって原状回復工事を行った対価なので課税資産の譲渡等になります。住宅家賃（非課税）とは区別します。", "note": ""}, {"cat": "問1・課税区分", "ctx": "Ｂ建物（居住用マンション）の賃貸料収入には、契約満了後も引き続き居住する賃借人から受け取った更新料1,184,000円が含まれる。", "q": "この更新料の扱いはどれか。", "choices": ["住宅の貸付けの対価として非課税", "契約更新の事務手数料として課税", "権利金の一種として不課税", "課税だが仕入税額控除の対象外"], "exp": "居住用の更新料は住宅の貸付けの対価の一部と考えられるので、家賃と同じく非課税です。", "note": ""}, {"cat": "問1・課税区分", "ctx": "Ｃ建物の3階の一室を、賃借人が無断で事務所として使っていたため、当期の6月1日に事務所用に契約を変更した。契約変更前に受け取った額は960,000円、変更後は648,000円。", "q": "課税売上げになるのはどれか。", "choices": ["変更後の648,000円だけ", "960,000円と648,000円の両方", "どちらも非課税", "変更前の960,000円だけ"], "exp": "住宅の貸付けかどうかは契約で判断します。契約上が居住用だった期間は、実際は事務所として使っていても非課税で、事務所用に変更した後は課税になります。", "note": ""}, {"cat": "問1・課税区分", "ctx": "Ｅ土地は事業者に借地権を設定して貸している（相手はその上に建物を建てて使用）。地代収入10,500,000円には、借地権の更新料1,500,000円が含まれる。", "q": "地代と更新料の扱いはどれか。", "choices": ["どちらも非課税", "地代は非課税、更新料は課税", "どちらも課税", "地代は課税、更新料は非課税"], "exp": "土地の貸付けは非課税で、借地権の更新料も土地の上に存する権利の設定等の対価として非課税です。", "note": ""}, {"cat": "問1・課税区分", "ctx": "Ｆ土地（更地）を資材置き場として2月16日～3月31日の契約で貸したが、工事が早く終わり3月9日に明渡しを受けた。実際に貸した期間に対応する2,200,000円を受け取った。", "q": "この地代の扱いとして正しいものはどれか。", "choices": ["契約上の期間が1か月以上なので非課税", "実際の期間が1か月未満なので課税", "資材置き場は施設の貸付けなので課税", "契約が途中で終わったので不課税"], "exp": "貸付期間が1か月未満の土地の貸付けは課税ですが、その判定は契約上の貸付期間で行います（基通6-1-4）。契約上は1か月以上なので非課税です。大手予備校の解答速報も非課税で一致しています。", "note": ""}, {"cat": "問1・課税区分", "ctx": "Ｄ建物（居住用マンション）は国外にあり、甲社が国外で購入して賃貸している。", "q": "Ｄ建物の賃貸料収入8,540,000円の扱いはどれか。", "choices": ["国外取引なので不課税（課税売上割合の計算にも入れない）", "住宅の貸付けなので非課税", "輸出免税", "非課税資産の輸出として課税売上割合の分母分子に入れる"], "exp": "資産の貸付けの内外判定は貸付け時の資産の所在地で行います。国外にある建物の貸付けは国外取引で、課税の対象外です。", "note": ""}, {"cat": "問1・課税標準", "ctx": "甲社はＤ建物用に、国内のメーカーから宅配ボックスを378,000円で買い、輸出してＤ建物に取り付けた。輸出時の本船甲板渡し価格（FOB）は400,000円。", "q": "課税売上割合の計算での扱いとして正しいものはどれか。", "choices": ["400,000円を分母・分子の両方に入れる", "378,000円を分母・分子の両方に入れる", "400,000円を分母だけに入れる", "課税売上割合の計算には入れない"], "exp": "国外で自己使用するための資産の輸出は輸出取引等とみなされ（法31②）、本船甲板渡し価格を課税売上割合の分母・分子の両方に入れます。", "note": ""}, {"cat": "問1・課税区分", "ctx": "不動産販売事業収入のうちＧ建物（中古居住用マンション）684,550,000円には土地部分475,630,000円が含まれる。", "q": "課税売上げになる金額（税込）はいくらか。", "choices": ["208,920,000円（＝684,550,000−475,630,000）", "684,550,000円（＝全額）", "0円（＝居住用なので全額非課税）", "193,444,444円（＝(684,550,000−475,630,000)×100/108）"], "exp": "住宅の貸付けは非課税ですが、住宅の譲渡は建物部分が課税、土地部分が非課税です。問いは税込金額なので割戻し前の金額で答えます。", "note": ""}, {"cat": "問1・課税区分", "ctx": "Ｉ土地（宅地）は当期3月8日に購入し、5月に造成工事を行ってから6月23日に71,336,000円で売却した。\n造成工事の費用は5,500,000円（税込）。造成後は土地だけを売却した（建物はない）。", "q": "Ｉ土地の売却と造成費用の扱いとして正しいものはどれか。", "choices": ["売却は非課税、造成費用5,500,000円は「その他の資産の譲渡等にのみ要するもの」", "売却は課税、造成費用は「課税資産の譲渡等にのみ要するもの」", "売却は非課税、造成費用は「共通課税仕入れ」", "造成した土地は製品なので売却は課税"], "exp": "造成をしても土地の譲渡は非課税です。土地の売却のためだけの造成費用なので、非課税売上げに対応する課税仕入れになります。", "note": ""}, {"cat": "問1・課税標準", "ctx": "その他事業収入：仲介手数料40,276,000円（居住用アパートの賃貸借11,235,000円、事業用ビルの賃貸借10,401,000円、中古戸建住宅の売買18,640,000円）、保険代理店収入4,278,000円、ローン斡旋事務手数料120,000円。", "q": "課税売上げになるもの（税込）の合計はいくらか。", "choices": ["44,674,000円（＝40,276,000＋4,278,000＋120,000）", "33,439,000円（＝44,674,000−11,235,000）", "40,276,000円（＝仲介手数料だけ）", "14,799,000円（＝10,401,000＋4,278,000＋120,000）"], "exp": "仲介手数料は、仲介の対象が住宅や土地でも仲介という役務の対価なので課税です。保険代理店手数料、ローン斡旋手数料も役務提供の対価で課税です。", "note": ""}, {"cat": "問1・課税標準", "ctx": "雑収入：モデルルームで使った照明器具（取得時に全額費用処理）を甲社の役員に50,000円で譲渡した。譲渡時の時価は230,000円。", "q": "課税標準に入れる金額（税込）はいくらか。", "choices": ["230,000円（時価の50%未満の対価なので時価）", "50,000円（実際の対価）", "115,000円（時価の50%）", "0円（費用処理済みなので対象外）"], "exp": "法人が役員に資産を時価の50%未満で譲渡した場合は低額譲渡となり、時価を対価とみなします（法28①ただし書）。50,000＜230,000×50%＝115,000なので低額譲渡です。", "note": ""}, {"cat": "問1・課税区分", "ctx": "Ｂ建物（居住用）で契約を解除した賃借人が明渡し期日を1か月過ぎても退去しなかったため、通常の家賃の1.5倍に当たる損害賠償金180,000円を受け取った。", "q": "この損害賠償金の扱いとして正しいものはどれか。", "choices": ["実質的に住宅家賃なので非課税", "損害賠償金なので不課税", "明渡し遅延の違約金として課税", "1.5倍のうち通常家賃分だけ非課税、残りは不課税"], "exp": "明渡し遅延による損害賠償金は、実質的に資産の貸付けの対価（ここでは住宅の家賃）とされるので非課税売上げとなり、課税売上割合の分母に入ります。", "note": ""}, {"cat": "問1・課税区分", "ctx": "前課税期間に貸倒れ処理したＢ建物（居住用）の未収家賃210,000円を、当期に回収した。", "q": "この回収の扱いとして正しいものはどれか。", "choices": ["非課税売上げに係るものなので、貸倒れ回収の税額加算（控除過大調整）はない", "210,000×6.3/108を控除過大調整税額とする", "210,000円を課税売上割合の分母に入れる", "210,000×100/108を課税標準に入れる"], "exp": "貸倒れ回収で税額を加算するのは課税売上げに係る債権の場合だけです。住宅家賃は非課税なので調整はなく、すでに前期に売上げに計上済みなので課税売上割合にも入れません。", "note": ""}, {"cat": "問1・課税標準", "ctx": "甲社の課税資産の譲渡等の対価の額（税込）の合計は591,092,000円（全て8%時代の取引）。", "q": "課税標準額はいくらか。", "choices": ["547,307,000円（＝591,092,000×100/108→千円未満切捨）", "547,307,407円（＝591,092,000×100/108（切捨てなし））", "537,356,000円（＝591,092,000×100/110→千円未満切捨）", "547,140,000円（＝(591,092,000−230,000＋50,000)×100/108→千円未満切捨）"], "exp": "旧税率8%の取引は108で割り戻し、千円未満を切り捨てます。", "note": ""}, {"cat": "問1・課税標準", "ctx": "課税標準額は547,307,000円（全て8%時代の取引）。", "q": "課税標準額に対する消費税額はいくらか。", "choices": ["34,480,341円（＝547,307,000×6.3%）", "43,784,560円（＝547,307,000×8%）", "42,689,946円（＝547,307,000×7.8%）", "34,480,366円（＝547,307,407×6.3%）"], "exp": "旧税率8%のうち国税は6.3%（残り1.7%は地方消費税）。千円未満切捨て後の課税標準額に6.3%を掛けます。", "note": ""}, {"cat": "問1・課税売上割合", "ctx": "甲社の当期の課税売上高（税抜）547,307,407円、非課税資産の輸出等（外国法人の社債利息300,000円、宅配ボックスの国外移送FOB400,000円）700,000円、非課税売上高1,064,985,530円。", "q": "課税売上割合（分子/分母）として正しいものはどれか。", "choices": ["548,007,407/1,612,992,937（＝(547,307,407＋700,000)/(547,307,407＋700,000＋1,064,985,530)）", "547,307,407/1,612,292,937（＝547,307,407/(547,307,407＋1,064,985,530)）", "548,007,407/1,612,292,937（＝(547,307,407＋700,000)/(547,307,407＋1,064,985,530)）", "547,307,407/1,612,992,937（＝547,307,407/(547,307,407＋700,000＋1,064,985,530)）"], "exp": "非課税資産の輸出（非居住者発行の社債利息）と国外移送のFOB価格は、分母・分子の両方に入れます。約33.97%で95%未満なので按分計算が必要です。", "note": ""}, {"cat": "問1・課税区分", "ctx": "甲社は国内に所在する合資会社の出資持分（帳簿価額3,000,000円）を3,600,000円で売却した。", "q": "課税売上割合の分母に入れる金額はいくらか。", "choices": ["3,600,000円（＝譲渡対価の全額）", "180,000円（＝3,600,000×5%）", "600,000円（＝売却益）", "0円（入れない）"], "exp": "合資会社などの持分は有価証券に類するものとして非課税ですが、株券等のような「対価の5%だけ分母に入れる」特例（令48⑤）の対象外なので、対価の全額を分母に入れます。", "note": ""}, {"cat": "問1・仕入区分", "ctx": "不動産賃貸事業原価のうち、Ｄ建物（国外）関係：現地（国外）の管理会社に払った管理費550,000円、国内の管理会社を通じた国外広告掲載料54,000円（電気通信利用役務ではない）、国内の弁護士へのコンサルタント料540,000円。\n国外広告掲載料は、D建物の入居者を募集するために国外の媒体に掲載したもので、役務の提供は国外で行われている。", "q": "課税仕入れ（課税資産の譲渡等にのみ要するもの）になるものはどれか。", "choices": ["コンサルタント料540,000円だけ", "管理費・広告料・コンサルタント料の全て", "管理費550,000円とコンサルタント料540,000円", "どれも課税仕入れにならない"], "exp": "国外での役務提供（現地管理・国外の広告掲載）は国外取引で課税仕入れになりません。国内の弁護士の役務は国内取引の課税仕入れで、国外の資産の貸付け（課税資産の譲渡等に当たる国外取引）に対応するので「課税資産の譲渡等にのみ要するもの」です。", "note": "【資料の補足】本試験の問題文には「国外広告の役務の提供が国外で行われていること」の記載がないため、大手予備校の解答速報の考え方に合わせて前提を補っています。"}, {"cat": "問1・仕入区分", "ctx": "Ａ建物（居住用）の退去時の原状回復工事費用560,000円（修繕費）。この工事の費用相当額580,000円は賃借人から収受している（課税売上げ）。\n原状回復工事は、賃借人から収受する原状回復費用（課税売上げ）に対応して行ったもの。", "q": "修繕費560,000円の区分はどれか。", "choices": ["課税資産の譲渡等にのみ要するもの", "その他の資産の譲渡等にのみ要するもの（住宅家賃に対応）", "共通課税仕入れ", "課税仕入れに当たらない"], "exp": "賃借人から受け取る原状回復費（課税売上げ）に対応する工事なので、課税資産の譲渡等にのみ要するものです。", "note": ""}, {"cat": "問1・仕入区分", "ctx": "Ｈ建物（事務所用ビル）の建築費は合計280,550,000円。うち25,584,000円は前期に課税仕入れを行い前期末に未成工事支出金に計上していたもの、254,966,000円は当期に課税仕入れを行ったもの。甲社は未成工事支出金も課税仕入れを行った日に控除している。", "q": "当期の課税仕入れ（課税資産の譲渡等にのみ要するもの）に入れる金額はいくらか。", "choices": ["254,966,000円（当期に課税仕入れした分だけ）", "280,550,000円（当期に費用計上した全額）", "25,584,000円（未成工事支出金分だけ）", "0円（完成・引渡し時にまとめて控除するので前期分）"], "exp": "課税仕入れを行った日の属する課税期間に控除するので、前期に行った25,584,000円は前期に控除済みです。当期分254,966,000円だけを入れます。", "note": ""}, {"cat": "問1・仕入区分", "ctx": "Ｊ戸建住宅は当期に土地を購入して住宅を建てて売却した（建物部分は課税売上げ、土地部分は非課税売上げ）。宅地造成費用800,000円、建物建築費23,189,000円。", "q": "それぞれの区分として正しいものはどれか。", "choices": ["造成費用は共通課税仕入れ、建築費は課税資産の譲渡等にのみ要するもの", "どちらも課税資産の譲渡等にのみ要するもの", "造成費用はその他の資産の譲渡等にのみ要するもの、建築費は課税資産の譲渡等にのみ要するもの", "どちらも共通課税仕入れ"], "exp": "戸建住宅（建物と土地の一括譲渡）のための宅地造成費用は、建物（課税）と土地（非課税）の両方の売上げに関係するので共通課税仕入れです。大手予備校の解答速報も一致しています。", "note": ""}, {"cat": "問1・仕入区分", "ctx": "福利厚生費の国内慰安旅行費用1,327,500円には、予定変更による旅行会社へのキャンセル料（違約金）30,000円と、キャンセル事務手数料1,620円が含まれる。", "q": "共通課税仕入れに入れる金額はいくらか。", "choices": ["1,297,500円（＝1,327,500−30,000）", "1,295,880円（＝1,327,500−30,000−1,620）", "1,327,500円（＝全額）", "1,325,880円（＝1,327,500−1,620）"], "exp": "キャンセル料（違約金）は損害賠償の性格なので課税仕入れになりませんが、キャンセル事務手数料は事務という役務の対価なので課税仕入れです。", "note": ""}, {"cat": "問1・仕入区分", "ctx": "支払手数料には、外国法人乙社（非居住者）が発行する社債を取得するため国内の証券会社に払った媒介手数料80,000円が含まれる。社債利息300,000円は非課税資産の輸出等として課税売上割合の分子にも入れる。", "q": "この媒介手数料の区分はどれか。", "choices": ["課税資産の譲渡等にのみ要するもの", "その他の資産の譲渡等にのみ要するもの", "共通課税仕入れ", "課税仕入れに当たらない"], "exp": "非課税資産の輸出等は、仕入税額控除の上では課税資産の譲渡等とみなされます（法31①）。そのためだけに要した課税仕入れは「課税資産の譲渡等にのみ要するもの」になります。", "note": ""}, {"cat": "問1・仕入区分", "ctx": "諸会費：同業者団体の会費80,000円（団体の通常業務の運営のために経常的に使われる会費）、ゴルフクラブの年会費120,000円、法人用クレジットカードの年会費23,760円。", "q": "課税仕入れになるものの合計はいくらか。", "choices": ["143,760円（＝120,000＋23,760）", "223,760円（＝80,000＋120,000＋23,760）", "200,000円（＝80,000＋120,000）", "23,760円（＝クレジットカード年会費だけ）"], "exp": "通常の業務運営のための同業者団体の会費は対価性がなく不課税です。ゴルフクラブの年会費とクレジットカードの年会費は役務の対価として課税仕入れです。", "note": ""}, {"cat": "問1・仕入税額控除", "ctx": "課税仕入れの合計（税込）：課税資産の譲渡等にのみ要するもの288,547,000円、その他の資産の譲渡等にのみ要するもの14,642,200円、共通課税仕入れ43,670,120円（全て8%時代）。", "q": "課税資産の譲渡等にのみ要する課税仕入れ等の税額はいくらか。", "choices": ["16,831,908円（＝288,547,000×6.3/108）", "21,373,851円（＝288,547,000×8/108）", "16,525,873円（＝288,547,000×6.3/110）", "16,671,604円（＝288,547,000×6.24/108）"], "exp": "旧税率8%時代の課税仕入れは、支払対価×6.3/108で国税部分の税額を計算します。", "note": "※出題当時（令和元年度）は区分記載請求書等保存方式前の請求書等保存方式でした。令和5年10月からは適格請求書等保存方式となり、現行法では原則として適格請求書等の保存が控除の要件です（本問は適格請求書等を保存している前提で解答しています）。"}, {"cat": "問1・仕入税額控除", "ctx": "課税資産の譲渡等にのみ要する税額16,831,908円、共通課税仕入れ等の税額2,547,423円、課税売上割合548,007,407/1,612,992,937（約33.97%）。一括比例配分方式による額は6,874,230円。", "q": "個別対応方式による仕入控除税額と、採用する方式の組み合わせはどれか。", "choices": ["17,697,383円（＝16,831,908＋2,547,423×548,007,407/1,612,992,937）で個別対応方式", "19,379,331円（＝16,831,908＋2,547,423）で個別対応方式", "6,584,044円（＝(16,831,908＋2,547,423)×548,007,407/1,612,992,937）で個別対応方式", "6,874,230円（＝一括比例配分方式の額）で一括比例配分方式"], "exp": "個別対応方式では、課税のみ対応の税額は全額、共通対応分は課税売上割合を掛けた額を控除します。一括比例配分方式より多いので個別対応方式を採用します。", "note": ""}, {"cat": "問1・調整対象固定資産", "ctx": "平成28年（甲社の前々々課税期間＝1月1日～12月31日）に取得した資産：営業用車両（1台1,650,000円・うち付随費用153,000円×3台）、応接セット（社会通念上一の取引単位、1,180,000円・うち運搬費110,000円）、ゴルフ場利用株式3,672,000円。いずれも税込（8%）。", "q": "調整対象固定資産に当たるものはどれか。", "choices": ["営業用車両とゴルフ場利用株式", "3つ全て", "ゴルフ場利用株式だけ", "営業用車両と応接セット"], "exp": "一の取引単位ごとの税抜支払対価が100万円以上かで判定し、付随費用は除きます。車両は(1,650,000−153,000)×100/108＝1,386,111円で該当、応接セットは(1,180,000−110,000)×100/108＝990,740円で該当しません。ゴルフ場利用株式は3,400,000円で該当します。", "note": ""}, {"cat": "問1・調整対象固定資産", "ctx": "Ｂ建物（居住用マンション）は平成28年10月10日に建物部分450,000,000円（税込）で取得し、仕入れた課税期間（前々々課税期間）では「その他の資産の譲渡等にのみ要するもの」として個別対応方式で控除していない。", "q": "当期の課税売上割合が著しく変動した場合の調整（法33）の対象になるか。", "choices": ["対象にならない（仕入時に控除税額が0のため調整の計算に影響しない）", "対象になり、増加・減少の調整を行う", "居住用賃貸建物なので、全額の仕入税額控除を取り戻す", "居住用から課税業務用に転用した場合と同じ調整を行う"], "exp": "調整対象固定資産には当たりますが、非課税対応として控除していないので、課税売上割合の変動の調整に含めても影響はなく、大手予備校の解答速報も調整に含めていません。", "note": "※平成28年取得のため対象外ですが、令和2年10月1日以後に取得した居住用賃貸建物（税抜1,000万円以上）は、令和2年改正により仕入税額控除そのものが認められません（法30⑩）。"}, {"cat": "問1・調整対象固定資産", "ctx": "仕入れ等の課税期間の課税売上割合 685,729,000/781,061,000（約87.79%）。通算課税売上割合 1,769,773,407/4,047,410,937（約43.73%）。", "q": "「著しい変動（減少）」に当たるかの判定として正しいものはどれか。", "choices": ["当たる（変動差約44.07%≧5%、変動率約50.20%≧50%）", "当たらない（変動率は約44.07%で50%未満）", "当たらない（変動差が5%未満）", "当たる（変動率は(87.79−43.73)/43.73で計算して100%超）"], "exp": "減少の場合、変動率は（仕入時の割合−通算課税売上割合）÷仕入時の割合で計算します。(0.8779−0.4372)/0.8779≒50.2%で50%以上、変動差も5%以上なので著しい減少に当たります。", "note": ""}, {"cat": "問1・調整対象固定資産", "ctx": "調整対象基準税額：ゴルフ場利用株式214,200円、営業用車両1台87,325円×3台。仕入時の課税売上割合 約87.79%（685,729,000/781,061,000）、通算課税売上割合 約43.73%（1,769,773,407/4,047,410,937）。著しい減少に当たる。", "q": "当期の仕入控除税額から減算する調整税額はいくらか。", "choices": ["209,843円（＝(214,200＋87,325×3)×(0.8779…−0.4372…)）", "418,053円（＝調整対象基準税額×仕入れ等の課税期間の課税売上割合）", "94,394円（＝214,200×(0.8779…−0.4372…)）", "115,448円（＝87,325×3×(0.8779…−0.4372…)）"], "exp": "調整対象基準税額×仕入時の課税売上割合 − 調整対象基準税額×通算課税売上割合 を控除税額から減らします。端数処理の順序で209,840円とする解答もあります。", "note": ""}, {"cat": "問1・中間申告", "ctx": "前課税期間（12か月）の確定消費税額（国税）は14,805,000円。当課税期間は12か月。", "q": "当課税期間の中間申告の方法と中間納付税額の合計はどれか。", "choices": ["3か月ごとの中間申告で、11,103,600円（＝14,805,000×3/12→百円未満切捨て3,701,200円×3回）", "1か月ごとの中間申告で、13,571,250円（＝1,233,750×11回）", "6か月の中間申告1回で、7,402,500円（＝14,805,000×6/12）", "3か月ごとの中間申告で、11,103,750円（＝3,701,250×3回）"], "exp": "前期の確定消費税額が480万円超4,800万円以下なので3か月ごとの中間申告（年3回）となります。1回分は14,805,000×3/12＝3,701,250円で、百円未満を切り捨てて3,701,200円です。", "note": ""}, {"cat": "問1・納付税額", "ctx": "課税標準額に対する消費税額34,480,341円、控除対象仕入税額17,487,540円（調整後）、中間納付税額11,103,600円。", "q": "確定申告で納付すべき消費税額はいくらか。", "choices": ["5,889,200円（＝34,480,341−17,487,540→百円未満切捨て16,992,800−11,103,600）", "5,889,201円（＝34,480,341−17,487,540−11,103,600（切捨てなし））", "16,992,800円（＝中間納付税額を差し引かない）", "5,679,300円（＝34,480,341−17,697,383→百円未満切捨て16,782,900−11,103,600）"], "exp": "差引税額は百円未満を切り捨てます（16,992,801→16,992,800円）。そこから中間納付税額を引きます。", "note": ""}, {"cat": "問2・納税義務", "ctx": "【問2】甲社（ITサービス業）は平成29年9月1日設立、Ａ氏が100%保有。第1期 H29.9.1～H30.3.31（7か月、資本金3,000,000円）、第2期 H30.4.1～H31.3.31（資本金3,000,000円、H30.10.1増資で10,000,000円）、第3期 H31.4.1～R2.3.31。課税事業者選択届出書・調整対象固定資産・高額特定資産の取得なし。\n第1期の期首資本金は3,000,000円。", "q": "第1期について、新設法人の特例（法12の2①）は適用されるか。", "choices": ["適用されない（期首の資本金が1,000万円未満）", "適用される（基準期間がないため）", "適用される（第2期中に1,000万円に増資したため）", "適用されない（設立が9月で1年未満のため）"], "exp": "新設法人の特例は、基準期間がない事業年度の開始の日の資本金が1,000万円以上の場合に適用されます。第1期・第2期とも期首は300万円なので適用されません（増資は第2期の途中）。", "note": ""}, {"cat": "問2・特定新規設立法人", "ctx": "【問2】甲社（ITサービス業）は平成29年9月1日設立、Ａ氏が100%保有。第1期 H29.9.1～H30.3.31（7か月、資本金3,000,000円）、第2期 H30.4.1～H31.3.31（資本金3,000,000円、H30.10.1増資で10,000,000円）、第3期 H31.4.1～R2.3.31。課税事業者選択届出書・調整対象固定資産・高額特定資産の取得なし。\n乙社：Ｂ氏（Ａの父・別生計）80%、Ｃ氏（Ａの兄・別生計）15%、Ａ氏5%。\n丙社：Ｄ氏（Ａの妻Ｆの父・別生計）55%、Ｅ氏（Ｆの兄・別生計）35%、Ｆ氏（Ａの妻・生計一）10%。\n丁社：Ｇ氏（Ｂの妹・Ａと別生計）90%、Ｂ氏10%（Ａ氏は保有なし）。", "q": "甲社の特定新規設立法人の判定で、判定対象となる特殊関係法人に当たる会社はどれか。", "choices": ["乙社と丙社", "乙社・丙社・丁社の全て", "乙社だけ", "丁社だけ"], "exp": "Ａ氏とその親族等で完全支配する法人が特殊関係法人です。ただし、Ａ氏と生計を一にしない親族等だけで完全支配している法人（非支配特殊関係法人）は除かれます。乙社はＡ氏本人が5%を持ち、丙社は生計を一にする妻Ｆ氏が10%を持つので、どちらも別生計の親族だけの支配ではなく、特殊関係法人です。丁社は別生計のＧ氏・Ｂ氏だけで100%なので除かれます。大手予備校の解答速報も同じ結論です。", "note": "※令和6年度改正により、令和6年10月1日以後に開始する課税期間から、特定新規設立法人の判定に「判定対象者 与等支払額を選べば免税になるので納税義務なし", "基準期間の課税売上高5,800,000円は1,000万円以下で、特定期間の判定は不要なので納税義務なし"], "exp": "特定期間の判定は課税売上高と給与等支払額のどちらで判定してもよいですが、17,800,000×100/108＝16,481,481円、給与等11,000,000円のどちらも1,000万円を超えるので、免税を選ぶことはできません（法9の2）。法人の基準期間が1年でないときは年換算します。", "note": ""}]}];

 <button class="mode" data-m="normal"><b>通常モード</b><span>全問を解く。連続正解のコンボと速さのボーナスあり ／ ${best("normal")}</span></button>
 <button class="mode" data-m="survival"><b>サバイバル</b><span>ライフ3つ、1問45秒。何問続くか挑戦 ／ ${best("survival")}</span></button>
 <button class="mode" data-m="review" ${w?"":"disabled style='opacity:.45;cursor:default'"}><b>間違えた問題だけ（${w}問）</b><span>過去に間違えた問題を再出題。正解すると苦手リストから消えます</span></button>
 </div>${w?'<div class="nav"><button class="btn sec" id="clr">苦手リストを空にする</button></div>':''}`;
 document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{if(b.disabled)return;start(b.dataset.m,$("yr").value)});
 if(w)$("clr").onclick=()=>{st.wrong=[];save();menu()};
}
function start(mode,f){
 let list=mode==="review"?st.wrong.map(byKey).filter(Boolean):ALL;
 if(f)list=list.filter(q=>q[5]===f);
 if(!list.length){$("main").insertAdjacentHTML("beforeend","<p style=\"color:var(--page-ng)\">この範囲に該当する問題がありません</p>");return}
 G={mode,deck:sh(list),i:0,pts:0,combo:0,maxc:0,ok:0,life:mode==="survival"?3:null,miss:[],cat:{}};
 show();
}
function hud(){const g=G;
 $("hud").innerHTML=`<div class="hud"><span class="pts" id="pts">${g.pts}</span><span>点</span>
 <span class="mono">${Math.min(g.i+1,g.deck.length)} / ${g.deck.length}</span>
 ${g.life!=null?`<span class="life">${"♥".repeat(g.life)}${"♡".repeat(3-g.life)}</span>`:""}
 ${g.combo>=2?`<span class="combo">${g.combo} コンボ</span>`:""}
 <span style="flex:1"></span><button class="btn sec" style="padding:4px 10px;font-size:13px" id="qt">やめる</button></div>
 <div class="prog"><i style="width:${g.i/g.deck.length*100}%"></i></div><div class="timer"><i id="tm"></i></div>`;
 $("qt").onclick=()=>{menu()};
}
function show(){const g=G;clearInterval(g.t);
 if(g.i>=g.deck.length||g.life===0)return end();
 hud();const q=g.deck[g.i],opts=sh(q[3]);
 $("main").innerHTML=`<div class="pop"><span class="tag">${q[6]}</span> <span class="tag">${q[0]}</span><div class="ctx"><b>資料</b>${q[1]}</div><p class="q">${q[2]}</p>`+opts.map(o=>`<button class="c">${o}</button>`).join("")+`<div id="res"></div></div>`;
 g.t0=Date.now();
 g.t=setInterval(()=>{const r=Math.max(0,1-(Date.now()-g.t0)/1000/LIMIT);$("tm").style.width=r*100+"%";if(r===0&&g.mode==="survival")answer(null,q)},200);
 document.querySelectorAll("button.c").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(b,q){const g=G;clearInterval(g.t);
 const sec=(Date.now()-g.t0)/1000,ok=!!b&&b.textContent===q[3][0],qi=id(q);
 document.querySelectorAll("button.c").forEach(x=>{x.disabled=true;if(x.textContent===q[3][0])x.classList.add("ok")});
 const c=q[0];g.cat[c]=g.cat[c]||[0,0];g.cat[c][1]++;
 let gain=0,msg;
 if(ok){g.ok++;g.combo++;g.maxc=Math.max(g.maxc,g.combo);g.cat[c][0]++;
  const speed=Math.max(0,Math.round((LIMIT-sec)/LIMIT*50));gain=100+speed+Math.min(g.combo-1,5)*20;g.pts+=gain;
  st.wrong=st.wrong.filter(x=>x!==qi);
  msg=`正解 <span class="gain">+${gain}</span>（基本100・速さ+${speed}${g.combo>1?`・${g.combo}コンボ+${Math.min(g.combo-1,5)*20}`:""}）`;
 }else{if(b)b.classList.add("ng");g.combo=0;g.miss.push(q);if(g.life!=null)g.life--;
  if(!st.wrong.includes(qi))st.wrong.push(qi);
  msg=(b?"不正解":"時間切れ")+" — 正解："+q[3][0];}
 save();hud();$("pts").textContent=g.pts;
 const last=g.i+1>=g.deck.length||g.life===0;
 $("res").innerHTML=`<div class="exp"><b>${msg}</b><br>${q[4]}</div><div class="nav"><button class="btn" id="nx">${last?"結果を見る":"次の問題"}</button></div>`;
 $("nx").onclick=()=>{g.i++;show();window.scrollTo(0,0)};$("res").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function end(){const g=G;clearInterval(g.t);
 const n=g.mode==="survival"?g.i+(g.life===0?1:0):g.deck.length,p=n?Math.round(g.ok/n*100):0;
 const rank=p>=90?"S":p>=80?"A":p>=70?"B":p>=50?"C":"D";
 const cm={S:"合格確実レベル",A:"合格ライン",B:"ボーダー付近",C:"要復習",D:"基礎から確認を"}[rank];
 const bk=g.mode;const nb=st.best[bk]==null||g.pts>st.best[bk];if(g.mode!=="review"&&nb){st.best[bk]=g.pts;save()}
 $("hud").innerHTML="";
 const rows=Object.entries(g.cat).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,v])=>`<tr><td>${k}</td><td class="n">${v[0]}/${v[1]}</td><td class="n">${Math.round(v[0]/v[1]*100)}%</td></tr>`).join("");
 $("main").innerHTML=`<div class="pop"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="rank">${rank}</div>
 <div><div class="big">${g.pts} 点${g.mode!=="review"&&nb?' <span class="gain" style="font-size:14px">自己ベスト更新</span>':""}</div>
 <div>${g.ok} / ${n} 問正解（${p}%）・最大 ${g.maxc} コンボ ― ${cm}</div></div></div>
 <div class="tblwrap"><table><tr><th>論点</th><th style="text-align:right">正解</th><th style="text-align:right">正答率</th></tr>${rows}</table></div>
 ${g.miss.length?`<p style="margin:14px 0 4px;font-weight:700">今回間違えた問題（${g.miss.length}問）</p><ul class="miss">${g.miss.map(q=>`<li>${q[2]}<br><span style="color:var(--page-accent)">→ ${q[3][0]}</span></li>`).join("")}</ul>`:""}
 <div class="nav">${g.miss.length?'<button class="btn" id="rv">今回間違えた問題を再出題</button>':''}
 ${st.wrong.length?`<button class="btn sec" id="rw">苦手リスト全体（${st.wrong.length}問）</button>`:""}
 <button class="btn sec" id="mn">メニューへ</button></div></div>`;
 if(g.miss.length)$("rv").onclick=()=>{const m=g.miss;G={mode:"review",deck:sh(m),i:0,pts:0,combo:0,maxc:0,ok:0,life:null,miss:[],cat:{}};show()};
 if(st.wrong.length)$("rw").onclick=()=>start("review","");
 $("mn").onclick=menu;
}
menu();
</script></body></html>

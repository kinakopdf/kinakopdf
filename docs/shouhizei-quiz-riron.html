<script>
const D=[{"year": "R08", "label": "令和8年度（第76回）", "questions": [{"cat": "問1⑴イ・新設法人", "ctx": "A社（3月決算）は令和8年4月1日に資本金800万円で設立され、令和8年6月に増資して資本金1,200万円になった。第2期開始の日（令和9年4月1日）の資本金は1,200万円。\nA社は課税事業者選択届出書を提出しておらず、特定新規設立法人には当たらない。第2期の特定期間の課税売上高・給与等の金額はいずれも1,000万円以下。", "q": "A社の第1期・第2期の納税義務として正しいものはどれか。", "choices": ["第1期は免除される。第2期は、基準期間がない事業年度の開始の日の資本金が1,000万円以上なので新設法人に当たり、免除されない", "第1期・第2期とも、期中に資本金が1,000万円以上になったので新設法人に当たり、免除されない", "第1期・第2期とも、設立時の資本金が1,000万円未満なので免除される", "第1期は免除されない。第2期は基準期間の課税売上高が0円なので免除される"], "exp": "新設法人は、基準期間がない事業年度の開始の日における資本金の額又は出資の金額が1,000万円以上の法人です（法12の2①）。判定は事業年度ごとに、その開始の日の資本金で行います。第1期の開始日は800万円、第2期（基準期間がない）の開始日は1,200万円なので、第2期だけが新設法人として免除されません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴イ・特定新規設立法人", "ctx": "新たに設立された資本金500万円の内国法人について、基準期間がない事業年度に「特定新規設立法人」として納税義務が免除されない要件を考える。", "q": "特定新規設立法人に当たる要件として正しいものはどれか。", "choices": ["新設開始日に他の者に50％超を支配されていること（特定要件）、かつ、その他の者や特殊関係法人のいずれかの基準期間相当期間の課税売上高が5億円超、又は総収入金額が50億円超であること", "新設開始日の資本金が1,000万円以上で、かつ、親会社の課税売上高が5億円超であること", "他の者に50％超を支配されていて、かつ、その新規設立法人自身の設立初年度の課税売上高が5億円超であること", "他の者に50％超を支配されていて、かつ、その他の者の基準期間の課税売上高が1,000万円超であること"], "exp": "特定新規設立法人は、資本金1,000万円未満の新規設立法人のうち、①新設開始日に特定要件（他の者による50％超の支配など）に該当し、②判定の基礎となった他の者及びその特殊関係法人のいずれかについて、基準期間相当期間の課税売上高が5億円を超えるか、総収入金額が50億円を超えるものです（法12の3①）。", "note": ""}, {"cat": "問1⑴イ・外国法人の国内事業開始", "ctx": "外国法人X社（12月決算）は本国で20年以上事業を行っており、資本金は日本円換算で5億円。令和8年3月に初めて日本国内で課税資産の譲渡等に係る事業を始めた。それまで国内での事業は一切ない。", "q": "X社の令和8年12月期の納税義務について正しいものはどれか。", "choices": ["基準期間はあるが、その末日の翌日以後に国内で事業を開始したので基準期間がないものとみなし、期首の資本金が1,000万円以上の新設法人として免除されない", "基準期間の国内の課税売上高が0円なので免除される", "外国法人には新設法人の特例は適用されないので免除される", "特定期間の課税売上高で判定し、0円なので免除される"], "exp": "その事業年度の基準期間がある外国法人が、基準期間の末日の翌日以後に国内で課税資産の譲渡等に係る事業を開始した場合、その事業年度は基準期間がないものとみなして、新設法人・特定新規設立法人の規定を適用します（法12の2③、12の3⑤）。X社は期首の資本金が1,000万円以上なので、新設法人として免除されません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴ロ・調整対象固定資産", "ctx": "B社（3月決算、令和6年4月1日設立、期首資本金1,500万円の新設法人）は、設立2期目（令和7年4月1日〜令和8年3月31日）に、原則課税で税抜150万円の機械装置を購入した。B社は簡易課税制度選択届出書を提出していない。", "q": "この購入により、納税義務が免除されない課税期間はどれか。", "choices": ["2期目から4期目まで（購入日の属する課税期間から、その課税期間の初日以後3年を経過する日の属する課税期間まで）", "2期目から3期目まで", "3期目から4期目まで（購入日の属する課税期間の翌課税期間から）", "2期目から5期目まで"], "exp": "新設法人・特定新規設立法人が、基準期間がない事業年度に含まれる課税期間（簡易課税の適用を受ける課税期間を除く）中に調整対象固定資産の仕入れ等を行った場合、その仕入れ等の日の属する課税期間から、その課税期間の初日以後3年を経過する日の属する課税期間までは免除されません（法12の2②、12の3③）。2期目の初日（令和7年4月1日）以後3年を経過する日は令和10年3月31日で、4期目に属します。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴ロ・ハ・資産の区分", "ctx": "課税事業者が、次の2台の機械装置をそれぞれ1台ずつ別の取引で購入した。\n・機械装置ア：税抜150万円\n・機械装置イ：税抜1,500万円", "q": "それぞれの区分として正しいものはどれか。", "choices": ["アは調整対象固定資産（高額特定資産には当たらない）、イは高額特定資産", "アもイも高額特定資産", "アはどちらにも当たらず、イは調整対象固定資産だが高額特定資産には当たらない", "アは高額特定資産、イは調整対象固定資産"], "exp": "調整対象固定資産は一の取引単位の税抜価額が100万円以上の固定資産等、高額特定資産は一の取引単位の税抜価額が1,000万円以上の棚卸資産又は調整対象固定資産です。アは100万円以上1,000万円未満なので調整対象固定資産、イは1,000万円以上なので高額特定資産です。", "note": ""}, {"cat": "問1⑴ロ・調整対象固定資産", "ctx": "新設法人B社（期首資本金1,500万円）は、設立1期目中に簡易課税制度選択届出書を提出し、簡易課税を適用している設立2期目に税抜150万円の機械装置を購入した。", "q": "調整対象固定資産を取得した場合の納税義務の免除の特例は適用されるか。", "choices": ["適用されない（簡易課税の適用を受ける課税期間中の仕入れ等は対象外）", "適用され、2期目から4期目まで免除されない", "適用され、3期目から5期目まで免除されない", "新設法人なので、簡易課税かどうかにかかわらず適用される"], "exp": "新設法人等の調整対象固定資産の特例は、基準期間がない事業年度に含まれる各課税期間のうち、簡易課税の適用を受ける課税期間を除いた課税期間中の仕入れ等が対象です（法12の2②）。簡易課税を適用している課税期間中の購入には適用されません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴ハ・高額特定資産", "ctx": "C社（3月決算）は設立10期目（令和8年4月1日〜令和9年3月31日）に課税事業者で、原則課税を適用している。10期目に税抜1,500万円の機械装置（自己建設ではない）を購入した。", "q": "この購入により、納税義務が免除されない課税期間はどれか。", "choices": ["11期目と12期目（購入日の属する課税期間の翌課税期間から、その課税期間の初日以後3年を経過する日の属する課税期間まで）", "10期目から12期目まで", "11期目から13期目まで", "10期目から13期目まで"], "exp": "事業者（免税事業者を除く）が簡易課税の適用を受けない課税期間中に高額特定資産の仕入れ等を行った場合、その仕入れ等の日の属する課税期間の翌課税期間から、その課税期間の初日以後3年を経過する日の属する課税期間までは免除されません（法12の4①）。10期目の初日（令和8年4月1日）以後3年を経過する日は令和11年3月31日で、12期目に属します。10期目はもともと課税事業者です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴ハ・高額特定資産", "ctx": "D社は免税事業者である課税期間中に、税抜1,500万円の機械装置を購入した。D社は課税事業者選択届出書を提出していない。", "q": "高額特定資産を取得した場合の納税義務の免除の特例は適用されるか。", "choices": ["適用されない（免税事業者が行った仕入れ等は対象外）", "適用され、翌課税期間から3年間は免除されない", "適用され、購入した課税期間から免除されない", "適用されるかは、翌課税期間の基準期間の課税売上高で決まる"], "exp": "高額特定資産の特例の対象は「事業者（免税事業者を除く）」が、簡易課税の適用を受けない課税期間中に行った仕入れ等です（法12の4①）。免税事業者である課税期間中の購入では適用されません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴ニ・相続（相続年）", "ctx": "飲食店を営む個人事業者の親が令和8年6月10日に死亡し、給与所得者だった子が相続で事業を引き継いだ。子はそれまで事業を行ったことがない。親の基準期間（令和6年）の課税売上高は1,800万円。子は課税事業者選択届出書を提出していない。", "q": "子の令和8年の納税義務について、相続があった場合の特例（法10①）による結論はどれか。", "choices": ["6月11日（相続の日の翌日）から12月31日まで免除されない", "1月1日から12月31日まで免除されない", "子自身の基準期間の課税売上高が0円なので、1年を通じて免除される", "6月10日（相続の日）から12月31日まで免除されない"], "exp": "その年の基準期間の課税売上高が1,000万円以下の相続人が、基準期間の課税売上高が1,000万円を超える被相続人の事業を承継した場合、相続のあった日の翌日からその年の12月31日までは納税義務が免除されません（法10①）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴ニ・相続（翌年・翌々年）", "ctx": "令和8年6月10日に親が死亡し、子が事業を引き継いだ。令和7年の課税売上高は、親が1,600万円、子は0円（事業なし）。", "q": "子の令和9年の納税義務の判定として正しいものはどれか。", "choices": ["基準期間（令和7年）の子と親の課税売上高の合計が1,000万円を超えるので免除されない", "相続の特例は相続した年だけなので、子自身の基準期間の課税売上高0円で判定し、免除される", "親の令和8年（死亡日まで）の課税売上高だけで判定する", "子の令和8年の課税売上高を年換算して判定する"], "exp": "相続の翌年・翌々年は、相続人の基準期間の課税売上高が1,000万円以下でも、相続人と被相続人の基準期間の課税売上高の合計額が1,000万円を超えれば、納税義務は免除されません（法10②）。令和9年の基準期間は令和7年なので、0円＋1,600万円＞1,000万円です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴ニ・みなし登録", "ctx": "適格請求書発行事業者だった親が死亡し、子が相続で事業を引き継いだ。子は相続前に登録を受けておらず、登録申請書もまだ提出していない。", "q": "子が適格請求書発行事業者とみなされる期間（みなし登録期間）として正しいものはどれか。", "choices": ["相続の日の翌日から、親が死亡した日の翌日から4月を経過する日まで（それより前に子が登録を受ければ、その前日まで）", "相続の日の翌日から、その年の12月31日まで", "相続の日の翌日から、子が登録を受ける日まで期限なく続く", "みなし登録は、子が登録申請書を提出した場合にだけ認められる"], "exp": "相続により適格請求書発行事業者の事業を承継した相続人は、相続の日の翌日から、相続人が登録を受けた日の前日か、被相続人が死亡した日の翌日から4月を経過する日のいずれか早い日までの間、適格請求書発行事業者とみなされます（法57の3③）。この期間は、相続人の基準期間の課税売上高にかかわらず納税義務が免除されません。なお、この期間中に相続人が登録申請書を出した場合は、登録の通知が届くまで延長されます。", "note": ""}, {"cat": "問1⑴ニ・みなし登録", "ctx": "適格請求書発行事業者だった親が死亡し、給与所得者だった子が事業を引き継いだ。子の基準期間・特定期間の課税売上高はいずれも0円。", "q": "みなし登録期間中の子の納税義務について正しいものはどれか。", "choices": ["適格請求書発行事業者とみなされるので、納税義務は免除されない", "子自身の基準期間の課税売上高が0円なので、法9条1項により免除される", "親の基準期間の課税売上高が1,000万円以下なら免除される", "みなし登録期間中は、消費税の申告の対象外になる"], "exp": "適格請求書発行事業者は、基準期間の課税売上高が1,000万円以下でも納税義務が免除されません。みなし登録期間中の相続人は適格請求書発行事業者とみなされるので、この期間の課税資産の譲渡等と特定課税仕入れについては納税義務が免除されません。本試験で被相続人が登録していたことが示されていたのは、この論点を問うためと考えられています。", "note": ""}, {"cat": "問1⑵・納税義務者", "ctx": "国内に住む給与所得者（事業は行っていない）が、海外の通販サイトで購入した商品を、外国貨物として保税地域から引き取った。", "q": "この引取りに係る消費税の納税義務者はだれか。", "choices": ["引き取った給与所得者本人（外国貨物を保税地域から引き取る者）", "海外の通販事業者", "事業者ではないので、納税義務者はいない", "国内の配送業者"], "exp": "外国貨物を保税地域から引き取る者は、課税貨物につき消費税を納める義務があります（法5②）。国内取引と違い、事業者に限られません。", "note": ""}, {"cat": "問1⑵・納税義務者", "ctx": "国内の事業者E社は、国外事業者から「事業者向け電気通信利用役務の提供」（特定課税仕入れに当たるもの）を受けた。", "q": "この取引の消費税の納税義務者はだれか。", "choices": ["役務の提供を受けたE社（特定課税仕入れを行った事業者）", "役務を提供した国外事業者", "E社と国外事業者の連帯納付", "国外取引なので納税義務者はいない"], "exp": "事業者は、国内において行った課税資産の譲渡等と特定課税仕入れにつき消費税を納める義務があります（法5①）。特定課税仕入れは、役務の提供を受けた事業者が納税義務者になります（リバースチャージ方式）。", "note": ""}, {"cat": "問1⑵・納税義務の成立時期", "ctx": "消費税の納税義務がいつ成立するかを考える。", "q": "納税義務が成立する時期の組合せとして正しいものはどれか。", "choices": ["国内取引は課税資産の譲渡等又は特定課税仕入れをした時、輸入取引は課税貨物を保税地域から引き取る時", "国内取引・輸入取引とも、課税期間の終了の時", "国内取引は確定申告書を提出した時、輸入取引は輸入申告をした時", "国内取引は対価を受け取った時、輸入取引は代金を支払った時"], "exp": "消費税の納税義務は、課税資産の譲渡等若しくは特定課税仕入れをした時、又は外国貨物の保税地域からの引取りの時に成立します（国税通則法15②七）。課税期間の終了の時に成立するのは、所得税や法人税などです。", "note": ""}, {"cat": "問2⑴・適格返還請求書", "ctx": "機械製造業の内国法人A社（適格請求書発行事業者）は、単価15,000円（税抜）の製品500個を卸売業者の甲社（課税事業者）に販売し、適格請求書を交付した。後日、不具合で10個が返品され代金を返金したが、甲社から特に申し出がなかったので、適格返還請求書は交付しなかった。", "q": "A社の対応の正誤と理由として正しいものはどれか。", "choices": ["誤り。返還額は税込165,000円で少額の免除などに当たらないので、申し出がなくても適格返還請求書を交付しなければならない", "正しい。適格返還請求書は、返品を受けた事業者から求めがあった場合にだけ交付すればよい", "正しい。卸売業者に対する返品なので、適格返還請求書の交付義務は免除される", "誤り。適格返還請求書ではなく、適格請求書を改めて交付し直さなければならない"], "exp": "適格請求書発行事業者は、課税事業者に売上げに係る対価の返還等を行う場合、適格返還請求書を交付しなければなりません。免除されるのは、事業の性質上交付が困難な場合や、返還等の税込価額が1万円未満の場合などに限られます（法57の4③）。返還額は15,000円×10個×1.1＝165,000円で免除に当たらないので、申し出の有無にかかわらず交付が必要です。", "note": ""}, {"cat": "問2⑴・適格返還請求書", "ctx": "適格請求書発行事業者が、課税事業者に対して売上げに係る対価の返還等（値引き）を行った。", "q": "適格返還請求書の交付義務が免除される少額の基準はどれか。", "choices": ["返還等に係る税込価額が1万円未満", "返還等に係る税抜価額が1万円未満", "返還等に係る税込価額が3万円未満", "返還等に係る税込価額が5万円未満"], "exp": "売上げに係る対価の返還等の税込価額が1万円未満の場合は、適格返還請求書の交付義務が免除されます（令70の9③）。税込で判定します。", "note": ""}, {"cat": "問2⑵・金地金等の特例", "ctx": "ブランド品等の買取・販売業を営むB社（9月決算・内国法人）は、令和6年9月期（令和5年10月1日〜令和6年9月30日）に課税事業者で原則課税を適用していた。この課税期間中に、国内の事業者から金地金を880,000円（8月14日）と1,430,000円（9月3日）で購入した（いずれも税込）。高額特定資産は購入していない。", "q": "金地金等の仕入れを行った場合の特例の判定として正しいものはどれか。", "choices": ["税抜2,100,000円（＝(880,000＋1,430,000)×100/110）で200万円以上なので、特例の対象になる", "1回あたりの購入額が200万円未満なので、特例の対象にならない", "金地金は高額特定資産に当たらないので、特例は関係ない", "合計が1,000万円未満なので、特例の対象にならない"], "exp": "課税事業者が簡易課税の適用を受けない課税期間中に金地金等の仕入れ等を行い、その課税期間中の金地金等の仕入れ等の金額の合計額が200万円以上である場合は、高額特定資産を取得した場合と同様に扱われます（法12の4③）。1回ごとではなく課税期間中の合計で判定します。", "note": "※この特例は令和6年4月1日以後の仕入れ等から適用されています（令和6年度改正）。"}, {"cat": "問2⑵・金地金等の特例", "ctx": "B社は令和6年7月31日に初めて簡易課税制度選択届出書を提出した。その後、同じ令和6年9月期中（8月14日・9月3日）に、課税期間中の合計で税抜200万円以上となる金地金等を購入した。令和7年9月期の基準期間（令和5年9月期）の課税売上高は1,340万円。", "q": "令和7年9月期（令和6年10月1日〜令和7年9月30日）の申告方法として正しいものはどれか。", "choices": ["簡易課税制度選択届出書は提出がなかったものとみなされるので、原則課税で申告する", "届出書は金地金の購入前に提出しているので、簡易課税で申告できる", "基準期間の課税売上高が5,000万円以下なので、簡易課税で申告できる", "納税義務が免除されるので、申告は不要"], "exp": "金地金等の特例に当たる仕入れを行った場合、その課税期間の初日からその仕入れの日までの間に簡易課税制度選択届出書を提出していたときは、その提出はなかったものとみなされます（法37④）。令和7年9月期は基準期間の課税売上高1,340万円で課税事業者ですが、原則課税で申告することになります。", "note": "※令和6年4月1日以後の金地金等の仕入れ等から適用されている規定です。"}, {"cat": "問2⑵・金地金等の特例", "ctx": "B社の令和8年9月期（令和7年10月1日〜令和8年9月30日）の基準期間（令和6年9月期）の課税売上高は950万円、特定期間の課税売上高・給与等の金額はいずれも1,000万円以下。B社は令和6年9月期に、令和6年4月1日以後に合計で税抜200万円以上の金地金等を原則課税で購入している（令和6年9月期の初日は令和5年10月1日）。", "q": "令和8年9月期の納税義務として正しいものはどれか。", "choices": ["金地金等の特例により、免除されない（購入した課税期間の初日以後3年を経過する日の属する課税期間まで）", "基準期間・特定期間の課税売上高が1,000万円以下なので免除される", "特例が及ぶのは購入した翌課税期間の令和7年9月期だけなので、免除される", "簡易課税を選択していたので、特例は適用されない"], "exp": "金地金等の特例に当たると、仕入れを行った課税期間の翌課税期間から、その課税期間の初日以後3年を経過する日の属する課税期間までは免除されません。令和6年9月期の初日（令和5年10月1日）以後3年を経過する日は令和8年9月30日で、令和8年9月期に属します。したがって、令和8年9月期も特例の期間内であり、納税義務は免除されません。", "note": "※令和6年4月1日以後の金地金等の仕入れ等から適用されている規定です。"}, {"cat": "問2⑶・プラットフォーム課税", "ctx": "外国法人C社（12月決算・課税事業者・国内に支店なし）は、国税庁長官の指定を受けた特定プラットフォーム事業者を介してゲームアプリを配信し、利用料も特定プラットフォーム事業者を介して受け取っている。配信は、規約に同意すれば誰でも利用できる。C社は、国内の利用者への配信を自社の国内の課税資産の譲渡等として、令和8年分の確定申告を行った。", "q": "C社の対応の正誤と理由として正しいものはどれか。", "choices": ["誤り。特定プラットフォーム事業者がその役務の提供を行ったものとみなされるので、C社はこの配信について申告する必要はない", "正しい。国外事業者が国内の利用者に行う電気通信利用役務の提供なので、C社が申告する", "誤り。利用者側がリバースチャージ方式で申告する", "正しい。プラットフォーム課税は事業者向けの役務の提供だけが対象なので、C社が申告する"], "exp": "国外事業者が国内で行う電気通信利用役務の提供（事業者向けを除く）がデジタルプラットフォームを介して行われ、その対価を特定プラットフォーム事業者を介して受け取る場合は、特定プラットフォーム事業者がその役務の提供を行ったものとみなされます（法15の2①）。誰でも利用できる配信は事業者向けではないので、C社の課税資産の譲渡等にはなりません。", "note": "※プラットフォーム課税は令和7年4月1日以後の取引から適用されています（令和6年度改正）。"}, {"cat": "問2⑶・プラットフォーム課税", "ctx": "国外事業者が、特定プラットフォーム事業者を介して国内で電気通信利用役務の提供を行い、対価も特定プラットフォーム事業者を介して受け取っている。", "q": "プラットフォーム課税（特定プラットフォーム事業者が役務の提供を行ったとみなす規定）の対象から除かれるものはどれか。", "choices": ["事業者向け電気通信利用役務の提供", "規約に同意すれば誰でも利用できるアプリの配信", "電子書籍や音楽の配信", "オンラインゲームの利用料"], "exp": "対象から除かれるのは事業者向け電気通信利用役務の提供です（法15の2①）。事業者向けのものは、受けた事業者がリバースチャージ方式で申告します。", "note": "※令和7年4月1日以後の取引から適用されています（令和6年度改正）。"}, {"cat": "問2⑷・外国公館等への譲渡", "ctx": "贈答品の小売業を営む内国法人D社は適格請求書発行事業者だが、それ以外の申請や届出による許可・承認・指定は受けていない。日本に派遣されているX国大使館の大使が来店し、外交用の贈答品を購入したいと申し出たので、法令に定める証明書の提示と必要事項を記載した書類の提出を受け、免税で販売した。書類は適正に保存している。X国でも、日本の大使等の同様の購入にはX国の付加価値税が制限なく免除されている。", "q": "D社の対応の正誤と理由として正しいものはどれか。", "choices": ["誤り。外国公館等への免税販売ができるのは国税庁長官の指定を受けた事業者（免税指定店舗）に限られ、D社は指定を受けていない", "正しい。相互主義が満たされ、証明書の提示と書類の提出・保存も適正なので免税販売できる", "誤り。大使個人の購入は、大使館の公用の購入ではないので免税の対象にならない", "誤り。外国公館等への販売は、輸出免税として処理しなければならない"], "exp": "外国公館等に対する課税資産の譲渡等の免税（租税特別措置法86条）は、国税庁長官の指定を受けた事業者（免税指定店舗）が行う譲渡等に限られます。D社は指定を受けていないので、証明書や書類の要件を満たしていても免税販売はできません。", "note": ""}]}, {"year": "R07", "label": "令和7年度（第75回）", "questions": [{"cat": "問1⑴・課税の対象", "ctx": "外国法人A社（9月決算、国内に支店等なし、令和4年10月1日設立、出資金2,000万円で増減資なし、国内での給与等の支払なし）は、クラウド上で電子データの保存場所を提供するサービスを行っている。サービスは事業者以外の者でもWEBサイトから申し込み、規約に同意して料金を払えば利用できる。令和6年11月1日から日本国内に住所を有する者へのサービスを開始した（特定プラットフォーム事業者を介する取引ではない）。", "q": "消費税の課税の対象（国内取引）の規定として正しいものはどれか。", "choices": ["国内において事業者が行った資産の譲渡等（特定資産の譲渡等を除く）及び特定仕入れに消費税を課す", "国内において事業者が行った資産の譲渡等（特定資産の譲渡等を含む）に限り消費税を課し、特定仕入れは課税の対象外", "国内において事業者が行った課税資産の譲渡等のうち、居住者に対して行うものに限り消費税を課す", "国内において行われた資産の譲渡等は、事業者以外の者が行ったものも含めて消費税を課す"], "exp": "国内において事業者が行った資産の譲渡等（特定資産の譲渡等に該当するものを除く）及び特定仕入れ（事業として他の者から受けた特定資産の譲渡等）には消費税を課します（法4①）。特定資産の譲渡等は、提供者側ではなく受け手側の特定仕入れとして課税されます。", "note": ""}, {"cat": "問1⑴・資産の譲渡等の意義", "ctx": "外国法人A社（9月決算、国内に支店等なし、令和4年10月1日設立、出資金2,000万円で増減資なし、国内での給与等の支払なし）は、クラウド上で電子データの保存場所を提供するサービスを行っている。サービスは事業者以外の者でもWEBサイトから申し込み、規約に同意して料金を払えば利用できる。令和6年11月1日から日本国内に住所を有する者へのサービスを開始した（特定プラットフォーム事業者を介する取引ではない）。", "q": "「資産の譲渡等」の意義として正しいものはどれか。", "choices": ["事業として対価を得て行われる資産の譲渡及び貸付け並びに役務の提供（代物弁済等の一定のものを含む）", "事業として行われる資産の譲渡及び貸付け並びに役務の提供（対価の有無を問わない）", "対価を得て行われる資産の譲渡に限られ、貸付けや役務の提供は含まない", "事業として対価を得て行われる資産の譲渡等のうち、国内の事業者に対して行うもの"], "exp": "資産の譲渡等とは、事業として対価を得て行われる資産の譲渡及び貸付け並びに役務の提供をいいます（法2①八）。A社のサービスは事業として対価を得て行う役務の提供なので、資産の譲渡等に当たります。", "note": ""}, {"cat": "問1⑴・電気通信利用役務の提供の内外判定", "ctx": "外国法人A社（9月決算、国内に支店等なし、令和4年10月1日設立、出資金2,000万円で増減資なし、国内での給与等の支払なし）は、クラウド上で電子データの保存場所を提供するサービスを行っている。サービスは事業者以外の者でもWEBサイトから申し込み、規約に同意して料金を払えば利用できる。令和6年11月1日から日本国内に住所を有する者へのサービスを開始した（特定プラットフォーム事業者を介する取引ではない）。", "q": "A社のサービス（電気通信利用役務の提供）が国内取引に当たるかの判定基準として正しいものはどれか。", "choices": ["役務の提供を受ける者の住所若しくは居所又は本店若しくは主たる事務所の所在地が国内にあるかどうかで判定するので、国内取引に当たる", "役務の提供を行う者の本店所在地で判定するので、外国法人A社が行う取引は国外取引になる", "サーバーの設置場所で判定するので、サーバーが国外なら国外取引になる", "A社が国内に支店等を有しないので、国内取引には当たらない"], "exp": "電気通信利用役務の提供が国内で行われたかどうかは、役務の提供を受ける者の住所若しくは居所又は本店若しくは主たる事務所の所在地が国内にあるかどうかで判定します（法4③三）。日本国内に住所を有する者への提供なので国内取引です。", "note": ""}, {"cat": "問1⑴・特定資産の譲渡等の意義", "ctx": "外国法人A社（9月決算、国内に支店等なし、令和4年10月1日設立、出資金2,000万円で増減資なし、国内での給与等の支払なし）は、クラウド上で電子データの保存場所を提供するサービスを行っている。サービスは事業者以外の者でもWEBサイトから申し込み、規約に同意して料金を払えば利用できる。令和6年11月1日から日本国内に住所を有する者へのサービスを開始した（特定プラットフォーム事業者を介する取引ではない）。", "q": "「特定資産の譲渡等」の意義として正しいものはどれか。", "choices": ["事業者向け電気通信利用役務の提供及び特定役務の提供をいう", "国外事業者が行うすべての電気通信利用役務の提供をいう", "事業者向け電気通信利用役務の提供のみをいい、特定役務の提供は含まない", "消費者向け電気通信利用役務の提供及び特定役務の提供をいう"], "exp": "特定資産の譲渡等とは、事業者向け電気通信利用役務の提供及び特定役務の提供をいいます（法2①八の二）。消費者向けの電気通信利用役務の提供は含まれません。", "note": ""}, {"cat": "問1⑴・事業者向け電気通信利用役務の提供", "ctx": "外国法人A社（9月決算、国内に支店等なし、令和4年10月1日設立、出資金2,000万円で増減資なし、国内での給与等の支払なし）は、クラウド上で電子データの保存場所を提供するサービスを行っている。サービスは事業者以外の者でもWEBサイトから申し込み、規約に同意して料金を払えば利用できる。令和6年11月1日から日本国内に住所を有する者へのサービスを開始した（特定プラットフォーム事業者を介する取引ではない）。", "q": "「事業者向け電気通信利用役務の提供」の意義として正しいものはどれか。", "choices": ["国外事業者が行う電気通信利用役務の提供のうち、役務の性質又は取引条件等から、その提供を受ける者が通常事業者に限られるもの", "国外事業者が行う電気通信利用役務の提供のうち、実際に事業者が提供を受けたもの", "国内事業者が行う電気通信利用役務の提供のうち、提供を受ける者が事業者であるもの", "国外事業者が行う電気通信利用役務の提供のうち、対価の額が年間1,000万円を超えるもの"], "exp": "事業者向け電気通信利用役務の提供は、国外事業者が行う電気通信利用役務の提供のうち、役務の性質又は取引条件等から通常事業者に限られるものです（法2①八の四）。実際の利用者が事業者かどうかではなく、通常事業者に限られるかで判断します。", "note": ""}, {"cat": "問1⑴・本件取引の当てはめ", "ctx": "外国法人A社（9月決算、国内に支店等なし、令和4年10月1日設立、出資金2,000万円で増減資なし、国内での給与等の支払なし）は、クラウド上で電子データの保存場所を提供するサービスを行っている。サービスは事業者以外の者でもWEBサイトから申し込み、規約に同意して料金を払えば利用できる。令和6年11月1日から日本国内に住所を有する者へのサービスを開始した（特定プラットフォーム事業者を介する取引ではない）。\n実際には利用者の中に国内の事業者も含まれている。", "q": "本件取引の取扱いとして正しいものはどれか。", "choices": ["事業者以外の者でも利用できるので事業者向け電気通信利用役務の提供に当たらず、特定資産の譲渡等に該当しない。国内において事業者が行った資産の譲渡等として、課税の対象となる", "利用者に事業者が含まれているので事業者向け電気通信利用役務の提供に当たり、特定資産の譲渡等としてA社の課税の対象から除かれる", "A社は国外事業者なので、国内に住所を有する者への提供であっても国外取引となり、課税の対象外になる", "事業者以外の者でも利用できるので特定資産の譲渡等には当たらないが、利用者側のリバースチャージにより課税される"], "exp": "規約に同意すれば事業者以外の者も利用できるサービスは、通常事業者に限られるものではないので事業者向け電気通信利用役務の提供に当たらず、特定資産の譲渡等に該当しません（法2①八の三・八の四）。提供を受ける者の住所が国内なので国内取引となり、A社が行う資産の譲渡等として課税の対象になります（法4①③三）。リバースチャージは事業者向けの場合の仕組みです。", "note": ""}, {"cat": "問1⑵・小規模事業者に係る納税義務の免除", "ctx": "外国法人A社（9月決算、国内に支店等なし）は令和4年10月1日に出資金2,000万円で設立され、増減資はない。令和6年10月31日以前は国内での課税資産の譲渡等・課税仕入れはなく、国内で給与等の支払もない。令和6年11月1日から国内で課税資産の譲渡等に係る事業を開始した。課税事業者選択届出書・課税期間特例選択届出書・適格請求書発行事業者の登録申請書は提出していない。", "q": "法9条1項（小規模事業者に係る納税義務の免除）の規定内容として正しいものはどれか。", "choices": ["基準期間の課税売上高が1,000万円以下の事業者（適格請求書発行事業者を除く）は、その課税期間中の課税資産の譲渡等及び特定課税仕入れにつき納税義務が免除される", "基準期間の課税売上高が1,000万円未満の事業者は、その課税期間中の課税資産の譲渡等につき納税義務が免除され、特定課税仕入れは免除の対象外", "前課税期間の課税売上高が1,000万円以下の事業者は、その課税期間の納税義務が免除される", "基準期間の課税売上高が1,000万円以下であれば、適格請求書発行事業者であっても納税義務が免除される"], "exp": "事業者のうち、その課税期間の基準期間における課税売上高が1,000万円以下である者（適格請求書発行事業者を除く）は、その課税期間中に国内で行った課税資産の譲渡等（特定資産の譲渡等を除く）及び特定課税仕入れにつき、納税義務が免除されます（法9①）。", "note": ""}, {"cat": "問1⑵・3期目の基準期間", "ctx": "外国法人A社（9月決算、国内に支店等なし）は令和4年10月1日に出資金2,000万円で設立され、増減資はない。令和6年10月31日以前は国内での課税資産の譲渡等・課税仕入れはなく、国内で給与等の支払もない。令和6年11月1日から国内で課税資産の譲渡等に係る事業を開始した。課税事業者選択届出書・課税期間特例選択届出書・適格請求書発行事業者の登録申請書は提出していない。", "q": "A社の設立3期目（令和6年10月1日〜令和7年9月30日）について、法9条1項での判定として正しいものはどれか。", "choices": ["基準期間は設立1期目（令和4年10月1日〜令和5年9月30日）で、その課税売上高は0円なので、法9条1項だけでみれば免除の要件を満たす", "基準期間は設立2期目（令和5年10月1日〜令和6年9月30日）で、その課税売上高は0円なので免除の要件を満たす", "基準期間がないので、法9条1項は適用されず当然に課税事業者となる", "基準期間は当期そのものなので、令和6年11月以後の課税売上高で判定する"], "exp": "法人の基準期間は、その事業年度の前々事業年度です（法2①十四）。3期目の基準期間は1期目（令和4年10月1日〜令和5年9月30日）で、国内での課税売上高は0円なので1,000万円以下です。ただし、法9条の2・法12条の2の特例も確かめる必要があります。", "note": ""}, {"cat": "問1⑵・特定期間による特例", "ctx": "外国法人A社（9月決算、国内に支店等なし）は令和4年10月1日に出資金2,000万円で設立され、増減資はない。令和6年10月31日以前は国内での課税資産の譲渡等・課税仕入れはなく、国内で給与等の支払もない。令和6年11月1日から国内で課税資産の譲渡等に係る事業を開始した。課税事業者選択届出書・課税期間特例選択届出書・適格請求書発行事業者の登録申請書は提出していない。", "q": "3期目について、法9条の2（前年又は前事業年度等における課税売上高による納税義務の免除の特例）の適用として正しいものはどれか。", "choices": ["特定期間（前事業年度開始の日以後6月の期間）の課税売上高は0円なので、法9条の2は適用されない", "特定期間は当期開始の日以後6月の期間であり、令和6年11月以後の課税売上高で判定する", "特定期間の課税売上高が1,000万円を超えていても、給与等の支払額が1,000万円以下なら、国外事業者でも給与等の支払額で判定できる", "外国法人には特定期間の特例が適用されないので、判定は不要"], "exp": "基準期間の課税売上高が1,000万円以下でも、特定期間（法人は原則として前事業年度開始の日以後6月の期間）の課税売上高が1,000万円を超えるときは免除されません（法9の2①④）。課税売上高に代えて給与等の支払額で判定することもできますが（法9の2③）、令和6年10月1日以後に開始する課税期間については、国外事業者は給与等の支払額による判定はできません（令和6年度改正）。A社は国外事業者（外国法人）なので給与等による判定はできず、特定期間の課税売上高も0円なので適用されません。", "note": ""}, {"cat": "問1⑵・新設法人の意義", "ctx": "外国法人A社（9月決算、国内に支店等なし）は令和4年10月1日に出資金2,000万円で設立され、増減資はない。令和6年10月31日以前は国内での課税資産の譲渡等・課税仕入れはなく、国内で給与等の支払もない。令和6年11月1日から国内で課税資産の譲渡等に係る事業を開始した。課税事業者選択届出書・課税期間特例選択届出書・適格請求書発行事業者の登録申請書は提出していない。", "q": "法12条の2の「新設法人」の意義として正しいものはどれか。", "choices": ["その事業年度の基準期間がない法人のうち、その事業年度開始の日における資本金の額又は出資の金額が1,000万円以上である法人", "設立の日における資本金の額又は出資の金額が1,000万円以上の法人で、設立から3事業年度の間はすべて該当する", "その事業年度の基準期間がない法人のうち、その事業年度終了の日の資本金の額が1,000万円以上の法人", "その事業年度の基準期間がない法人のうち、資本金の額が1,000万円超の法人"], "exp": "新設法人とは、その事業年度の基準期間がない法人のうち、その事業年度開始の日における資本金の額又は出資の金額が1,000万円以上である法人をいい、基準期間がない事業年度に含まれる各課税期間は納税義務が免除されません（法12の2①）。「以上」で、事業年度開始の日で判定します。", "note": ""}, {"cat": "問1⑵・外国法人の特例", "ctx": "外国法人A社（9月決算、国内に支店等なし）は令和4年10月1日に出資金2,000万円で設立され、増減資はない。令和6年10月31日以前は国内での課税資産の譲渡等・課税仕入れはなく、国内で給与等の支払もない。令和6年11月1日から国内で課税資産の譲渡等に係る事業を開始した。課税事業者選択届出書・課税期間特例選択届出書・適格請求書発行事業者の登録申請書は提出していない。", "q": "基準期間がある外国法人が国内で事業を開始した場合の特例（法12条の2③）の内容として正しいものはどれか。", "choices": ["基準期間の末日の翌日以後に国内で課税資産の譲渡等に係る事業を開始した場合は、その事業年度は基準期間がないものとみなして新設法人等の規定を適用する", "国内で事業を開始した日の属する事業年度の翌事業年度から、基準期間がないものとみなす", "外国法人が国内で事業を開始した場合は、開始後2年間は資本金の額にかかわらず納税義務が免除されない", "国内で事業を開始した日から基準期間を新たに数えるので、開始後2事業年度は免除される"], "exp": "その事業年度の基準期間がある外国法人が、その基準期間の末日の翌日以後に国内において課税資産の譲渡等に係る事業を開始した場合には、その事業年度については基準期間がないものとみなして、新設法人の規定を適用します（法12の2③）。", "note": ""}, {"cat": "問1⑵・3期目の結論", "ctx": "外国法人A社（9月決算、国内に支店等なし）は令和4年10月1日に出資金2,000万円で設立され、増減資はない。令和6年10月31日以前は国内での課税資産の譲渡等・課税仕入れはなく、国内で給与等の支払もない。令和6年11月1日から国内で課税資産の譲渡等に係る事業を開始した。課税事業者選択届出書・課税期間特例選択届出書・適格請求書発行事業者の登録申請書は提出していない。", "q": "A社の設立3期目（令和6年10月1日〜令和7年9月30日）の納税義務として正しいものはどれか。", "choices": ["基準期間の末日の翌日（令和5年10月1日）以後の令和6年11月1日に国内で事業を開始したので基準期間がないものとみなされ、期首の出資金2,000万円の新設法人として免除されない", "基準期間・特定期間の課税売上高がいずれも0円なので、免除される", "基準期間（1期目）の末日の翌日以後に事業を開始しているが、特例は事業開始の翌事業年度から適用されるので、3期目は免除される", "新設法人の規定は設立1期目・2期目にしか適用されないので、3期目は免除される"], "exp": "3期目の基準期間は1期目（令和5年9月30日終了）で、A社はその末日の翌日である令和5年10月1日以後の令和6年11月1日に国内で課税資産の譲渡等に係る事業を始めました。このため3期目は基準期間がないものとみなされ（法12の2③）、その事業年度開始の日の出資金が2,000万円（1,000万円以上）なので、新設法人として納税義務は免除されません（法12の2①）。法9条1項・法9条の2の要件では免除されますが、法12条の2が優先して適用されます。", "note": ""}, {"cat": "問2⑴・承認の効果が生ずる課税期間（原則）", "ctx": "内国法人B社（3月決算、サービス業、設立以来課税事業者、原則課税）は、その営む事業の全ての費用に係る「消費税課税売上割合に準ずる割合の適用承認申請書」を令和7年3月17日に所轄税務署長へ提出し、令和7年4月23日に承認を受けた。", "q": "課税売上割合に準ずる割合の承認の効果が生ずる課税期間の原則として正しいものはどれか。", "choices": ["承認を受けた日の属する課税期間以後の課税期間", "承認申請書を提出した日の属する課税期間以後の課税期間", "承認を受けた日の属する課税期間の翌課税期間以後の課税期間", "承認申請書を提出した日の属する課税期間の翌課税期間以後の課税期間"], "exp": "個別対応方式で課税売上割合に準ずる割合を用いることについて税務署長の承認を受けたときは、承認を受けた日の属する課税期間以後の課税期間について、その割合を用います（法30③）。申請日ではなく承認日が基準です。", "note": ""}, {"cat": "問2⑴・みなし承認の要件", "ctx": "内国法人B社（3月決算、サービス業、設立以来課税事業者、原則課税）は、その営む事業の全ての費用に係る「消費税課税売上割合に準ずる割合の適用承認申請書」を令和7年3月17日に所轄税務署長へ提出し、令和7年4月23日に承認を受けた。", "q": "準ずる割合の承認に関する特例（みなし承認）の要件として正しいものはどれか。", "choices": ["適用を受けようとする課税期間の末日までに申請書を提出し、その末日の翌日から同日以後1月を経過する日までに承認を受けた場合は、その末日に承認があったものとみなす", "適用を受けようとする課税期間の末日までに申請書を提出し、その末日の翌日から2月を経過する日までに承認を受けた場合は、その末日に承認があったものとみなす", "適用を受けようとする課税期間の末日の翌日から1月以内に申請書を提出すれば、その末日に承認があったものとみなす", "申請書を提出した日から1月以内に承認がなかった場合は、その1月を経過する日に承認があったものとみなす"], "exp": "準ずる割合を用いようとする課税期間の末日までに承認申請書を提出した場合に、その末日の翌日以後1月を経過する日までに承認を受けたときは、その課税期間の末日に承認があったものとみなされます（令47⑥）。", "note": "※この規定は令和3年度改正で設けられたものです。"}, {"cat": "問2⑴・本問の当てはめ", "ctx": "内国法人B社（3月決算、サービス業、設立以来課税事業者、原則課税）は、その営む事業の全ての費用に係る「消費税課税売上割合に準ずる割合の適用承認申請書」を令和7年3月17日に所轄税務署長へ提出し、令和7年4月23日に承認を受けた。", "q": "B社が準ずる割合を適用できる最初の課税期間はどれか。", "choices": ["令和6年4月1日〜令和7年3月31日の課税期間（3月31日までに申請し、翌日以後1月を経過する4月30日までの4月23日に承認を受けたので、3月31日に承認があったものとみなされる）", "令和7年4月1日〜令和8年3月31日の課税期間（承認を受けた4月23日の属する課税期間から）", "令和8年4月1日〜令和9年3月31日の課税期間（承認を受けた日の属する課税期間の翌課税期間から）", "令和6年4月1日〜令和7年3月31日の課税期間（申請書を提出した日の属する課税期間から当然に適用される）"], "exp": "原則は承認日（令和7年4月23日）の属する令和8年3月期からですが、令和7年3月期の末日（3月31日）までに申請し、翌日（4月1日）以後1月を経過する日（4月30日）までに承認を受けているので、令和7年3月31日に承認があったものとみなされ、令和7年3月期から適用できます（令47⑥）。申請しただけで適用されるわけではありません。", "note": ""}, {"cat": "問2⑵・全額控除の可否", "ctx": "B社（3月決算・原則課税）の当課税期間（令和6年4月1日〜令和7年3月31日）の課税売上高は464,939,000円、課税売上割合は92％、承認を受けた課税売上割合に準ずる割合は97％。課税仕入れ等の区分は正しく行われている。前々課税期間（令和4年4月1日〜令和5年3月31日）と前課税期間（令和5年4月1日〜令和6年3月31日）は一括比例配分方式を適用した。", "q": "当課税期間の仕入控除税額の計算として正しいものはどれか。", "choices": ["課税売上高は5億円以下だが課税売上割合が95％未満なので、全額控除はできず、個別対応方式又は一括比例配分方式で計算する", "課税売上高が5億円以下なので、課税仕入れ等の税額の全額を控除できる", "準ずる割合が97％で95％以上なので、課税仕入れ等の税額の全額を控除できる", "課税売上割合が95％未満なので、一括比例配分方式でしか計算できない"], "exp": "課税売上高が5億円を超えるとき、又は課税売上割合が95％に満たないときは、全額控除はできず、個別対応方式又は一括比例配分方式で計算します（法30②）。95％の判定は課税売上割合で行い、準ずる割合では行いません。", "note": ""}, {"cat": "問2⑵・個別対応方式の計算", "ctx": "B社（3月決算・原則課税）の当課税期間（令和6年4月1日〜令和7年3月31日）の課税売上高は464,939,000円、課税売上割合は92％、承認を受けた課税売上割合に準ずる割合は97％。課税仕入れ等の区分は正しく行われている。前々課税期間（令和4年4月1日〜令和5年3月31日）と前課税期間（令和5年4月1日〜令和6年3月31日）は一括比例配分方式を適用した。", "q": "B社が個別対応方式を適用する場合の計算方法として正しいものはどれか。", "choices": ["課税資産の譲渡等にのみ要するものの税額＋共通して要するものの税額×準ずる割合97％", "課税資産の譲渡等にのみ要するものの税額＋共通して要するものの税額×課税売上割合92％", "（課税資産の譲渡等にのみ要するもの＋共通して要するもの）の税額×準ずる割合97％", "課税資産の譲渡等にのみ要するものの税額×準ずる割合97％＋共通して要するものの税額×課税売上割合92％"], "exp": "個別対応方式は、課税仕入れ等を①課税資産の譲渡等にのみ要するもの、②その他の資産の譲渡等にのみ要するもの、③共通して要するものに区分し、①の税額に③の税額×課税売上割合を加えて計算します（法30②一）。準ずる割合の承認を受けた場合は、③に乗じる割合が準ずる割合になります（法30③）。準ずる割合を掛けるのは③の共通して要するものだけで、①の課税資産の譲渡等にのみ要するものの税額は全額を控除します（①に割合を掛ける選択肢はよくある誤りです）。", "note": ""}, {"cat": "問2⑵・一括比例配分方式の計算", "ctx": "B社（3月決算・原則課税）の当課税期間（令和6年4月1日〜令和7年3月31日）の課税売上高は464,939,000円、課税売上割合は92％、承認を受けた課税売上割合に準ずる割合は97％。課税仕入れ等の区分は正しく行われている。前々課税期間（令和4年4月1日〜令和5年3月31日）と前課税期間（令和5年4月1日〜令和6年3月31日）は一括比例配分方式を適用した。", "q": "B社が一括比例配分方式を適用する場合の計算方法として正しいものはどれか。", "choices": ["課税仕入れ等の税額の合計額×課税売上割合92％（準ずる割合は使えない）", "課税仕入れ等の税額の合計額×準ずる割合97％", "共通して要するものの税額だけに課税売上割合92％を乗じる", "課税仕入れ等の税額の合計額×（課税売上割合と準ずる割合のいずれか高い割合）"], "exp": "一括比例配分方式は、その課税期間の課税仕入れ等の税額の合計額に課税売上割合を乗じて計算します（法30②二）。準ずる割合は個別対応方式の共通対応分にだけ使えるので、一括比例配分方式では課税売上割合（92％）を使います。", "note": ""}, {"cat": "問2⑵・一括比例配分方式の継続適用", "ctx": "B社（3月決算・原則課税）の当課税期間（令和6年4月1日〜令和7年3月31日）の課税売上高は464,939,000円、課税売上割合は92％、承認を受けた課税売上割合に準ずる割合は97％。課税仕入れ等の区分は正しく行われている。前々課税期間（令和4年4月1日〜令和5年3月31日）と前課税期間（令和5年4月1日〜令和6年3月31日）は一括比例配分方式を適用した。", "q": "当課税期間に個別対応方式を選べるかについて正しいものはどれか。", "choices": ["選べる。一括比例配分方式を適用した課税期間の初日（令和4年4月1日）から同日以後2年を経過する日（令和6年3月31日）までの間に開始する各課税期間は継続適用が必要だが、当課税期間（令和6年4月1日開始）はその後に開始するので、個別対応方式と一括比例配分方式から選べる", "選べない。一括比例配分方式を適用した課税期間の翌課税期間から2年間は継続適用しなければならないので、当課税期間も一括比例配分方式による", "選べない。一括比例配分方式は一度選ぶと取りやめることができない", "選べる。一括比例配分方式の継続適用の制限は課税売上高5億円超の事業者だけに適用される"], "exp": "一括比例配分方式を適用した事業者は、その課税期間の初日から同日以後2年を経過する日までの間に開始する各課税期間で継続適用した後でなければ、個別対応方式に変更できません（法30⑤）。令和4年4月1日以後2年を経過する日は令和6年3月31日で、その間に開始する令和5年3月期・令和6年3月期に継続適用しているので、令和6年4月1日開始の当課税期間は選択できます。", "note": ""}, {"cat": "問2⑵・区分経理", "ctx": "B社（3月決算・原則課税）の当課税期間（令和6年4月1日〜令和7年3月31日）の課税売上高は464,939,000円、課税売上割合は92％、承認を受けた課税売上割合に準ずる割合は97％。課税仕入れ等の区分は正しく行われている。前々課税期間（令和4年4月1日〜令和5年3月31日）と前課税期間（令和5年4月1日〜令和6年3月31日）は一括比例配分方式を適用した。", "q": "個別対応方式を適用するための課税仕入れ等の区分として正しいものはどれか。", "choices": ["課税資産の譲渡等にのみ要するもの、その他の資産の譲渡等にのみ要するもの、両者に共通して要するものの3つに区分する", "課税仕入れと非課税仕入れの2つに区分する", "標準税率分と軽減税率分の2つに区分すればよい", "課税資産の譲渡等にのみ要するものと、それ以外のものの2つに区分する"], "exp": "個別対応方式では、課税期間中の課税仕入れ等（課税仕入れ、特定課税仕入れ、保税地域からの引取りに係る課税貨物）を、課税資産の譲渡等にのみ要するもの、その他の資産の譲渡等にのみ要するもの、両者に共通して要するものに区分します（法30②一）。", "note": ""}]}, {"year": "R06", "label": "令和6年度（第74回）", "questions": [{"cat": "問1⑴・課税資産の譲渡等の意義", "ctx": "A社（家具製造業・3月決算の内国法人）は令和5年10月1日から適格請求書発行事業者である。消費税法上の「課税資産の譲渡等」の意味を考える。", "q": "「課税資産の譲渡等」の意義として正しいものはどれか。", "choices": ["資産の譲渡等のうち、国内取引の非課税の規定により消費税を課さないこととされるもの以外のもの", "資産の譲渡等のうち、輸出免税の規定により消費税が免除されるもの以外のもの", "国内において事業者が行った資産の譲渡等のうち、課税事業者が行ったもの", "資産の譲渡等のうち、非課税のもの及び輸出免税のもの以外のもの"], "exp": "課税資産の譲渡等とは、資産の譲渡等のうち、法6条1項（非課税）により消費税を課さないこととされるもの以外のものをいいます（法2①九）。輸出免税の対象となる取引も課税資産の譲渡等に含まれ、そのうえで免税になります。", "note": ""}, {"cat": "問1⑴・適格請求書の交付義務", "ctx": "A社（家具製造業・3月決算の内国法人）は令和5年10月1日から適格請求書発行事業者である。A社が国内で課税事業者である甲社に家具を販売した（輸出取引ではない）。甲社から適格請求書の交付を求められた。", "q": "A社の適格請求書の交付義務として正しいものはどれか。", "choices": ["交付しなければならない。国内で課税資産の譲渡等（免税のもの等を除く）を行い、免税事業者以外の事業者から交付を求められたため", "交付しなくてよい。適格請求書は、取引の相手方が適格請求書発行事業者である場合にだけ交付義務がある", "交付しなければならない。ただし相手方から求めがなくても、すべての取引で必ず交付する義務がある", "交付しなくてよい。適格請求書の交付は任意であり、区分記載請求書を交付すれば足りる"], "exp": "適格請求書発行事業者は、国内において課税資産の譲渡等（輸出免税等により消費税が免除されるもの等を除く）を行った場合に、その相手方である他の事業者（免税事業者を除く）から求められたときは、適格請求書を交付しなければなりません（法57の4①）。相手方が登録事業者かどうかは関係ありません。", "note": ""}, {"cat": "問1⑴・交付義務の対象となる相手方", "ctx": "A社（家具製造業・3月決算の内国法人）は令和5年10月1日から適格請求書発行事業者である。A社が国内で家具を販売した相手方は、免税事業者の乙（個人事業者）であり、乙から適格請求書がほしいと求められた。", "q": "法57条の4第1項の交付義務の判断として正しいものはどれか。", "choices": ["交付義務はない。交付義務が生じるのは、免税事業者を除く他の事業者から求められた場合だから", "交付義務がある。事業者から求められた以上、課税事業者か免税事業者かは問わないから", "交付義務はない。相手方が適格請求書発行事業者でないと交付義務は生じないから", "交付義務がある。国内取引であれば、相手方が消費者でも事業者でも交付義務があるから"], "exp": "交付義務の相手方は「他の事業者（免税事業者を除く）」です（法57の4①）。免税事業者や消費者から求められても法律上の交付義務はありません（任意に交付することは可能です）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・交付義務の除外取引", "ctx": "A社（家具製造業・3月決算の内国法人）は令和5年10月1日から適格請求書発行事業者である。A社の取引のうち、適格請求書の交付義務の対象外となるものを考える。", "q": "法57条の4第1項で交付義務の対象から除かれている取引として正しいものはどれか。", "choices": ["輸出免税等により消費税が免除される取引や、みなし譲渡などの一定の取引は、交付義務の対象外", "税込1万円未満の取引はすべて交付義務の対象外", "法人間の取引で、相手方が資本金1億円以上の場合は交付義務の対象外", "軽減税率が適用される取引は交付義務の対象外"], "exp": "交付義務の対象は国内の課税資産の譲渡等から、消費税が免除されるもの（輸出免税等）や特定資産の譲渡等を除いたもので、みなし譲渡等の一定の場合も除かれます（法57の4①）。このほか、事業の性質上交付が困難なものとして政令で定める取引（3万円未満の公共交通機関による旅客運送など）は交付義務が免除されます。1万円未満が基準となるのは、適格返還請求書の交付義務が免除される場合です。", "note": ""}, {"cat": "問1⑵イ・内外判定（意匠権）", "ctx": "A社（適格請求書発行事業者）は令和5年11月、外国法人B社（非居住者）に、A社が有する意匠権（日本でのみ登録）の通常実施権を許諾し、許諾料を受け取った。B社は課税事業者に当たる。", "q": "この取引の内外判定として正しいものはどれか。", "choices": ["国内取引。意匠権の貸付けは、その権利の登録をした機関の所在地で判定し、日本でのみ登録されているから", "国外取引。役務の提供を受けるB社の本店所在地が国外にあるから", "国外取引。許諾料を支払う者の住所地で判定するから", "国内取引。貸付けを行うA社の住所地で必ず判定するから"], "exp": "特許権・意匠権などの譲渡・貸付けの内外判定は、その権利の登録をした機関の所在地で行います。同じ権利を2以上の国で登録している場合に限り、譲渡・貸付けを行う者の住所地で判定します（令6①五）。日本でのみ登録されているので国内取引です。", "note": ""}, {"cat": "問1⑵イ・輸出免税", "ctx": "A社（適格請求書発行事業者）は令和5年11月、外国法人B社（非居住者）に、A社が有する意匠権（日本でのみ登録）の通常実施権を許諾し、許諾料を受け取った。B社は課税事業者に当たる。", "q": "この取引の消費税の課税関係として正しいものはどれか。", "choices": ["輸出免税。非居住者に対する無形固定資産等の貸付けとして、消費税が免除される", "課税。国内取引であり、非課税にも免税にも当たらない", "非課税。工業所有権の貸付けは非課税取引に当たる", "不課税。非居住者との取引は課税の対象外になる"], "exp": "国内取引に当たる意匠権の通常実施権の許諾は、課税資産の譲渡等に当たります。そのうえで、非居住者に対する無形固定資産等の貸付けは輸出取引等として消費税が免除されます（法7①五、令17②六）。", "note": ""}, {"cat": "問1⑵イ・交付の要否", "ctx": "A社（適格請求書発行事業者）は令和5年11月、外国法人B社（非居住者）に、A社が有する意匠権（日本でのみ登録）の通常実施権を許諾し、許諾料を受け取った。B社は課税事業者に当たる。B社から適格請求書の交付を求められた。", "q": "A社の適格請求書の交付の要否として正しいものはどれか。", "choices": ["不要。消費税が免除される輸出取引等は、交付義務の対象となる課税資産の譲渡等から除かれているため", "必要。国内取引の課税資産の譲渡等であり、課税事業者から求められたため", "必要。ただし税率欄を「0％」と記載した適格請求書を交付する", "不要。外国法人は適格請求書発行事業者になれないため"], "exp": "交付義務の対象は、国内の課税資産の譲渡等のうち消費税が免除されるもの等を除いたものです（法57の4①）。この取引は輸出免税なので、適格請求書を交付する必要はありません。", "note": ""}, {"cat": "問1⑵イ・内外判定（複数国で登録）", "ctx": "A社（適格請求書発行事業者・内国法人）が有する意匠権が、日本と米国の2か国で登録されている。A社は外国法人B社（非居住者）にこの意匠権の通常実施権を許諾した。", "q": "この取引の内外判定として正しいものはどれか。", "choices": ["国内取引。同じ権利を2以上の国で登録している場合は、貸付けを行う者（A社）の住所地で判定するから", "国外取引。2以上の国で登録している場合は、貸付けを受ける者（B社）の住所地で判定するから", "国内と国外の登録国の数で按分して、一部だけ国内取引とする", "国外取引。米国でも登録されている以上、国内取引には当たらないから"], "exp": "特許権・意匠権などの内外判定は原則としてその権利の登録機関の所在地で行いますが、同一の権利を2以上の国で登録している場合は、譲渡又は貸付けを行う者の住所地で判定します（令6①五）。A社は内国法人なので国内取引です（そのうえで非居住者への貸付けなので輸出免税となります）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑵ロ・電気通信利用役務の提供", "ctx": "A社（適格請求書発行事業者）は令和5年11月、外国法人C社（非居住者、本店は国外）の依頼で、インターネット上のA社のホームページにC社の販売商品の広告（C社が企画・制作）を掲載し、広告掲載料を受け取った。C社は課税事業者に当たる。", "q": "この広告掲載の性質として正しいものはどれか。", "choices": ["電気通信利用役務の提供に当たる。電気通信回線を介して行われる役務の提供で、他の資産の譲渡等に付随するものではないから", "電気通信利用役務の提供に当たらない。広告の企画・制作をC社が行っているから", "広告の制作業務の一部として、通常の役務の提供に当たる", "通信の媒介に当たり、電気通信利用役務の提供から除かれる"], "exp": "電気通信利用役務の提供とは、電気通信回線を介して行われる著作物の提供その他の役務の提供（電話等の通信の媒介を除く）で、他の資産の譲渡等の結果の通知など、他の資産の譲渡等に付随するもの以外をいいます（法2①八の三）。インターネット上の広告掲載はこれに当たります。", "note": ""}, {"cat": "問1⑵ロ・内外判定", "ctx": "A社（適格請求書発行事業者）は令和5年11月、外国法人C社（非居住者、本店は国外）の依頼で、インターネット上のA社のホームページにC社の販売商品の広告（C社が企画・制作）を掲載し、広告掲載料を受け取った。C社は課税事業者に当たる。", "q": "この取引の内外判定と課税関係として正しいものはどれか。", "choices": ["国外取引。役務の提供を受けるC社の本店所在地が国外にあるので、課税の対象外（不課税）", "国内取引。役務の提供を行うA社の本店所在地が国内にあるので課税", "国内取引だが、非居住者に対する役務の提供として輸出免税", "国内取引。ホームページのサーバーが国内にあれば国内取引になる"], "exp": "電気通信利用役務の提供の内外判定は、役務の提供を受ける者の住所若しくは居所又は本店若しくは主たる事務所の所在地で行います（法4③三）。C社の本店は国外なので国外取引となり、課税の対象外です。輸出免税（国内取引のうち免税）とは違います。", "note": ""}, {"cat": "問1⑵ロ・交付の要否", "ctx": "A社（適格請求書発行事業者）は令和5年11月、外国法人C社（非居住者、本店は国外）の依頼で、インターネット上のA社のホームページにC社の販売商品の広告（C社が企画・制作）を掲載し、広告掲載料を受け取った。C社は課税事業者に当たる。C社から適格請求書の交付を求められた。", "q": "A社の適格請求書の交付の要否として正しいものはどれか。", "choices": ["不要。国外取引であり、国内において行う課税資産の譲渡等に当たらないため", "必要。電気通信利用役務の提供は、事業者向けであれば必ず交付義務があるため", "不要。輸出免税により消費税が免除される取引に当たるため", "必要。A社は適格請求書発行事業者であり、課税事業者から求められたため"], "exp": "交付義務は、国内において課税資産の譲渡等を行った場合に生じます（法57の4①）。この取引は国外取引で課税の対象外なので、適格請求書を交付する必要はありません。理由は「輸出免税」ではなく「国外取引」です。", "note": ""}, {"cat": "問1⑶・媒介者交付特例の要件", "ctx": "A社（適格請求書発行事業者）は、小売業を営む内国法人D社に、A社が製造した家具の国内での販売を委託している。D社が家具の購入者に交付する適格請求書について、媒介者交付特例（令70の12①）の適用を検討している。", "q": "媒介者交付特例の適用要件として正しいものはどれか。", "choices": ["委託者A社と受託者D社がともに適格請求書発行事業者であり、A社が取引の時までに登録を受けている旨をD社に通知していること", "委託者A社が適格請求書発行事業者であれば、受託者D社は登録を受けていなくてもよいこと", "受託者D社が適格請求書発行事業者であれば、委託者A社は登録を受けていなくてもよいこと", "A社とD社がともに登録を受け、事前に所轄税務署長の承認を受けていること"], "exp": "媒介者交付特例は、事業者（適格請求書発行事業者に限る）が媒介者等（適格請求書発行事業者に限る）を介して国内で課税資産の譲渡等を行う場合に、媒介者等が取引の時までにその事業者から登録を受けている旨の通知を受けているときに適用されます（令70の12①）。税務署長の承認は不要です。", "note": ""}, {"cat": "問1⑶・媒介者交付特例の内容", "ctx": "A社（適格請求書発行事業者）は、小売業を営む内国法人D社に、A社が製造した家具の国内での販売を委託している。D社が家具の購入者に交付する適格請求書について、媒介者交付特例（令70の12①）の適用を検討している。特例の適用要件はすべて満たしている。", "q": "D社が購入者に交付する適格請求書の記載として正しいものはどれか。", "choices": ["A社の氏名又は名称及び登録番号に代えて、D社の名称及び登録番号を記載した適格請求書を、A社に代わって交付できる", "必ずA社の名称及び登録番号を記載しなければならず、D社の名称は記載できない", "A社とD社の両方の登録番号を記載しなければ、適格請求書として認められない", "D社の名称と登録番号を記載するが、D社自身の売上げとして交付する"], "exp": "媒介者交付特例では、媒介者等は、その事業者（委託者）の氏名又は名称及び登録番号に代えて、媒介者等の氏名又は名称及び登録番号を記載した適格請求書（又は電磁的記録）を、委託者に代わって交付（提供）することができます（令70の12①）。売上げはあくまで委託者A社のものです。", "note": ""}, {"cat": "問1⑶・受託者D社が行うべき事項", "ctx": "A社（適格請求書発行事業者）は、小売業を営む内国法人D社に、A社が製造した家具の国内での販売を委託している。D社が家具の購入者に交付する適格請求書について、媒介者交付特例（令70の12①）の適用を検討している。特例を適用して、D社が購入者に適格請求書を交付した。", "q": "D社が法令上行うべき事項の組合せとして正しいものはどれか。", "choices": ["交付した適格請求書の写し（又は電磁的記録）を保存し、速やかにその写しをA社に交付（提供）する", "交付した適格請求書の写しを保存するだけでよく、A社への交付は不要", "交付した適格請求書の写しをA社に交付すれば、D社自身は保存しなくてよい", "交付の都度、所轄税務署長に媒介者交付特例の適用を届け出る"], "exp": "媒介者等は、交付した適格請求書の写し又は提供した電磁的記録を保存しなければならず（令70の12①）、さらに速やかにその写し等を委託者に交付（提供）しなければなりません（令70の12③）。保存と委託者への交付の両方が必要です。", "note": ""}, {"cat": "問1⑶・委託者A社が行うべき事項", "ctx": "A社（適格請求書発行事業者）は、小売業を営む内国法人D社に、A社が製造した家具の国内での販売を委託している。D社が家具の購入者に交付する適格請求書について、媒介者交付特例（令70の12①）の適用を検討している。", "q": "委託者A社が法令上行うべき事項として正しいものはどれか。", "choices": ["D社が家具を販売する時までに、登録を受けている旨をD社に通知する。登録をやめたなど適格請求書発行事業者でなくなったときは、速やかにその旨をD社に通知する", "D社への通知は、特例を初めて適用する課税期間の末日までに行えばよい", "登録を受けている旨の通知は不要で、D社が国税庁の公表サイトで確認すれば足りる", "A社が適格請求書発行事業者でなくなった場合は、所轄税務署長に届け出れば、D社への通知は不要"], "exp": "媒介者等が取引の時までに委託者から登録を受けている旨の通知を受けていることが特例の要件です（令70の12①）。また、通知を行った事業者が適格請求書発行事業者でなくなった場合は、通知を受けた媒介者等に対し、速やかにその旨を通知しなければなりません（令70の12④）。", "note": ""}, {"cat": "問2⑴・基準期間における課税売上高", "ctx": "内国法人E社の基準期間中の取引は、国内での課税資産の譲渡等（輸出免税分を含む）の税抜対価800万円と、非課税資産の輸出取引等（法31条1項により課税資産の譲渡等に係る輸出取引等とみなされるもの。非居住者に対する貸付金の利息など）300万円である。売上げの返品等はない。", "q": "E社の基準期間における課税売上高と、その考え方として正しいものはどれか。", "choices": ["800万円。法31条1項のみなし規定は仕入税額控除（課税売上割合の計算）のためのもので、基準期間における課税売上高には含まれない", "1,100万円。法31条1項により輸出取引等とみなされるので、課税資産の譲渡等の対価の額に含まれる", "800万円から輸出免税分を除いた金額。消費税が免除される取引は基準期間における課税売上高に含まれない", "1,100万円。課税売上割合の計算に含めるものは、すべて基準期間における課税売上高にも含まれる"], "exp": "基準期間における課税売上高は、基準期間中に国内で行った課税資産の譲渡等の対価の額（税抜）の合計額から売上げに係る税抜対価の返還等の金額を控除した残額で、輸出免税分も含みます（法9②）。法31条1項は、非課税資産の輸出取引等を輸出取引等とみなして仕入税額控除を適用するための規定なので、その対価の額は基準期間における課税売上高には含まれません。本試験の文章は「正しい」です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑴・基準期間における課税売上高", "ctx": "内国法人H社の基準期間中の売上げは、国内での課税資産の譲渡等のうち国内向け販売の税抜対価600万円と、輸出免税の対象となる商品の輸出販売の対価500万円である。非課税売上げや返品等はない。", "q": "H社の基準期間における課税売上高として正しいものはどれか。", "choices": ["1,100万円。輸出免税の対象となる取引も課税資産の譲渡等なので、基準期間における課税売上高に含まれる", "600万円。消費税が免除される輸出取引は、基準期間における課税売上高から除かれる", "1,210万円。国内向け販売の600万円に消費税を含めて計算する", "600万円。輸出販売は国外取引なので課税資産の譲渡等に当たらない"], "exp": "基準期間における課税売上高は、基準期間中に国内で行った課税資産の譲渡等の税抜対価の額の合計額から、売上げに係る税抜対価の返還等の金額を控除した残額です（法9②）。輸出免税の取引も国内で行った課税資産の譲渡等なので含まれます。これに対し、法31条1項で輸出取引等とみなされる非課税資産の輸出取引等の対価は含まれません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑵・仕入対価の返還等（原則）", "ctx": "F社は令和6年3月期は免税事業者、令和7年3月期は課税事業者である。令和6年3月期に国内で行った棚卸資産の課税仕入れについて、令和7年3月期に仕入割戻しを受けた。この棚卸資産は令和6年3月末までにすべて販売済みで、令和7年3月期の期首に在庫はない。", "q": "令和7年3月期における法32条（仕入対価の返還等）の適用として正しいものはどれか。", "choices": ["適用されない。免税事業者であった課税期間の課税仕入れは仕入税額控除を受けていないから", "適用される。仕入割戻しを受けたのは課税事業者である課税期間だから", "適用される。棚卸資産の課税仕入れについては、課税期間を問わず必ず適用される", "適用されない。ただし、返還を受けた金額を売上げとして課税標準に含める"], "exp": "法32条は、仕入税額控除の適用を受ける課税事業者について、控除した仕入税額を調整する規定です。免税事業者であった課税期間の課税仕入れについて、課税事業者となった課税期間に返還等を受けても、原則として法32条は適用されません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑵・仕入対価の返還等（棚卸資産の調整）", "ctx": "F社は令和6年3月期は免税事業者、令和7年3月期は課税事業者である。令和6年3月期に国内で課税仕入れをした棚卸資産を令和6年3月31日に在庫として持っており、令和7年3月期に法36条1項（免税事業者が課税事業者となった場合の棚卸資産の調整）を適用した。その後、令和7年3月期にこの棚卸資産の仕入割戻しを受けた。", "q": "この仕入割戻しへの法32条の適用と、本試験の文章「法32条が適用されることはない」の正誤として正しいものはどれか。", "choices": ["法32条が適用される。棚卸資産の調整で仕入税額控除の対象となった課税仕入れには適用があるので、本試験の文章は誤り", "法32条は適用されない。免税事業者であった課税期間の課税仕入れなので、本試験の文章は正しい", "法32条は適用されない。棚卸資産の調整額から直接減額するので、本試験の文章は正しい", "法32条が適用される。課税事業者となった課税期間の返還等には必ず適用されるので、本試験の文章は誤り"], "exp": "免税事業者であった課税期間の課税仕入れに係る返還等には原則として法32条は適用されませんが、法36条1項の棚卸資産の調整の適用を受けた棚卸資産の課税仕入れについては、仕入税額控除の対象になっているので、その返還等に法32条が適用されます。このため本試験の文章は「誤り」です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑶・仮決算の中間申告と還付", "ctx": "G社（3月決算、課税事業者）は、令和6年4月1日〜9月30日の期間について仮決算をして中間申告書を提出する。大型の設備投資があったため、この6か月間の課税標準額に対する消費税額は300万円、控除されるべき消費税額は500万円となった。", "q": "この中間申告での控除不足額200万円の取扱いとして正しいものはどれか。", "choices": ["還付を受けることはできない。還付は確定申告書又は還付申告書の提出によるもので、中間申告による還付の規定はないから（中間納付額は0円）", "仮決算による中間申告書を提出すれば、控除不足額200万円の還付を受けられる", "還付は受けられないが、控除不足額200万円を翌課税期間の納付税額から控除できる", "前年実績による中間申告（予定申告）に切り替えた場合に限り、還付を受けられる"], "exp": "仮決算による中間申告書には、課税標準額に対する消費税額から控除されるべき消費税額を控除した残額を記載します（法43①）。控除不足額の還付は確定申告書（法52①）又は還付を受けるための申告書（法46①）の提出によるもので、中間申告による還付の規定はありません。控除不足額が出ても還付されず、中間納付額は0円になります。本試験の文章は「誤り」です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑶・還付を受ける方法", "ctx": "G社（3月決算、課税事業者）は、令和7年3月期の確定申告で、控除しきれない仕入税額（控除不足額）が生じる見込みである。", "q": "控除不足額の還付を受ける方法として正しいものはどれか。", "choices": ["確定申告書（又は還付を受けるための申告書）を提出し、その申告に基づいて還付を受ける", "仮決算による中間申告書で控除不足額を記載すれば、その時点で還付を受けられる", "所轄税務署長に還付請求書を提出し、承認を受けたときに限り還付される", "課税期間の終了後、税務署長が職権で計算して還付するので申告は不要"], "exp": "仕入れに係る消費税額の控除不足額の還付は、確定申告書の提出（法52①）又は確定申告義務がない場合の還付を受けるための申告書の提出（法46①）によって受けます。中間申告で還付を受けることはできません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}]}, {"year": "R05", "label": "令和5年度（第73回）", "questions": [{"cat": "問1⑴・課税仕入れの意義", "ctx": "事業者が国内で行う取引のうち、どのようなものが「課税仕入れ」に当たるかを考える。", "q": "「課税仕入れ」の意義として正しいものはどれか。", "choices": ["事業者が事業として他の者から資産を譲り受け、借り受け、又は役務の提供（給与等を対価とするものを除く）を受けることで、その他の者が事業として行ったとした場合に課税資産の譲渡等（輸出免税等を除く）に当たるもの", "事業者が事業として他の事業者から資産を譲り受けることで、相手方が実際に課税資産の譲渡等を行った（相手方が課税事業者である）ものに限る", "事業者が事業として他の者から資産を譲り受け、又は役務の提供を受けることで、給与等を対価とする役務の提供も含む", "事業者が事業として他の者から資産を譲り受けることで、相手方が事業として行ったとした場合に非課税取引や輸出免税取引に当たるものも含む"], "exp": "課税仕入れは、事業者が事業として他の者から資産を譲り受け、若しくは借り受け、又は役務の提供（所得税法の給与等を対価とするものを除く）を受けることで、その他の者が事業として行ったとした場合に課税資産の譲渡等（輸出免税等により免除されるものを除く）に当たるものをいいます（法2①十二）。相手方が事業者かどうかは問いません。", "note": ""}, {"cat": "問1⑴・消費者からの仕入れ", "ctx": "A社（6月末決算の内国法人、不動産貸付業、課税事業者、原則課税）は、令和5年4月1日に、国内に住所を有し事業を営んでいない給与所得者の個人Bから、B所有の国内の居住用家屋（戸建て）を24,200,000円で買う契約を結び、同年5月1日に引渡しを受けた。A社は同日、給与所得者の個人Cとの間で、この家屋を同年6月1日から1年間、居住用として月200,000円で貸す契約を結んだ（旅館業法の旅館業に係る施設の貸付けには当たらない）。", "q": "A社の居住用家屋の購入は課税仕入れになるか。", "choices": ["なる。売主Bは事業者ではないが、Bが事業として譲渡したとした場合に課税資産の譲渡等に当たる（建物の譲渡は非課税ではない）ので、A社の課税仕入れになる", "ならない。売主Bは事業を営まない個人で、Bには納税義務がないので、A社の課税仕入れにもならない", "ならない。住宅の譲渡は、住宅の貸付けと同じく非課税取引なので課税仕入れにならない", "なる。ただし売主が消費者なので、課税仕入れになるのは建物価額の80％部分だけである"], "exp": "課税仕入れの「他の者」には消費者も含まれます（基通11-1-3）。判定は、相手方が事業として行ったとした場合に課税資産の譲渡等に当たるかで行います（法2①十二）。非課税なのは住宅の「貸付け」で、建物の譲渡は課税です。したがってBからの購入はA社の課税仕入れです。", "note": "※出題当時は区分記載請求書等保存方式でした。現行法でも、相手方が消費者でも課税仕入れに当たるという結論は変わりません（仕入税額控除の可否は次の居住用賃貸建物の論点で判断します）。"}, {"cat": "問1⑵・高額特定資産の判定", "ctx": "A社（6月末決算の内国法人、不動産貸付業、課税事業者、原則課税）は、令和5年4月1日に、国内に住所を有し事業を営んでいない給与所得者の個人Bから、B所有の国内の居住用家屋（戸建て）を24,200,000円で買う契約を結び、同年5月1日に引渡しを受けた。A社は同日、給与所得者の個人Cとの間で、この家屋を同年6月1日から1年間、居住用として月200,000円で貸す契約を結んだ（旅館業法の旅館業に係る施設の貸付けには当たらない）。", "q": "この居住用家屋は高額特定資産に当たるか。", "choices": ["当たる。税抜価額22,000,000円（＝24,200,000円×100/110）が1,000万円以上の調整対象固定資産である", "当たらない。税込24,200,000円で判定するが、建物は棚卸資産でも調整対象固定資産でもない", "当たる。税込24,200,000円が1,000万円以上なので当たり、税抜で判定する必要はない", "当たらない。高額特定資産の基準は税抜1億円以上である"], "exp": "高額特定資産は、一の取引単位の課税仕入れに係る支払対価の額の110分の100相当額が1,000万円以上の棚卸資産又は調整対象固定資産です（法12の4①、令25の5①）。24,200,000円×100/110＝22,000,000円で1,000万円以上なので当たります。", "note": ""}, {"cat": "問1⑵・居住用賃貸建物の意義", "ctx": "居住用賃貸建物の定義を考える。", "q": "「居住用賃貸建物」の意義として正しいものはどれか。", "choices": ["住宅の貸付けの用に供しないことが明らかな建物（附属設備を含む）以外の建物で、高額特定資産又は調整対象自己建設高額資産に該当するもの", "住宅の貸付けの用に供することが明らかな建物で、調整対象固定資産に該当するもの（税抜100万円以上）", "住宅の貸付けの用に供しないことが明らかな建物以外の建物で、金額にかかわらず全てのもの", "住宅の貸付けの用に供しないことが明らかな建物（附属設備を含む）以外の建物で、税込1,000万円以上のもの"], "exp": "居住用賃貸建物は、住宅の貸付けの用に供しないことが明らかな建物（その附属設備を含む）以外の建物で、高額特定資産又は調整対象自己建設高額資産に該当するものです（法30⑩）。「供することが明らか」ではなく「供しないことが明らか」以外と定めている点、金額要件は高額特定資産（税抜1,000万円以上）による点に注意します。", "note": ""}, {"cat": "問1⑵・仕入税額控除の制限", "ctx": "A社（6月末決算の内国法人、不動産貸付業、課税事業者、原則課税）は、令和5年4月1日に、国内に住所を有し事業を営んでいない給与所得者の個人Bから、B所有の国内の居住用家屋（戸建て）を24,200,000円で買う契約を結び、同年5月1日に引渡しを受けた。A社は同日、給与所得者の個人Cとの間で、この家屋を同年6月1日から1年間、居住用として月200,000円で貸す契約を結んだ（旅館業法の旅館業に係る施設の貸付けには当たらない）。\nA社の帳簿・請求書等は法令に従い保存されている。", "q": "この家屋の課税仕入れに係る消費税額は仕入税額控除の対象になるか。", "choices": ["ならない。高額特定資産に当たる居住用賃貸建物の課税仕入れなので、法30条10項により仕入税額控除の規定は適用されない", "なる。課税仕入れに当たり、帳簿・請求書等も保存しているので全額控除できる", "なる。ただし住宅の貸付けは非課税なので、個別対応方式でその他の資産の譲渡等にのみ要するものとして控除額0円になるだけである", "ならない。売主Bが適格請求書発行事業者でないので、課税仕入れそのものに当たらないからである"], "exp": "事業者が国内で行う居住用賃貸建物に係る課税仕入れ等の税額については、仕入税額控除の規定は適用しません（法30⑩）。この家屋は税抜22,000,000円で高額特定資産に当たり、住宅の貸付けの用に供しないことが明らかな建物ではないので居住用賃貸建物に当たります。控除の計算方法以前に、控除の対象外になります。", "note": "※出題当時は区分記載請求書等保存方式でした。現行法では、消費者からの仕入れは原則として適格請求書がない仕入れですが、その点にかかわらず居住用賃貸建物の制限（令和2年10月〜）により控除の対象になりません。"}, {"cat": "問1⑵・居住用賃貸建物の判定", "ctx": "課税事業者F社は、税抜8,000,000円で中古の居住用アパート（住宅として賃貸予定）を購入した。原則課税で、自己建設ではない。", "q": "この建物に係る課税仕入れの取扱いとして正しいものはどれか。", "choices": ["居住用賃貸建物に当たらないので、法30条10項の制限は受けず、仕入税額控除の計算の対象になる", "住宅として貸す建物なので、金額にかかわらず居住用賃貸建物に当たり控除できない", "調整対象固定資産に当たるので居住用賃貸建物に当たり控除できない", "税込8,800,000円で判定し、1,000万円未満なので課税仕入れに当たらない"], "exp": "居住用賃貸建物は高額特定資産又は調整対象自己建設高額資産に該当するものに限られます（法30⑩）。税抜8,000,000円は1,000万円未満なので高額特定資産に当たらず、制限は受けません。課税仕入れであることは変わりません（非課税売上対応として個別対応方式で控除されないことはあります）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑵・居住用賃貸建物の判定", "ctx": "課税事業者G社は、税抜50,000,000円で店舗専用の建物（構造上も住宅として貸すことのできない建物）を購入した。", "q": "この建物は居住用賃貸建物に当たるか。", "choices": ["当たらない。住宅の貸付けの用に供しないことが明らかな建物なので、高額特定資産であっても居住用賃貸建物に当たらない", "当たる。税抜1,000万円以上の建物は全て居住用賃貸建物になる", "当たる。将来住宅として貸す可能性が全くないとはいえないからである", "当たらない。居住用賃貸建物は税抜1億円以上の建物に限られるからである"], "exp": "居住用賃貸建物からは「住宅の貸付けの用に供しないことが明らかな建物」が除かれます（法30⑩）。店舗専用など建物の構造・設備等の状況から住宅として貸さないことが明らかなものは当たりません（基通11-7-1）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・住宅の貸付けの範囲", "ctx": "住宅の貸付けが非課税とされる範囲を考える。", "q": "非課税とされる「住宅の貸付け」の範囲として正しいものはどれか。", "choices": ["契約において人の居住の用に供することが明らかにされているもの（契約で用途が明らかでない場合に、貸付け等の状況からみて居住用が明らかなものを含む）に限り、貸付期間が1月未満の場合と旅館業に係る施設の貸付けの場合を除く", "契約において居住用とされているものに限り、貸付期間が1年未満の場合と旅館業に係る施設の貸付けの場合を除く", "建物の構造が住宅であれば、契約上の用途にかかわらず全て非課税となる", "契約において居住用とされているものに限り、貸付期間が1月以下の場合を除くが、旅館業に係る施設の貸付けも非課税となる"], "exp": "住宅の貸付けは、契約において人の居住の用に供することが明らかにされているもの（契約で用途が明らかでない場合に、その貸付け等の状況からみて人の居住の用に供されていることが明らかなものを含む）に限り、一時的に使用させる場合等を除いて非課税です（法別表第二第十三号）。除かれるのは、貸付期間が1月に満たない場合と旅館業法の旅館業に係る施設の貸付けに当たる場合です（令16の2）。", "note": ""}, {"cat": "問1⑶・個人Cへの貸付け", "ctx": "A社（6月末決算の内国法人、不動産貸付業、課税事業者、原則課税）は、令和5年4月1日に、国内に住所を有し事業を営んでいない給与所得者の個人Bから、B所有の国内の居住用家屋（戸建て）を24,200,000円で買う契約を結び、同年5月1日に引渡しを受けた。A社は同日、給与所得者の個人Cとの間で、この家屋を同年6月1日から1年間、居住用として月200,000円で貸す契約を結んだ（旅館業法の旅館業に係る施設の貸付けには当たらない）。", "q": "A社が個人Cに行う家屋の貸付けに消費税は課されるか。", "choices": ["課されない。国内に所在する住宅を、契約で居住用として1年間貸し付け、旅館業の施設の貸付けにも当たらないので、非課税の住宅の貸付けに当たる", "課される。A社は不動産貸付業の課税事業者なので、その貸付けは全て課税資産の譲渡等になる", "課される。月額200,000円と高額なので、非課税の住宅の貸付けに当たらない", "課されない。借主Cが事業者ではないので、そもそも資産の譲渡等に当たらない"], "exp": "資産の貸付けの内外判定は貸付け時の資産の所在場所で行い、国内取引です（法4③一）。契約で居住用とされ、貸付期間は1年（1月以上）、旅館業の施設の貸付けにも当たらないので、非課税の住宅の貸付けです（法6①、別表第二第十三号、令16の2）。借主が消費者でも対価を得て行う事業としての貸付けなので資産の譲渡等です。", "note": ""}, {"cat": "問1⑶・一時的な貸付け", "ctx": "課税事業者H社は、所有するマンションの一室を、居住用として個人に20日間だけ貸し付けた（旅館業の施設の貸付けには当たらない）。", "q": "この貸付けの取扱いとして正しいものはどれか。", "choices": ["課税される。貸付期間が1月に満たないので、非課税の住宅の貸付けから除かれる", "非課税になる。契約で居住用とされているので期間は問わない", "非課税になる。除かれるのは貸付期間が1週間未満の場合だけである", "不課税になる。短期間の貸付けは資産の譲渡等に当たらない"], "exp": "住宅の貸付けに係る期間が1月に満たない場合は、非課税の住宅の貸付けから除かれます（令16の2）。20日間の貸付けは課税資産の譲渡等になります。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑴・課税期間の特例", "ctx": "D社（3月末決算、資本金1,000万円）は令和4年11月1日に設立され、設立日から国内で課税資産の譲渡等に係る事業を開始した。令和5年1月16日に、課税期間を3月ごとの期間に短縮する消費税課税期間特例選択届出書を提出した。", "q": "3月ごとに短縮する場合の課税期間の区分方法として正しいものはどれか。", "choices": ["事業年度をその開始の日以後3月ごとに区分した各期間（最後に3月未満の期間が生じたときは、その3月未満の期間）", "暦の上の四半期（1〜3月、4〜6月…）ごとに区分した各期間", "届出書の提出日以後3月ごとに区分した各期間", "事業年度の末日からさかのぼって3月ごとに区分した各期間"], "exp": "事業年度が3月を超える法人が3月ごとの期間に短縮する場合、その事業年度をその開始の日以後3月ごとに区分した各期間（最後に3月未満の期間が生じたときは、その3月未満の期間）が課税期間になります（法19①四）。", "note": ""}, {"cat": "問2⑴・届出書の効力", "ctx": "D社（3月末決算、資本金1,000万円）は令和4年11月1日に設立され、設立日から国内で課税資産の譲渡等に係る事業を開始した。令和5年1月16日に、課税期間を3月ごとの期間に短縮する消費税課税期間特例選択届出書を提出した。", "q": "届出書の効力が生じる時期として正しいものはどれか。", "choices": ["令和4年11月1日から生じる。提出日の属する期間が事業を開始した日の属する期間なので、その期間の初日から効力が生じる", "令和5年2月1日から生じる。提出日の属する期間の翌期間の初日から効力が生じる", "令和5年4月1日から生じる。提出日の属する事業年度の翌事業年度から効力が生じる", "令和5年1月16日（提出日）から生じる"], "exp": "課税期間特例選択届出書の効力は、原則として提出日の属する期間の翌期間の初日以後に生じますが、提出日の属する期間が国内で課税資産の譲渡等に係る事業を開始した日の属する期間である場合は、その期間の初日以後に生じます（法19②、令41①一）。提出日の令和5年1月16日は、事業開始日を含む期間（令和4年11月1日〜令和5年1月31日）に属します。", "note": ""}, {"cat": "問2⑴・D社の第1期の課税期間", "ctx": "D社（3月末決算、資本金1,000万円）は令和4年11月1日に設立され、設立日から国内で課税資産の譲渡等に係る事業を開始した。令和5年1月16日に、課税期間を3月ごとの期間に短縮する消費税課税期間特例選択届出書を提出した。", "q": "D社の設立第1事業年度（令和4年11月1日〜令和5年3月31日）の課税期間はどうなるか。", "choices": ["令和4年11月1日〜令和5年1月31日と、令和5年2月1日〜令和5年3月31日の2つ", "令和4年11月1日〜令和5年1月15日と、令和5年1月16日〜令和5年3月31日の2つ", "令和4年11月1日〜令和5年3月31日の1つ（短縮は翌事業年度から）", "令和4年11月1日〜令和4年12月31日と、令和5年1月1日〜令和5年3月31日の2つ"], "exp": "効力は事業開始日の属する期間の初日（令和4年11月1日）から生じます（法19②）。事業年度開始日以後3月ごとに区分すると、令和4年11月1日〜令和5年1月31日、最後の3月未満の期間として令和5年2月1日〜令和5年3月31日の2つの課税期間になります（法19①四）。", "note": ""}, {"cat": "問2⑴・届出書の効力（原則）", "ctx": "課税事業者K社（3月末決算、設立10期目、事業は以前から行っている）は、令和8年5月20日に、課税期間を3月ごとに短縮する消費税課税期間特例選択届出書を提出した。", "q": "届出書の効力が生じる日として正しいものはどれか。", "choices": ["令和8年7月1日（提出日の属する3月の期間の翌期間の初日）", "令和8年4月1日（提出日の属する期間の初日）", "令和9年4月1日（翌事業年度の初日）", "令和8年5月20日（提出日）"], "exp": "事業開始の期間などの例外に当たらない場合、効力は提出日の属する期間の翌期間の初日以後に生じます（法19②）。令和8年5月20日は令和8年4月1日〜6月30日の期間に属するので、令和8年7月1日から効力が生じます。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑵・食事の提供の意義", "ctx": "軽減税率の対象から除かれる「食事の提供」の意義を考える。", "q": "「食事の提供」の意義として正しいものはどれか。", "choices": ["飲食店業等を営む者が、テーブル、椅子、カウンターその他の飲食に用いられる設備のある場所において飲食料品を飲食させる役務の提供（持帰りのための容器に入れ又は包装を施して行う譲渡を除く）", "飲食料品を調理して販売すること全て（持帰りのための容器に入れたものを含む）", "飲食料品を事業者に販売し、その事業者が飲食させる設備で提供すること", "テーブル等の設備の有無にかかわらず、飲食店業を営む者が行う飲食料品の譲渡全て"], "exp": "食事の提供とは、飲食店業等を営む者が行う、テーブル、椅子、カウンターその他の飲食に用いられる設備のある場所において飲食料品を飲食させる役務の提供をいい、持帰りのための容器に入れ又は包装を施して行う飲食料品の譲渡は含みません（平成28年改正法附則34①一イ）。", "note": ""}, {"cat": "問2⑵・食材の販売の税率", "ctx": "食品卸売業を営むE社（課税事業者）は、飲食店業を営むF社に対して、F社のレストランで客に提供する食事の食材（肉類）を販売した。", "q": "E社のこの販売に適用される消費税の税率はどれか。", "choices": ["軽減税率（国税6.24％・地方消費税を合わせて8％）。E社の販売は食事の提供ではなく飲食料品の譲渡に当たる", "標準税率（国税7.8％）。F社が店内で食事として提供する食材なので、食事の提供に当たる", "標準税率（国税7.8％）。事業者間の取引には軽減税率は適用されない", "軽減税率（国税6.24％）。ただしF社が仕入税額控除をする際は7.8％で計算する"], "exp": "軽減税率は飲食料品の譲渡に適用され、食事の提供は除かれます（平成28年改正法附則34①一）。食事の提供に当たるかは、飲食させる役務を提供する者（F社）の取引で判定します。E社は食材を売っているだけで、飲食させる役務を提供していないので、飲食料品の譲渡として軽減税率が適用されます。買い手のF社も軽減税率で仕入税額を計算します。", "note": ""}, {"cat": "問2⑶・金銭債権の譲渡", "ctx": "課税事業者G社（機械製造業）は、取引先H社への商品販売に係る売掛金債権と、取引先I社への資金融通に係る貸付金債権を、内国法人J社に有償で譲渡した。", "q": "これらの債権の譲渡に消費税は課されるか。", "choices": ["課されない。いずれも有価証券に類するもの（金銭債権）の譲渡として非課税である", "売掛金債権の譲渡は課税、貸付金債権の譲渡は非課税である", "いずれも課税される。有償で譲渡しているからである", "いずれも不課税である。金銭債権は資産に当たらないからである"], "exp": "金銭債権の譲渡は、有価証券に類するものの譲渡として非課税です（法別表第二第二号、令9①四）。売掛金・貸付金のどちらも金銭債権です。債権者の事務所等の所在地が国内なので国内取引です（令6①）。", "note": ""}, {"cat": "問2⑶・課税売上割合の計算", "ctx": "課税事業者G社は、商品販売に係る売掛金債権（譲渡対価5,000,000円）と、資金融通に係る貸付金債権（譲渡対価3,000,000円）を有償で譲渡した。", "q": "課税売上割合の分母（資産の譲渡等の対価の額の合計額）への算入額として正しいものはどれか。", "choices": ["売掛金債権は算入しない（0円）、貸付金債権は譲渡対価の5％の150,000円を算入する", "いずれも譲渡対価の5％を算入する（250,000円と150,000円）", "いずれも譲渡対価の全額を算入する", "いずれも算入しない"], "exp": "資産の譲渡等の対価として取得した金銭債権（売掛金）の譲渡は、課税売上割合の計算上、資産の譲渡等の対価の額に含めません（令48②二）。それ以外の金銭債権（貸付金）の譲渡は、有価証券に類するものとして譲渡対価の額の5％相当額を分母に算入します（令48⑤）。3,000,000円×5％＝150,000円です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・資産の貸付けの内外判定", "ctx": "A社（6月末決算の内国法人、不動産貸付業、課税事業者、原則課税）は、令和5年4月1日に、国内に住所を有し事業を営んでいない給与所得者の個人Bから、B所有の国内の居住用家屋（戸建て）を24,200,000円で買う契約を結び、同年5月1日に引渡しを受けた。A社は同日、給与所得者の個人Cとの間で、この家屋を同年6月1日から1年間、居住用として月200,000円で貸す契約を結んだ（旅館業法の旅館業に係る施設の貸付けには当たらない）。", "q": "A社の個人Cに対する貸付けが国内取引になるかの判定基準として正しいものはどれか。", "choices": ["貸付けが行われる時におけるその資産の所在場所が国内にあるかどうかで判定し、国内取引になる", "貸主A社の本店所在地が国内にあるかどうかで判定する", "借主Cの住所が国内にあるかどうかで判定する", "賃貸借契約を結んだ場所が国内にあるかどうかで判定する"], "exp": "資産の譲渡又は貸付けの内外判定は、その譲渡又は貸付けが行われる時においてその資産が所在していた場所で行います（法4③一）。家屋は国内に所在するので国内取引です。", "note": ""}, {"cat": "問2⑶・金銭債権の内外判定", "ctx": "課税事業者G社（本店は国内）は、国内の取引先に対する売掛金債権を国内の内国法人J社に譲渡した。", "q": "金銭債権の譲渡の内外判定の基準として正しいものはどれか。", "choices": ["譲渡が行われる時における、その金銭債権に係る債権者の譲渡に係る事務所等の所在地で判定する", "その金銭債権に係る債務者の住所又は本店所在地で判定する", "譲受人J社の本店所在地で判定する", "金銭債権は所在場所がないので、常に国外取引とする"], "exp": "金銭債権の譲渡の内外判定は、その金銭債権に係る債権者の譲渡に係る事務所等の所在地で行います（法4③一、令6①）。G社の事務所は国内なので国内取引です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑵・持帰り販売", "ctx": "飲食店業を営むF社は、店内で飲食するハンバーガーを1個550円（税込）、同じものを持帰り用の包装をして540円（税込）で販売している。", "q": "それぞれの適用税率として正しいものはどれか。", "choices": ["店内飲食は食事の提供として標準税率、持帰り用の包装をした販売は飲食料品の譲渡として軽減税率", "どちらも飲食店業者が行うので食事の提供として標準税率", "どちらも飲食料品なので軽減税率", "店内飲食は軽減税率、持帰りは標準税率"], "exp": "食事の提供（テーブル等の設備のある場所で飲食させる役務の提供）は軽減税率の対象外ですが、持帰りのための容器に入れ又は包装を施して行う譲渡は食事の提供に含まれず、飲食料品の譲渡として軽減税率が適用されます（平成28年改正法附則34①一イ）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑵・高額特定資産の意義（自己建設）", "ctx": "課税事業者が、自ら建設した建物（調整対象固定資産）の取得を考える。", "q": "自己建設資産が高額特定資産に当たるかの判定として正しいものはどれか。", "choices": ["建設等に要した原材料費及び経費に係る課税仕入れ等の金額（税抜。免税事業者・簡易課税の課税期間中のものを除く）の累計額が1,000万円以上かどうかで判定する", "完成した建物の時価（税込）が1,000万円以上かどうかで判定する", "建設等に要した人件費を含む全ての費用の合計額が1,000万円以上かどうかで判定する", "1回の課税仕入れの金額が1,000万円以上のものがあるかどうかで判定する"], "exp": "自己建設資産は、その建設等に要した原材料費及び経費に係る課税仕入れ等の支払対価の額の110分の100相当額等（免税事業者又は簡易課税の課税期間中のものを除く）の累計額が1,000万円以上のものが高額特定資産です（令25の5①二）。給与は課税仕入れに当たらないので含みません。", "note": ""}]}, {"year": "R04", "label": "令和4年度（第72回）", "questions": [{"cat": "問1⑴・特定課税仕入れの意義", "ctx": "内国法人A社（課税事業者）は、国外事業者X社から事業者向け電気通信利用役務の提供（インターネット広告の配信）を受けた。", "q": "「特定課税仕入れ」の意義として正しいものはどれか。", "choices": ["課税仕入れのうち特定仕入れ（事業として他の者から受けた特定資産の譲渡等＝事業者向け電気通信利用役務の提供・特定役務の提供）に当たるもの", "国外事業者から受けたすべての役務の提供（消費者向け電気通信利用役務の提供を含む）", "国内事業者から受けた電気通信利用役務の提供のうち、対価が100万円以上のもの", "保税地域から引き取る課税貨物のうち、国外事業者から購入したもの"], "exp": "特定課税仕入れとは、課税仕入れのうち特定仕入れに該当するものをいいます（法5①、法4①）。特定仕入れは、事業として他の者から受けた特定資産の譲渡等（事業者向け電気通信利用役務の提供と特定役務の提供）です（法2①八の二〜八の五）。消費者向け電気通信利用役務の提供は特定資産の譲渡等に含まれません。", "note": ""}, {"cat": "問1⑴・課税仕入れの意義", "ctx": "事業者が事業として、従業員に給与を支払い、また外注先から役務の提供を受けた。", "q": "課税仕入れの意義に関する説明として正しいものはどれか。", "choices": ["他の者から資産を譲り受け・借り受け・役務の提供を受けることで、相手が事業として行えば課税資産の譲渡等（輸出免税等を除く）に当たるもの。給与等を対価とする役務の提供は除かれる", "他の者から資産を譲り受けることのうち、相手が課税事業者であるものに限られ、免税事業者からの仕入れは含まれない", "給与等を対価とする役務の提供も、事業のために受けるものなら課税仕入れに含まれる", "輸出免税の対象となる取引も、相手方にとって資産の譲渡等であれば課税仕入れに含まれる"], "exp": "課税仕入れとは、事業者が事業として他の者から資産を譲り受け、若しくは借り受け、又は役務の提供（所得税法上の給与等を対価とするものを除く）を受けることで、その他の者が事業として行ったとした場合に課税資産の譲渡等（輸出免税等を除く）に該当するものです（法2①十二）。相手が免税事業者や消費者でも課税仕入れに当たります。", "note": ""}, {"cat": "問1⑴・対価の返還等の意義", "ctx": "A社は、国外事業者から受けた特定課税仕入れ（事業者向け電気通信利用役務の提供）について、後日、値引きを受けて未払金の一部を減額された。", "q": "「特定課税仕入れに係る対価の返還等」の意義として正しいものはどれか。", "choices": ["値引き・割戻しによる、特定課税仕入れに係る支払対価の額の全部若しくは一部の返還、又は買掛金その他の債務の額の全部若しくは一部の減額", "値引き・割戻しによる支払対価の返還に限られ、未払金や買掛金の減額は含まれない", "特定課税仕入れに係る支払対価が貸倒れとなったこと", "特定課税仕入れに係る役務を、相手方に返品したことに限られる"], "exp": "特定課税仕入れに係る対価の返還等とは、特定課税仕入れにつき値引き又は割戻しを受けたことにより、その支払対価の額の全部若しくは一部の返還又は買掛金その他の債務の額の全部若しくは一部の減額を受けることをいいます（法38の2①）。債務の減額も含まれます。", "note": ""}, {"cat": "問1⑴・支払対価の額", "ctx": "A社は特定課税仕入れの対価として、金銭のほか物品も支払った。", "q": "「特定課税仕入れに係る支払対価の額」として正しいものはどれか。", "choices": ["対価として支払い、又は支払うべき一切の金銭又は金銭以外の物若しくは権利その他経済的な利益の額", "対価として実際に支払った金銭の額に限られる", "支払った金額に110分の100を乗じた税抜金額", "支払った金額に消費税相当額7.8％を加算した金額"], "exp": "特定課税仕入れに係る支払対価の額は、対価として支払い、又は支払うべき一切の金銭又は金銭以外の物若しくは権利その他経済的な利益の額です（法28②）。特定課税仕入れは受け手が納税するリバースチャージなので、支払額そのものが課税標準になり、110分の100を掛けて税抜きにすることはしません。", "note": ""}, {"cat": "問1⑴・返還等の控除の内容", "ctx": "課税事業者A社（原則課税）は、令和8年5月に受けた特定課税仕入れ（支払対価100万円）について、同年9月に20万円の値引きを受けた。A社の課税期間は4月〜3月。", "q": "この値引きの消費税額の控除の扱いとして正しいものはどれか。", "choices": ["値引きを受けた日の属する課税期間の課税標準額に対する消費税額から、20万円×7.8％＝15,600円を控除する", "値引きを受けた日の属する課税期間の課税標準額に対する消費税額から、20万円×7.8/110＝14,181円を控除する", "特定課税仕入れを行った日の属する課税期間に遡って、課税標準額を修正する", "仕入れに係る消費税額から15,600円を減額する（仕入控除税額の調整）"], "exp": "事業者（免税事業者を除く）が国内で行った特定課税仕入れにつき対価の返還等を受けた場合、その返還等を受けた日の属する課税期間の課税標準額に対する消費税額から、返還等を受けた金額に係る消費税額（返還等の金額×7.8％）の合計額を控除します（法38の2①）。特定課税仕入れは税込みの概念がないので、7.8/110ではなく7.8％を掛けます。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・返還等の控除の要件", "ctx": "A社は特定課税仕入れの値引きを受けたが、その金額の明細を記録した帳簿を保存していない。災害等のやむを得ない事情もない。", "q": "この場合の控除の適否として正しいものはどれか。", "choices": ["控除できない。返還等を受けた金額の明細を記録した帳簿の保存が要件で、保存がない部分には適用されない", "控除できる。特定課税仕入れは受け手が納税するので、帳簿の保存は要件ではない", "控除できる。相手方から発行された返還インボイスを保存していれば足りる", "控除できない。ただし、帳簿の保存に代えて相手方の証明書を提出すれば控除できる"], "exp": "特定課税仕入れに係る対価の返還等の控除は、その返還等を受けた金額の明細を記録した帳簿を保存しない場合には、保存がない部分の消費税額に適用されません。ただし、災害その他やむを得ない事情で保存できなかったことを証明した場合は、この限りではありません（法38の2②）。要件は帳簿の保存で、請求書等の保存は求められていません。", "note": ""}, {"cat": "問1⑴・相続があった場合", "ctx": "個人事業者の親が事業者向け電気通信利用役務の提供（特定課税仕入れ）を受けた後に死亡し、子が相続で事業を承継した。その後、子が親の行った特定課税仕入れについて値引きを受けた。", "q": "子の扱いとして正しいものはどれか。", "choices": ["子が行った特定課税仕入れにつき対価の返還等を受けたものとみなして、子の課税期間で控除の規定を適用する", "親の行った取引なので、親の準確定申告で控除しなければならない", "子は自ら特定課税仕入れを行っていないので、控除できない", "子の課税期間の仕入れに係る消費税額から控除する"], "exp": "相続により事業を承継した相続人が、被相続人が行った特定課税仕入れにつき対価の返還等を受けた場合は、相続人が行った特定課税仕入れにつき返還等を受けたものとみなして控除の規定（内容と帳簿保存要件）を適用します（法38の2③）。合併法人・分割承継法人も同様です（法38の2④）。", "note": ""}, {"cat": "問1⑴・合併・分割があった場合", "ctx": "B社は、吸収合併によりC社の事業を承継した。合併後、C社が合併前に行った特定課税仕入れについて、B社が割戻しを受けた。", "q": "B社の扱いとして正しいものはどれか。", "choices": ["B社が行った特定課税仕入れにつき対価の返還等を受けたものとみなして、控除の規定を適用する（相続の場合の規定を準用）", "被合併法人C社の最後事業年度の申告で控除する", "合併の場合は相続と異なり、承継した取引の返還等は控除できない", "分割の場合は準用されるが、合併の場合は準用されない"], "exp": "相続の場合の取扱いは、合併により事業を承継した合併法人と、分割により事業を承継した分割承継法人に準用されます（法38の2④）。合併法人が、被合併法人の行った特定課税仕入れの返還等を受けた場合は、合併法人が行ったものとみなして控除します。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑵・価格の表示の義務者と対象", "ctx": "次の事業者の価格の表示について考える。\n・課税事業者が、不特定多数の消費者に課税資産の譲渡等を行う\n・免税事業者が、不特定多数の消費者に課税資産の譲渡等を行う", "q": "消費税法上の「価格の表示」（総額表示）の義務として正しいものはどれか。", "choices": ["免税事業者を除く事業者が、不特定かつ多数の者に課税資産の譲渡等を行う場合に、あらかじめ価格を表示するときは、消費税額等を含めた価格を表示しなければならない", "免税事業者も含むすべての事業者が、価格を表示するときは消費税額等を含めた価格を表示しなければならない", "課税事業者は、取引の相手方が事業者でも消費者でも、すべての価格表示で消費税額等を含めた価格を表示しなければならない", "課税事業者は、税抜価格と消費税額を併記すれば、税込価格を表示しなくてよい"], "exp": "事業者（免税事業者を除く）は、不特定かつ多数の者に課税資産の譲渡等（特定資産の譲渡等と輸出免税等を除く）を行う場合（専ら他の事業者に課税資産の譲渡等を行う場合を除く）に、あらかじめ価格を表示するときは、その資産又は役務に係る消費税額及び地方消費税額の合計額に相当する額を含めた価格を表示しなければなりません（法63）。", "note": ""}, {"cat": "問1⑵・価格の表示の除外取引", "ctx": "課税事業者が行う次の取引について、価格の表示の規定の対象となるかを考える。", "q": "価格の表示の対象から除かれている取引の組合せとして正しいものはどれか。", "choices": ["特定資産の譲渡等、輸出免税等により消費税が免除されるもの、専ら他の事業者に課税資産の譲渡等を行う場合", "軽減税率が適用される飲食料品の譲渡と、新聞の譲渡", "1件あたりの税込価格が1万円未満のもの", "インターネットを通じて行う販売と、通信販売"], "exp": "価格の表示の対象となる取引からは、特定資産の譲渡等と輸出免税等により消費税が免除されるものが除かれ、専ら他の事業者に課税資産の譲渡等を行う場合も除かれます（法63）。軽減税率の対象品目や、ネット・通信販売も対象になります。", "note": ""}, {"cat": "問1⑵イ・スーパーのチラシ", "ctx": "スーパーマーケット（課税事業者）が、一般の消費者向けに配布するチラシに商品の価格を表示する。", "q": "このチラシの価格は価格の表示（総額表示）の対象となるか。", "choices": ["対象となる。不特定かつ多数の者に課税資産の譲渡等を行う場合に、あらかじめ価格を表示するものだから", "対象とならない。チラシは広告であり、店頭の値札だけが対象だから", "対象とならない。価格の表示の義務は、軽減税率の対象品目には適用されないから", "対象となるのは、チラシに表示された商品のうち標準税率の商品だけである"], "exp": "スーパーマーケットのチラシは、不特定かつ多数の者に対して、あらかじめ価格を表示するものなので、価格の表示の対象となります（法63）。値札だけでなく、チラシ・広告・カタログ等も含まれます。", "note": ""}, {"cat": "問1⑵ロ・業務用カタログ", "ctx": "卸売業者（課税事業者）が、小売店向けにだけ作成した業務用商品カタログに価格を表示する。", "q": "このカタログの価格は価格の表示の対象となるか。", "choices": ["対象とならない。専ら他の事業者に課税資産の譲渡等を行う場合（事業者間取引）は除かれているから", "対象となる。カタログは不特定多数の者が見る可能性があるから", "対象となる。卸売業者も課税事業者である以上、すべての価格表示が対象だから", "対象とならない。カタログは見積書と同じく契約書類の一種だから"], "exp": "価格の表示の規定は、専ら他の事業者に課税資産の譲渡等を行う場合を除いています（法63）。小売店向けの業務用カタログは事業者間取引のための価格表示なので、対象になりません。", "note": ""}, {"cat": "問1⑵ハ・見積書", "ctx": "課税事業者が、特定の顧客から依頼を受けて見積書を作成し、価格を表示した。", "q": "見積書の価格は価格の表示の対象となるか。", "choices": ["対象とならない。特定の者に対する表示で、不特定かつ多数の者にあらかじめ価格を表示するものではないから", "対象となる。見積書も取引の相手方に価格を示すものだから", "相手方が消費者なら対象となり、事業者なら対象とならない", "対象とならない。見積書は口頭で伝える価格と同じ扱いになるから"], "exp": "価格の表示の規定は、不特定かつ多数の者にあらかじめ価格を表示する場合が対象です（法63）。見積書・契約書・請求書等は特定の相手に示すものなので、対象になりません。", "note": ""}, {"cat": "問1⑵ニ・口頭で伝える価格", "ctx": "課税事業者の店員が、来店した客に商品の価格を口頭で伝えた。", "q": "口頭で伝える価格は価格の表示の対象となるか。", "choices": ["対象とならない。価格の表示はあらかじめ価格を表示する場合が対象で、口頭で伝える価格は表示に当たらないから", "対象となる。不特定多数の客に同じ価格を伝えているから", "対象となる。ただし、税抜価格を伝えた後に税込価格を伝えればよい", "対象とならない。店頭で販売する場合は、値札も含めて対象外だから"], "exp": "価格の表示の規定は、値札・チラシ・広告等で、あらかじめ価格を表示する場合が対象です（法63）。口頭で伝える価格は、あらかじめ価格を表示するものではないので対象になりません。", "note": ""}, {"cat": "問2⑴・国外での仕入れと販売", "ctx": "内国法人A社は、内国法人B社のインドネシア工場から商品を仕入れ、日本国内に持ち込まず、直接マレーシアの外国法人C社に納品している。A社は本店で仕入れ・売上げを計上している。", "q": "A社のC社への商品の販売の扱いとして正しいものはどれか。", "choices": ["譲渡の時に資産が国外に所在するので国外取引となり、課税対象外である", "A社の本店が国内にあるので国内取引となり、輸出免税の対象となる", "外国法人への販売なので非居住者への譲渡として輸出免税となる", "国内取引で課税資産の譲渡等となり、標準税率で課税される"], "exp": "資産の譲渡又は貸付けが国内で行われたかどうかは、その譲渡等が行われる時にその資産が所在していた場所で判定します（法4③一）。商品はマレーシアに納品され国内に持ち込まれていないので、国外取引として課税対象外です。本店の所在地や売上げの計上場所は関係ありません。", "note": ""}, {"cat": "問2⑴・船荷証券の譲渡", "ctx": "A社は、B社のインドネシア工場から託送中の商品について、国内でB社本店から船荷証券の譲渡を受け、代金を支払った。荷揚地は国内ではない。", "q": "A社のB社からの購入の扱いとして正しいものはどれか。", "choices": ["船荷証券の譲渡は、それに表彰されている貨物の譲渡として、譲渡の時に貨物が所在する場所（国外）で判定するので国外取引となり、課税仕入れに当たらない", "船荷証券は有価証券なので非課税取引となり、課税仕入れに当たらない", "国内で船荷証券の譲渡を受けて代金を支払ったので国内取引となり、課税仕入れに当たる", "B社の本店が国内にあるので国内取引となり、課税仕入れに当たる"], "exp": "船荷証券の譲渡は、その船荷証券に表彰されている貨物の譲渡なので、譲渡の時に貨物が現実に所在している場所で内外判定します（基通5-7-11）。貨物は国外にあるので国外取引で、B社にとって課税資産の譲渡等にならないため、A社の課税仕入れにも当たりません（荷揚地が国内の場合は、写しの保存を条件に国内取引とする取扱いがあります）。", "note": ""}, {"cat": "問2⑵・特許権の譲渡", "ctx": "A社が製造する部品の特許権は、アメリカとフランスの2国でのみ登録されている。A社（内国法人・本店は日本）は、アメリカの外国法人D社に対し、アメリカで登録された特許権を譲渡し、対価を受け取った。", "q": "この取引の扱いとして正しいものはどれか。", "choices": ["2以上の国で登録されているので、譲渡を行う者の住所地（日本）で判定して国内取引となり、非居住者への無形固定資産等の譲渡として輸出免税となる", "アメリカで登録された特許権の譲渡なので、登録機関の所在地で判定して国外取引となり、課税対象外である", "国内取引となり、特許権の譲渡は非課税取引である", "国内取引となり、外国法人への譲渡であっても標準税率で課税される"], "exp": "特許権等の内外判定は、権利の登録をした機関の所在地で行いますが、同一の権利について2以上の国で登録している場合は、譲渡又は貸付けを行う者の住所地で判定します（令6①五）。A社の本店は国内なので国内取引です。さらに、非居住者に対する無形固定資産等の譲渡なので輸出免税となります（法7①五、令17②六）。", "note": ""}, {"cat": "問2⑶・株式の譲渡", "ctx": "A社は、出資先の外国法人E社の株式を、国内の株式会社F社に譲渡した。E社は株券を発行しておらず、E社株式は振替機関等が取り扱うものではない。", "q": "この取引の扱いとして正しいものはどれか。", "choices": ["券面のない有価証券等なので、その法人（E社）の本店所在地で判定して国外取引となり、課税対象外である", "譲渡者A社の本店所在地で判定して国内取引となり、非課税取引（有価証券の譲渡）である", "譲受人F社が国内法人なので国内取引となり、非課税取引である", "株券が発行されていないので資産の譲渡に当たらず、課税の対象とならない"], "exp": "券面のない有価証券等（振替機関等が取り扱うものを除く）の内外判定は、その有価証券等に係る法人の本店又は主たる事務所の所在地で行います（令6①九ニ）。E社は外国法人なので国外取引となり、課税対象外です。", "note": ""}, {"cat": "問2⑷・外国法人への貸付金の利息", "ctx": "A社は、シンガポールの外国法人G社に現地通貨で金銭を貸し付け、利息をA社の本店で受取利息として計上している。", "q": "この利息の扱いとして正しいものはどれか。", "choices": ["貸付けを行う者の事務所の所在地（国内）で判定して国内取引となり非課税だが、債務者が非居住者なので非課税資産の輸出取引等となる", "債務者G社の所在地（シンガポール）で判定して国外取引となり、課税対象外である", "国内取引となり、外国法人に対する貸付けなので輸出免税の対象となる", "国内取引の非課税取引で、課税売上割合の計算上は分母にだけ含める"], "exp": "利子を対価とする金銭の貸付けの内外判定は、貸付けを行う者のその貸付けに係る事務所等の所在地で行います（令6③）。A社の本店は国内なので国内取引で、利子は非課税です（法6①、別表第二三）。ただし債務者が非居住者なので非課税資産の輸出取引等に当たり（令17③）、課税売上割合の計算上は分母・分子の両方に含めます。", "note": ""}, {"cat": "問2⑷・非課税資産の輸出の効果", "ctx": "A社は、非居住者G社に対する貸付金の利息（非課税資産の輸出取引等）について、輸出取引等に該当することを証明した。", "q": "この取引の仕入税額控除上の扱いとして正しいものはどれか。", "choices": ["課税資産の譲渡等に係る輸出取引等に該当するものとみなして、仕入れに係る消費税額の控除の規定を適用する", "非課税取引なので、この取引のための課税仕入れは仕入税額控除の対象とならない", "輸出免税と同じく、利息の額に0％の税率を掛けて課税標準額に含める", "課税売上割合の計算では分母だけに含め、分子には含めない"], "exp": "非課税資産の譲渡等のうち輸出取引等に該当するものについて、その証明がされたときは、課税資産の譲渡等に係る輸出取引等に該当するものとみなして仕入税額控除の規定を適用します（法31①）。課税売上割合の計算上も、その対価の額は分母・分子の両方に含めます（令51②）。", "note": ""}, {"cat": "問2⑸・電子書籍の配信の区分", "ctx": "A社は、アメリカの書籍販売業者H社から、インターネットを通じて事業者向けの専門誌（電子書籍）の配信を受けた。H社の電子書籍は、一般の消費者も購入できる形で販売されている。", "q": "この役務の提供の区分として正しいものはどれか。", "choices": ["役務の提供を受ける者が通常事業者に限られるものではないので、事業者向け電気通信利用役務の提供ではなく、消費者向け電気通信利用役務の提供となる", "A社が事業者で、内容も事業者向けの専門誌なので、事業者向け電気通信利用役務の提供となり、A社が納税義務者となる（リバースチャージ）", "電子書籍の配信は資産の譲渡なので、電気通信利用役務の提供に当たらない", "国外事業者からの配信なので国外取引となり、課税対象外である"], "exp": "事業者向け電気通信利用役務の提供は、その役務の性質又は取引条件等から、提供を受ける者が通常事業者に限られるものをいいます（法2①八の四）。電子書籍の配信は消費者も受けられるものなので、内容が事業者向けでも消費者向け電気通信利用役務の提供になります。なお、電気通信利用役務の提供は、提供を受ける者の住所等が国内にあれば国内取引です（法4③三）。", "note": ""}, {"cat": "問2⑸・仕入税額控除（現行法）", "ctx": "A社（課税事業者・原則課税）は、令和8年6月に、国外事業者H社から消費者向け電気通信利用役務の提供（電子書籍の配信）を受けた。H社は適格請求書発行事業者の登録を受けておらず、適格請求書は交付されていない。", "q": "A社の仕入税額控除の扱いとして正しいものはどれか。", "choices": ["控除できない。適格請求書等の保存がなく、国外事業者から受ける消費者向け電気通信利用役務の提供は、適格請求書発行事業者以外からの仕入れの経過措置（80％控除）の対象外である", "適格請求書発行事業者以外からの仕入れの経過措置により、仕入税額相当額の80％を控除できる", "帳簿の保存だけで、全額控除できる", "A社がリバースチャージで納税し、同額を全額控除できる"], "exp": "適格請求書等保存方式では、課税仕入れについて適格請求書等の保存がなければ仕入税額控除はできません（法30⑦）。適格請求書発行事業者以外の者からの課税仕入れには80％等の経過措置がありますが、国外事業者から受ける消費者向け電気通信利用役務の提供は、この経過措置の対象から除かれています。", "note": "※出題当時は、登録国外事業者制度があり、登録国外事業者以外から受けた消費者向け電気通信利用役務の提供は仕入税額控除ができないとされていました（H社は未登録のため控除不可）。令和5年10月1日に登録国外事業者制度が廃止され適格請求書等保存方式へ移行したため、現行法で解答しています（国外事業者が適格請求書発行事業者であれば、適格請求書等の保存により控除できます）。"}]}, {"year": "R03", "label": "令和3年度（第71回）", "questions": [{"cat": "問1⑴・調整の対象者", "ctx": "A社（3月決算、課税事業者）は令和8年5月に税抜2,000万円の機械装置（調整対象固定資産）を購入し、その課税期間は課税売上割合80％で一括比例配分方式により仕入控除税額を計算した。", "q": "課税売上割合が著しく変動した場合の調整の対象となるのはどの場合か。", "choices": ["比例配分法（個別対応方式の共通対応分か一括比例配分方式）で計算し、第3年度の課税期間の末日にその資産を有している課税事業者が、著しい変動に該当する場合", "全額控除・比例配分法のどちらで計算したかにかかわらず、第3年度の課税期間中に一度でもその資産を有していた事業者", "個別対応方式で課税資産の譲渡等にのみ要するものに区分して計算した場合に限り、第3年度の末日に有していれば対象になる", "第3年度の課税期間に免税事業者になっていても、資産を有していれば調整を行う"], "exp": "調整対象固定資産の課税仕入れ等の税額を比例配分法で計算した事業者（免税事業者を除く）が、第3年度の課税期間の末日にその資産を有しており、通算課税売上割合が著しく変動した場合に調整します（法33①）。比例配分法には、課税売上割合95％以上で全額控除された場合も含まれます。個別対応方式で「課税資産の譲渡等にのみ要するもの」に区分した場合は比例配分法に当たりません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・全額控除の扱い", "ctx": "B社は課税売上割合が96％の課税期間（課税売上高5億円以下）に調整対象固定資産を取得し、その税額を全額控除した。", "q": "この資産について、課税売上割合が著しく変動した場合の調整の規定は適用されるか。", "choices": ["適用される。全額控除された場合も比例配分法により計算した場合に含まれる", "適用されない。全額控除なので按分計算をしておらず、調整の対象外である", "適用されない。課税売上割合が95％以上の課税期間に取得した資産は対象外である", "適用される。ただし、調整税額の計算は通算課税売上割合ではなく第3年度の課税売上割合で行う"], "exp": "課税仕入れ等の税額の全額が控除された場合も、比例配分法により計算した場合に含まれます（法33①かっこ書）。この場合、調整税額の計算では「調整対象基準税額×仕入れ等の課税期間の課税売上割合」に代えて、調整対象基準税額の合計額を用います。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・第3年度の課税期間", "ctx": "C社（3月決算）は令和8年4月1日〜令和9年3月31日の課税期間に調整対象固定資産を購入し、比例配分法で仕入控除税額を計算した。", "q": "「第3年度の課税期間」はどれか。", "choices": ["令和10年4月1日〜令和11年3月31日の課税期間（仕入れ等の課税期間の開始の日から3年を経過する日の属する課税期間）", "令和9年4月1日〜令和10年3月31日の課税期間", "令和11年4月1日〜令和12年3月31日の課税期間（購入の日から3年を経過した日の翌日の属する課税期間）", "購入した課税期間を含めて3つ目の課税期間の翌課税期間"], "exp": "第3年度の課税期間とは、仕入れ等の課税期間の開始の日から3年を経過する日の属する課税期間をいいます（法33②）。令和8年4月1日から3年を経過する日は令和11年3月31日で、令和10年4月1日〜令和11年3月31日の課税期間に属します。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・著しい変動の判定", "ctx": "仕入れ等の課税期間の課税売上割合は40％、通算課税売上割合は70％だった。", "q": "「著しく増加した場合」に該当するか。", "choices": ["該当する。変動差30％が5％以上で、変動率75％（30％÷40％）が50％以上である", "該当しない。変動率は30％（70％−40％）で50％未満である", "該当しない。通算課税売上割合が95％未満なので調整の対象外である", "該当する。変動差が5％以上であれば変動率にかかわらず該当する"], "exp": "著しく増加した場合とは、①（通算課税売上割合−仕入れ等の課税期間の課税売上割合）÷仕入れ等の課税期間の課税売上割合が50％以上で、かつ②その差が5％以上の場合です（令53①）。(70−40)÷40＝75％、差30％なので両方を満たします。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・著しい変動の判定", "ctx": "仕入れ等の課税期間の課税売上割合は80％、通算課税売上割合は75％だった。", "q": "「著しく減少した場合」に該当するか。", "choices": ["該当しない。変動差は5％だが、変動率が6.25％（5％÷80％）で50％未満である", "該当する。変動差が5％以上である", "該当する。通算課税売上割合が仕入れ等の課税期間の課税売上割合を下回っている", "該当しない。変動差が5％を超えていない（5％ちょうどは該当しない）"], "exp": "著しく減少した場合は、変動率（差÷仕入れ等の課税期間の課税売上割合）が50％以上で、かつ変動差が5％以上の場合です（令53②）。差は5％で「5％以上」は満たしますが、変動率は5÷80＝6.25％で50％未満なので、該当しません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・調整税額", "ctx": "調整対象基準税額は156万円。仕入れ等の課税期間の課税売上割合は40％、通算課税売上割合は70％で、著しく増加した場合に該当する。", "q": "第3年度の課税期間における処理として正しいものはどれか。", "choices": ["156万円×70％−156万円×40％＝468,000円を、第3年度の課税期間の仕入れに係る消費税額に加算する", "468,000円を、第3年度の課税期間の仕入れに係る消費税額から控除する", "156万円×70％＝1,092,000円を、第3年度の課税期間の仕入れに係る消費税額に加算する", "468,000円を、仕入れ等の課税期間にさかのぼって修正申告する"], "exp": "著しく増加した場合は、「調整対象基準税額×通算課税売上割合」から「調整対象基準税額×仕入れ等の課税期間の課税売上割合」を控除した金額を、第3年度の課税期間の仕入れに係る消費税額に加算します（法33①一）。著しく減少した場合は逆に控除します（法33①二）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・控除しきれない場合", "ctx": "著しく減少した場合の調整税額が80万円、第3年度の課税期間の仕入れに係る消費税額（調整前）が50万円だった。", "q": "控除しきれない30万円の扱いとして正しいものはどれか。", "choices": ["課税資産の譲渡等に係る消費税額とみなして、第3年度の課税期間の課税標準額に対する消費税額に加算する", "切り捨てて、なかったものとする", "翌課税期間の仕入れに係る消費税額から控除する", "控除不足還付税額から差し引くだけで、課税標準額に対する消費税額には影響しない"], "exp": "著しく減少した場合の調整税額を控除して控除しきれない金額があるときは、その金額を課税資産の譲渡等に係る消費税額とみなして、第3年度の課税期間の課税標準額に対する消費税額に加算します（法33③）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・準ずる割合", "ctx": "D社は課税売上割合に準ずる割合の適用を受けて、調整対象固定資産の税額を個別対応方式の共通対応分として計算した。", "q": "課税売上割合の著しい変動の判定・調整に用いる割合はどれか。", "choices": ["課税売上割合に準ずる割合（仕入れ等の課税期間・通算とも、準ずる割合の適用がある場合はその割合）", "準ずる割合の適用を受けていても、常に本来の課税売上割合", "仕入れ等の課税期間は準ずる割合、通算は本来の課税売上割合", "準ずる割合の適用を受けた資産は、調整の対象外"], "exp": "準ずる割合の適用を受けている場合は、課税売上割合の著しい変動の調整においても、その準ずる割合を用います（法33①）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑵・申告期限の延長", "ctx": "E社（3月決算、内国法人）は法人税の確定申告書の提出期限の延長の特例の適用を受けている。令和9年3月期について、消費税の申告期限を延長したい。", "q": "消費税法45条の2の特例の内容として正しいものはどれか。", "choices": ["延長する旨の届出書を提出した場合、その提出日の属する事業年度以後の各事業年度終了の日の属する課税期間の確定申告書の提出期限を、課税期間の末日の翌日から3月以内とする", "届出書の提出は不要で、法人税の延長特例を受けていれば自動的に消費税の期限も2月延長される", "延長する旨の届出書を提出した場合、提出期限を課税期間の末日の翌日から4月以内とする", "延長の対象は中間申告書の提出期限であり、確定申告書は2月以内のまま変わらない"], "exp": "法人税の申告期限の延長特例の適用を受ける法人が、消費税申告期限延長届出書を所轄税務署長に提出した場合、その提出日の属する事業年度以後の各事業年度終了の日の属する課税期間の確定申告書の提出期限は、課税期間の末日の翌日から3月以内となります（法45の2①）。原則の2月以内が1月延長されます。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑵・対象法人", "ctx": "消費税の確定申告書の提出期限の延長特例（法45の2）を受けられる事業者の範囲を考える。", "q": "この特例の対象となる法人はどれか。", "choices": ["法人税法の確定申告書の提出期限の延長の特例の適用を受ける法人", "資本金1億円超の法人であれば、法人税の延長特例の有無にかかわらず対象", "e-Taxで申告する法人であれば、すべて対象", "個人事業者も含め、届出書を出したすべての事業者"], "exp": "対象は、消費税の確定申告書を提出すべき法人のうち、法人税法の確定申告書の提出期限の延長の特例の規定の適用を受ける法人に限られます（法45の2①）。個人事業者は対象外です。", "note": ""}, {"cat": "問1⑶・e-Taxの義務", "ctx": "F社（3月決算の内国法人）は、事業年度開始の時の資本金の額が1億5,000万円で、課税事業者である。", "q": "F社の消費税の申告方法について正しいものはどれか。", "choices": ["特定法人に当たるので、確定申告書等の記載事項を電子情報処理組織（e-Tax）を使用する方法により提供して申告しなければならない", "資本金1億円超なので、e-Taxと書面のどちらで申告してもよい", "e-Taxが義務になるのは資本金10億円超の法人だけなので、書面で申告できる", "e-Taxが義務になるのは課税売上高5億円超の法人だけである"], "exp": "特定法人（事業年度開始の時の資本金の額又は出資金の額が1億円を超える内国法人等）である事業者（免税事業者を除く）は、納税申告書等により行う申告を、e-Taxを使用して行わなければなりません（法46の2①②）。", "note": ""}, {"cat": "問1⑶・特定法人の範囲", "ctx": "次のいずれも課税事業者である。①資本金5,000万円の相互会社　②資本金5,000万円の投資法人　③国　④資本金1億円ちょうどの株式会社", "q": "特定法人に当たらないものはどれか。", "choices": ["④の資本金1億円ちょうどの株式会社（1億円を「超える」法人ではない）", "①の相互会社（資本金1億円以下だから）", "②の投資法人（資本金1億円以下だから）", "③の国（国は消費税の申告義務がないから）"], "exp": "特定法人は、①事業年度開始の時の資本金の額等が1億円を超える法人、②相互会社、③投資法人、④特定目的会社、⑤国又は地方公共団体です（法46の2②）。相互会社・投資法人・特定目的会社・国等は資本金の額にかかわらず当たります。1億円ちょうどの株式会社は「超える」に当たりません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・対象となる申告書", "ctx": "特定法人であるG社（課税事業者）が提出する消費税の申告書を考える。", "q": "e-Taxによる申告の特例の対象となる申告書の組合せとして正しいものはどれか。", "choices": ["確定申告書、中間申告書、仮決算の中間申告書、修正申告書及び還付申告書", "確定申告書のみ", "確定申告書と修正申告書のみ（中間申告書は書面でよい）", "還付申告書のみ（納付の申告書は書面でよい）"], "exp": "対象となる「納税申告書等」には、確定申告書、中間申告書（仮決算によるものを含む）、修正申告書、還付申告書が含まれ、これらに添付すべき書類もe-Taxで提供します（法46の2①）。対象は課税資産の譲渡等（特定資産の譲渡等に該当するものを除く）及び特定課税仕入れに対する消費税の申告です。", "note": ""}, {"cat": "問1⑶・関係法令の適用", "ctx": "特定法人であるG社が、確定申告書の記載事項をe-Taxで提供した。", "q": "この申告の法令上の扱いとして正しいものはどれか。", "choices": ["申告書記載事項が記載された納税申告書により行われたものとみなして、消費税法等の規定が適用される", "書面の申告書を改めて提出しなければ、申告があったものとはみなされない", "e-Taxによる提供は申告の予告にすぎず、正式な申告は書面で行う", "e-Taxによる申告は添付書類が不要とみなされる"], "exp": "e-Taxにより行われた申告は、申告書記載事項が記載された納税申告書等により行われたものとみなして、消費税法等の規定を適用します（法46の2③）。添付書類も記載事項をe-Taxで提供します。", "note": ""}, {"cat": "問2⑴・特定役務の提供", "ctx": "プロスポーツチームを運営する法人Aは、非居住者である個人事業者Xを監督として招き、競技指導を受けて対価を支払った。Aはこれを特定役務の提供（特定課税仕入れ）として処理している。", "q": "Aの処理の正誤と理由として正しいものはどれか。", "choices": ["誤り。特定役務の提供は国外事業者が行う映画・演劇の俳優、音楽家その他の芸能人又は職業運動家の役務の提供なので、監督の競技指導は当たらない", "正しい。国外事業者が他の事業者に対して行う役務の提供は、すべて特定役務の提供に当たる", "正しい。スポーツに関する役務の提供なので、職業運動家の役務の提供に当たる", "誤り。非居住者である個人は事業者に当たらないので、消費税の課税対象外である"], "exp": "特定役務の提供とは、資産の譲渡等のうち国外事業者が行う演劇その他の一定の役務の提供（電気通信利用役務の提供を除く）で、映画・演劇の俳優、音楽家その他の芸能人又は職業運動家の役務の提供を主な内容とする事業として行うもののうち、国外事業者が他の事業者に対して行うもの（不特定かつ多数の者に対するものを除く）をいいます（法2①八の五、令2の2）。監督は職業運動家に当たらず、特定役務の提供ではありません。", "note": ""}, {"cat": "問2⑴・特定役務の範囲", "ctx": "国外事業者が国内の事業者に対して、次の役務の提供を行った。", "q": "特定役務の提供に当たるものはどれか。", "choices": ["国外のプロ野球選手が、国内の球団（事業者）との契約で試合に出場する役務の提供", "国外の監督が、国内のプロチームに対して競技指導を行う役務の提供", "国外の歌手が、国内の不特定多数の観客に対して直接チケットを販売して行う公演", "国外事業者がインターネットで国内の事業者に配信する音楽の提供"], "exp": "特定役務の提供は、国外事業者が他の事業者に対して行う芸能人・職業運動家の役務の提供です（令2の2）。監督は職業運動家ではなく、不特定多数の者に対するものは除かれ、電気通信利用役務の提供も除かれます。", "note": ""}, {"cat": "問2⑵・社会福祉事業", "ctx": "社会福祉法人Bは、社会福祉法に規定する授産施設を経営する事業において、生産活動としての作業に基づいて作製された物品を販売した。Bはこの対価を課税資産の譲渡等の対価として処理している。", "q": "Bの処理の正誤と理由として正しいものはどれか。", "choices": ["正しい。社会福祉事業として行われる資産の譲渡等は非課税だが、生産活動としての作業に基づき行われるものは除かれているので課税となる", "誤り。社会福祉法人が社会福祉事業として行う資産の譲渡等は、すべて非課税である", "誤り。社会福祉法人は公益法人なので、消費税の課税対象外である", "正しい。授産施設の事業は社会福祉事業に当たらないので課税となる"], "exp": "社会福祉事業及び更生保護事業として行われる資産の譲渡等は非課税ですが、授産施設等における生産活動としての作業に基づき行われるものは除かれています（法6①、別表第二）。そのため、作製した物品の販売は課税資産の譲渡等に当たります。", "note": ""}, {"cat": "問2⑶・国外資産の譲渡のための課税仕入れ", "ctx": "不動産業を営む法人Cは、国外に所有する土地の売却のために、国内の弁護士Yに国内で行ったコンサルティングの手数料を支払った。Cは個別対応方式を適用しており、この手数料を「課税資産の譲渡等以外の資産の譲渡等にのみ要するもの」に区分している。", "q": "Cの区分の正誤と理由として正しいものはどれか。", "choices": ["誤り。国外で行う資産の譲渡等は非課税の規定により課税されないものではないので課税資産の譲渡等に当たり、そのための課税仕入れは課税資産の譲渡等にのみ要するものになる", "正しい。土地の譲渡は非課税なので、そのための手数料はその他の資産の譲渡等にのみ要するものになる", "誤り。国外の土地の譲渡は不課税なので、共通対応分に区分しなければならない", "正しい。国外の取引は課税対象外なので、そのための課税仕入れは仕入税額控除の対象にならない"], "exp": "課税資産の譲渡等とは、資産の譲渡等のうち国内取引の非課税の規定により消費税を課さないこととされるもの以外のものをいいます（法2①九）。国外で行う土地の譲渡は国内取引の非課税に当たらないので課税資産の譲渡等に該当し、そのための課税仕入れは個別対応方式で「課税資産の譲渡等にのみ要するもの」に区分します。", "note": ""}, {"cat": "問2⑷・簡易課税の事業区分", "ctx": "デパートにテナントを出店している法人D（簡易課税）は、消化仕入れの方式による商品売買契約をデパートと結んでいる。Dは他の者から仕入れた商品をそのまま販売しており、テナントでの売上げを第二種事業（小売業）と判定している。", "q": "Dの判定の正誤と理由として正しいものはどれか。", "choices": ["誤り。消化仕入れの方式ではテナントからデパートへの販売となり、他の事業者に対して性質・形状を変更せずに販売する卸売業（第一種事業）に当たる", "正しい。店頭で一般消費者に販売しているので小売業（第二種事業）に当たる", "誤り。支払手数料を差し引いているので、サービス業（第五種事業）に当たる", "正しい。デパートの売上げとして認識されるので、D自身の事業区分は売上げの相手方に関係なく小売業になる"], "exp": "卸売業とは、他の者から購入した商品をその性質及び形状を変更しないで他の事業者に対して販売する事業をいいます（令57⑥一）。消化仕入れの方式では、テナントの売上げはテナントがデパートに対して行う販売となるので、卸売業（第一種事業）に当たります。", "note": ""}, {"cat": "問2⑷・簡易課税の事業区分", "ctx": "問題の法人Dのテナント売上げの事業区分を確認する。", "q": "Dのテナント売上げに適用するみなし仕入率はどれか。", "choices": ["90％（第一種事業）", "80％（第二種事業）", "70％（第三種事業）", "50％（第五種事業）"], "exp": "消化仕入れの方式によるテナントからデパートへの販売は卸売業（第一種事業）に当たり、みなし仕入率は90％です（法37①、令57①）。第二種事業（小売業）は80％です。", "note": ""}]}, {"year": "R02", "label": "令和2年度（第70回）", "questions": [{"cat": "問1⑴・請求書等の記載事項", "ctx": "課税事業者A社は、課税事業者B社（適格請求書発行事業者）から事務用品（標準税率）を購入した。A社は仕入税額控除を受けるため、B社から受け取った書類を保存する。購入日は令和8年5月。", "q": "B社がA社に交付する適格請求書の記載事項として正しいものはどれか。", "choices": ["B社の氏名又は名称と登録番号、取引年月日、取引内容（軽減税率対象ならその旨）、税率ごとに区分した対価の額の合計額と適用税率、税率ごとの消費税額等、A社の氏名又は名称", "B社の氏名又は名称、取引年月日、取引内容、税込の対価の額、A社の氏名又は名称（登録番号と消費税額等は不要）", "B社の登録番号と税込の対価の額だけを書けばよく、取引内容やA社の氏名は不要", "A社の登録番号、取引年月日、取引内容、税抜の対価の額（B社の登録番号は不要）"], "exp": "現行法では、仕入税額控除のために保存する請求書等は原則として適格請求書です。適格請求書の記載事項は、①交付する事業者の氏名又は名称と登録番号、②取引年月日、③取引内容（軽減対象資産ならその旨）、④税率ごとに区分した対価の額（税抜又は税込）の合計額と適用税率、⑤税率ごとの消費税額等、⑥交付を受ける事業者の氏名又は名称です（法57の4①）。", "note": "※出題当時は区分記載請求書等保存方式で、作成者の氏名又は名称・年月日・内容・税率ごとに合計した税込の対価の額・交付を受ける者の氏名又は名称が記載事項でした。令和5年10月から適格請求書等保存方式になり、登録番号・適用税率・消費税額等が加わったため、現行法で解答しています。【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・不特定多数への販売", "ctx": "課税事業者C社は、小売店（不特定多数の者に販売する事業）でボールペンを購入し、レシートを受け取った。小売店は適格請求書発行事業者である。", "q": "このレシート（適格簡易請求書）の記載事項について正しいものはどれか。", "choices": ["交付を受ける事業者（C社）の氏名又は名称の記載は不要で、適用税率又は消費税額等はどちらか一方を書けばよい", "C社の氏名又は名称を必ず書かなければ、仕入税額控除は受けられない", "小売店のレシートには登録番号の記載は不要である", "不特定多数への販売なので、取引年月日の記載も不要である"], "exp": "小売業・飲食店業など不特定かつ多数の者に資産の譲渡等を行う事業では、適格請求書に代えて適格簡易請求書を交付できます。適格簡易請求書では交付を受ける者の氏名又は名称を省略でき、適用税率と消費税額等はいずれか一方の記載でよいとされています（法57の4②）。登録番号と取引年月日は必要です。", "note": "※出題当時（区分記載請求書等保存方式）も、小売業等では交付を受ける者の氏名又は名称の記載が不要でした。現行法の適格簡易請求書で解答しています。【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・保存が要件とされる書類", "ctx": "課税事業者D社（適格請求書発行事業者ではない取引先からの仕入れはない）は、令和8年6月に国内で課税仕入れを行った。", "q": "仕入税額控除を受けるための保存要件として正しいものはどれか。", "choices": ["課税仕入れ等に関する事項を記載した帳簿と請求書等（適格請求書等）の両方を保存しなければならない", "帳簿か請求書等のどちらか一方を保存すれば足りる", "請求書等を保存していれば、帳簿の保存は不要である", "課税仕入れの支払対価の額が3万円以上の場合に限り、帳簿と請求書等の保存が必要である"], "exp": "仕入税額控除は、事業者がその課税期間の課税仕入れ等の税額の控除に係る帳簿及び請求書等を保存しない場合には、その保存がない課税仕入れ等の税額については適用されません（法30⑦）。原則として帳簿と請求書等の両方の保存が必要です。", "note": "※出題当時は、支払対価の額の合計額が3万円未満の場合などに請求書等の保存を不要とする特例がありましたが、適格請求書等保存方式では廃止され、公共交通機関の運賃など特定の取引に限って帳簿のみの保存が認められています。また、基準期間の課税売上高が1億円以下等の事業者は、令和11年9月30日までの課税仕入れのうち税込1万円未満のものについて帳簿のみの保存で足りる経過措置（少額特例）があります。【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴・保存期間", "ctx": "課税事業者E社（3月決算）は、令和8年4月1日から令和9年3月31日までの課税期間に行った課税仕入れについて、帳簿と請求書等を保存している。", "q": "これらの帳簿・請求書等の保存期間として正しいものはどれか。", "choices": ["課税期間の末日の翌日から2月を経過した日（令和9年6月1日）から7年間", "課税仕入れを行った日から7年間", "課税期間の末日（令和9年3月31日）から5年間", "確定申告書を提出した日から10年間"], "exp": "帳簿・請求書等は、その課税仕入れの日の属する課税期間の末日の翌日から2月を経過した日から7年間、納税地等に保存しなければなりません（令50①）。なお、5年を経過した日以後の期間は一定の方法（電子データ等）による保存もできます。令和9年3月31日の翌日（4月1日）から2月を経過した日は6月1日です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・金又は白金の地金", "ctx": "課税事業者F社は、令和8年7月に個人Gから金地金を購入した（課税仕入れ）。F社は取引の帳簿と請求書等を保存しているが、Gの住民票の写しなどの本人確認書類は保存していない。災害等のやむを得ない事情はない。", "q": "この金地金の購入に係る仕入税額控除について正しいものはどれか。", "choices": ["控除できない。金又は白金の地金の課税仕入れは、相手方の本人確認書類を保存しないと仕入税額控除が適用されない", "帳簿と請求書等を保存しているので、控除できる", "金地金は非課税取引なので、そもそも仕入税額控除の対象にならない", "控除できる。本人確認書類の保存は、相手方が法人の場合だけに求められる"], "exp": "仕入税額控除は、課税仕入れに係る資産が金又は白金の地金である場合に、相手方の本人確認書類（住民票の写しその他一定のもの）を保存しないときは、その保存がない課税仕入れについて適用されません（法30⑪）。災害その他やむを得ない事情で保存できなかったことを証明した場合は除かれます。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・金又は白金の地金", "ctx": "課税事業者F社は金地金を購入したが、地震により事務所が損壊し、相手方の本人確認書類を保存できなくなった。F社はそのことを証明した。", "q": "この場合の仕入税額控除の取扱いとして正しいものはどれか。", "choices": ["災害その他やむを得ない事情で保存できなかったことを証明したので、本人確認書類の保存がなくても控除は否認されない", "事情にかかわらず、本人確認書類の保存がなければ控除できない", "税務署長の承認を受けた場合に限り控除できる", "金地金の購入は、災害があった課税期間だけ非課税になる"], "exp": "金又は白金の地金の本人確認書類の保存要件には、災害その他やむを得ない事情によりその保存をすることができなかったことを事業者が証明した場合は、この限りでないとするただし書があります（法30⑪ただし書）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・密輸品", "ctx": "課税事業者H社は、国内の業者から商品を購入した（課税仕入れ）。この商品は、輸入の際に納付すべき消費税を納付しないで保税地域から引き取られたもの（密輸品）だった。H社は帳簿と請求書等を保存している。", "q": "この課税仕入れに係る仕入税額控除について正しいものはどれか。", "choices": ["H社が消費税の未納付を知っていた場合に限り、控除できない", "H社が知っていたかどうかにかかわらず、控除できない", "帳簿と請求書等を保存しているので、どの場合でも控除できる", "保税地域から引き取った者が後で消費税を納付すれば、H社は知っていても控除できる"], "exp": "課税仕入れの際に、その資産が納付すべき消費税を納付しないで保税地域から引き取られた課税貨物に係るものである場合（その課税仕入れを行う事業者が、消費税が納付されていないことを知っていた場合に限る）は、その課税仕入れについて仕入税額控除は適用されません（法30⑫）。知らなかった場合は対象外です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・居住用賃貸建物", "ctx": "課税事業者I社は、令和8年8月に、住宅の貸付けの用に供しないことが明らかな建物以外の建物で、税抜価額が1,500万円の賃貸マンション（居住用賃貸建物）を購入した。帳簿と請求書等は保存している。", "q": "この建物の購入に係る仕入税額控除について正しいものはどれか。", "choices": ["居住用賃貸建物（税抜1,000万円以上の高額特定資産等）の課税仕入れなので、仕入税額控除は適用されない", "帳簿と請求書等を保存しているので、全額控除できる", "個別対応方式なら共通対応分として控除できる", "課税売上割合が95%以上であれば控除できる"], "exp": "住宅の貸付けの用に供しないことが明らかな建物以外の建物で、高額特定資産又は調整対象自己建設高額資産に当たるもの（居住用賃貸建物）の課税仕入れ等には、仕入税額控除は適用されません（法30⑩）。帳簿・請求書等を保存していても控除できない場合の一つです。", "note": "※この規定は令和2年10月1日以後の課税仕入れ等から適用されています（令和2年度改正）。出題当時（令和2年4月現在の法令）の答案では問われていませんが、現行法では帳簿等を保存していても控除できない場合に当たります。【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑶・控除できない場合の区別", "ctx": "課税事業者は、いずれも帳簿と請求書等を保存している次の課税仕入れを行った。\n・ア：個人から購入した金地金（本人確認書類なし、やむを得ない事情なし）\n・イ：密輸品と知らずに購入した商品\n・ウ：国内の事業者から購入した事務用機器", "q": "仕入税額控除が適用されないものはどれか。", "choices": ["アだけ", "アとイ", "イだけ", "ア・イ・ウのすべて"], "exp": "アは本人確認書類の保存がないので控除できません（法30⑪）。イの密輸品の規定は、未納付を知っていた場合に限るので、知らなかったイには適用されません（法30⑫）。ウは通常どおり控除できます。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑴・課税対象の判定", "ctx": "課税事業者Aは、法人Xとの間で中古建物の売買契約を結び、当課税期間に譲渡対価を受け取って建物を引き渡した。建物は国内にある。", "q": "この中古建物の譲渡の取扱いとして正しいものはどれか。", "choices": ["国内で事業として対価を得て行う資産の譲渡で、非課税とされるものに当たらないので、課税資産の譲渡等（7.8%課税取引）になる", "中古品の譲渡なので、課税の対象外（不課税）になる", "土地と同じく不動産なので、非課税取引になる", "相手が法人なので、特定資産の譲渡等としてXが納税する"], "exp": "国内において事業者が行った資産の譲渡等には消費税が課されます（法4①）。資産の譲渡等とは事業として対価を得て行われる資産の譲渡・貸付け・役務の提供で（法2①八）、非課税とされるのは土地の譲渡等であり建物の譲渡は含まれません（法6①、別表第二）。したがって建物の譲渡は課税資産の譲渡等です。", "note": ""}, {"cat": "問2⑴・固定資産税の未経過分", "ctx": "課税事業者Aは中古建物をXに売却した。売買契約で、建物に係る固定資産税の未経過分に相当する金額は買主Xが負担することとし、Aは建物の譲渡対価とは別に、その未経過相当額を受け取った。", "q": "Aが受け取った固定資産税の未経過相当額の取扱いとして正しいものはどれか。", "choices": ["建物の譲渡対価の一部を構成するので、譲渡対価と合わせて課税標準額に含める", "租税の精算金なので、課税の対象外（不課税）として課税標準に含めない", "非課税売上高として課税売上割合の分母に含める", "Xが固定資産税を負担したものとして、Aの仕入税額控除の対象になる"], "exp": "固定資産税の課税対象となる資産の譲渡に伴い、未経過分に相当する金額を譲渡代金とは別に受け取っている場合でも、その金額はその資産の譲渡の金額に含まれます（基通10-1-6）。そのため建物の譲渡対価と合わせて課税標準額に含めます。", "note": ""}, {"cat": "問2⑴・対価の額の意義", "ctx": "課税資産の譲渡等に係る消費税の課税標準となる「対価の額」の意味を考える。", "q": "「対価の額」の意義として正しいものはどれか。", "choices": ["対価として収受し、又は収受すべき一切の金銭又は金銭以外の物若しくは権利その他経済的な利益の額で、課されるべき消費税額と地方消費税額を含まないもの", "実際に収受した金銭の額だけで、消費税額と地方消費税額を含むもの", "対価として収受すべき金銭の額だけで、物や権利で受け取った分は含まないもの", "その資産の時価で、消費税額と地方消費税額を含まないもの"], "exp": "課税資産の譲渡等に係る消費税の課税標準は、課税資産の譲渡等の対価の額です。対価の額は、対価として収受し、又は収受すべき一切の金銭又は金銭以外の物若しくは権利その他経済的な利益の額とし、課されるべき消費税額と地方消費税額に相当する額を含みません（法28①）。収受「すべき」額なので、未収分も含みます。", "note": ""}, {"cat": "問2⑴・金銭以外の物等の額", "ctx": "課税事業者が課税資産を譲渡し、対価の一部を金銭ではなく他の物（車両）で受け取った。", "q": "金銭以外の物で受け取った部分の対価の額はどう計算するか。", "choices": ["その物を取得する時における価額（時価）", "相手方がその物を取得した時の取得価額", "譲渡した課税資産の帳簿価額", "金銭以外の物は対価の額に含めない"], "exp": "対価の額に含まれる金銭以外の物若しくは権利その他経済的な利益の額は、その物若しくは権利を取得し、又はその利益を享受する時における価額とされます（令45①）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑵・一体資産の意義", "ctx": "課税事業者Bは、紅茶とティーカップを仕入れ、あらかじめパッケージングしてセット商品とし、セットの価格だけを表示して販売しようとしている。", "q": "このセット商品が「一体資産」に当たる理由として正しいものはどれか。", "choices": ["食品と食品以外の資産があらかじめ一の資産を形成・構成しており、その一の資産の価格のみが提示されているから", "食品が含まれていれば、価格の表示方法にかかわらず一体資産になるから", "紅茶とティーカップの価格をそれぞれ表示しているから", "販売価格が1万円以下だから"], "exp": "一体資産とは、食品と食品以外の資産があらかじめ一の資産を形成し、又は構成しているもの（その一の資産に係る価格のみが提示されているものに限る）をいいます（平成28年改正法附則34①一、平成28年改正令附則2一）。1万円以下という金額要件は、一体資産のうち軽減税率が適用されるものの要件です。", "note": ""}, {"cat": "問2⑵・一体資産の適用税率", "ctx": "課税事業者Bは、紅茶とティーカップのセット商品（一体資産）を税抜価額10,000円で販売する。仕入価格は紅茶5,480円（税込）、ティーカップ2,480円（税込）。", "q": "このセット商品の販売に適用される消費税率（国税）はどれか。", "choices": ["6.24%（税抜対価が1万円以下で、食品の割合が5,480÷7,960＝約68.8%と3分の2以上なので、全体が軽減税率の対象）", "7.8%（一体資産は原則として標準税率で、例外は税込1万円以下の場合だけ）", "紅茶部分は6.24%、ティーカップ部分は7.8%に分けて計算する", "7.8%（食品の割合が75%未満なので軽減税率の対象にならない）"], "exp": "一体資産の譲渡は原則として軽減税率の対象外ですが、①一体資産の譲渡の対価の額（税抜）が1万円以下で、②その一体資産の価額のうち食品に係る部分の割合として合理的な方法で計算した割合が3分の2以上のものは、全体が飲食料品の譲渡として軽減税率6.24%が適用されます（平成28年改正令附則2一）。税抜10,000円≦10,000円、5,480÷(5,480＋2,480)＝0.6884…≧2/3 なので両方を満たします。", "note": ""}, {"cat": "問2⑵・一体資産の金額基準", "ctx": "課税事業者Bは、紅茶とティーカップのセット商品（一体資産、食品部分の割合は約68.8%）の価格を税抜11,000円に変更した。", "q": "変更後のセット商品の適用税率（国税）はどれか。", "choices": ["7.8%（税抜対価が1万円を超えるので、軽減税率の要件を満たさない）", "6.24%（食品の割合が3分の2以上なので、金額にかかわらず軽減税率）", "6.24%（税込で判定すると1万円を超えないので軽減税率）", "紅茶部分は6.24%、ティーカップ部分は7.8%に分けて計算する"], "exp": "一体資産に軽減税率が適用されるのは、税抜対価の額が1万円以下で、かつ食品部分の割合が3分の2以上の場合だけです（平成28年改正令附則2一）。税抜11,000円は1万円を超えるので、食品割合の要件を満たしていても全体に標準税率7.8%が適用されます。", "note": "【資料の補足】本試験の問題文には税抜10,000円の設例しかないため、金額基準を確かめるための設例を補っています。"}, {"cat": "問2⑵・飲食料品の意義", "ctx": "軽減税率の対象となる「飲食料品」の範囲を考える。", "q": "「飲食料品」の意義として正しいものはどれか。", "choices": ["食品表示法に規定する食品（酒税法に規定する酒類を除く）をいい、一定の一体資産を含む", "人の飲用又は食用に供されるもので、酒類も含む", "食品衛生法に規定する食品と添加物をいい、一体資産は含まない", "店内飲食や出張料理（ケータリング）も含む、食品に関する取引すべて"], "exp": "飲食料品とは、食品表示法に規定する食品（酒税法に規定する酒類を除く）をいい、食品と食品以外の資産が一体となっている資産でその一体資産の価格のみが提示されているもののうち一定のものを含みます（平成28年改正法附則34①一）。外食やケータリングは軽減税率の対象外です。", "note": ""}, {"cat": "問2⑶・食用の米の税率", "ctx": "課税事業者Cは米を生産して販売する農家で、簡易課税制度を適用して申告している。米は食用として販売するほか、一部は飼料用としても販売している。", "q": "Cの米の販売に適用される消費税率（国税）として正しいものはどれか。", "choices": ["食用の米は飲食料品なので6.24%、飼料用の米は飲食料品に当たらないので7.8%", "どちらも米なので、すべて6.24%", "どちらも農産物なので、すべて7.8%", "食用の米は7.8%、飼料用の米は6.24%"], "exp": "軽減税率の対象は、人の飲用又は食用に供される食品表示法上の食品（飲食料品）です（平成28年改正法附則34①一）。食用の米は飲食料品として6.24%、飼料用の米は人の食用ではないので標準税率7.8%です。", "note": ""}, {"cat": "問2⑶・農業の事業区分", "ctx": "簡易課税制度を適用している農家Cは、自ら生産した米を、食用と飼料用の両方で販売している。", "q": "簡易課税制度における事業区分とみなし仕入率として正しいものはどれか。", "choices": ["食用の米の販売は第二種事業（80%）、飼料用の米の販売は第三種事業（70%）", "どちらも農業なので第三種事業（70%）", "食用の米の販売は第一種事業（90%）、飼料用の米の販売は第三種事業（70%）", "どちらも自ら生産した物の販売なので第四種事業（60%）"], "exp": "農業・林業・漁業は原則として第三種事業（みなし仕入率70%）ですが、そのうち飲食料品の譲渡を行う部分は第二種事業（80%）とされます（令57⑤二・三）。したがって食用の米は第二種事業、飼料用の米は第三種事業です。", "note": "※農業等のうち飲食料品の譲渡に係る部分を第二種事業とする規定は、軽減税率制度の導入に伴い令和元年10月1日以後の

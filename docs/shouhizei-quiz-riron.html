課税期間から適用されています。"}, {"cat": "問2⑶・簡易課税の適用要件", "ctx": "課税事業者Cは、令和7年中に簡易課税制度選択届出書を提出した（個人事業者、暦年課税）。令和8年の基準期間（令和6年）の課税売上高は3,200万円。", "q": "Cの令和8年の簡易課税制度の適用について正しいものはどれか。", "choices": ["届出書を提出した日の属する課税期間の翌課税期間以後で、基準期間の課税売上高が5,000万円以下なので、令和8年は簡易課税が適用される", "届出書を提出した令和7年から簡易課税が適用され、令和8年も適用される", "基準期間の課税売上高が1,000万円を超えているので、簡易課税は適用されない", "簡易課税は税務署長の承認を受けた課税期間だけ適用される"], "exp": "事業者（免税事業者を除く）が、基準期間の課税売上高が5,000万円以下である課税期間について簡易課税制度選択届出書を提出した場合は、その提出日の属する課税期間の翌課税期間以後の課税期間について簡易課税が適用されます（法37①）。承認ではなく届出です。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑶・控除対象仕入税額の計算", "ctx": "簡易課税制度を適用している課税事業者の課税期間において、課税標準額に対する消費税額と、売上げに係る対価の返還等の金額に係る消費税額がある。", "q": "簡易課税制度による控除対象仕入税額の計算方法として正しいものはどれか。", "choices": ["課税標準額に対する消費税額から売上げに係る対価の返還等の金額に係る消費税額を控除した残額に、みなし仕入率を乗じる", "実際の課税仕入れ等の税額に、みなし仕入率を乗じる", "課税標準額に対する消費税額に、課税売上割合とみなし仕入率を乗じる", "課税標準額に対する消費税額に売上げに係る対価の返還等の消費税額を加えた額に、みなし仕入率を乗じる"], "exp": "簡易課税制度では、その課税期間の課税標準額に対する消費税額から、売上げに係る対価の返還等の金額に係る消費税額の合計額を控除した残額に、みなし仕入率を乗じた金額を、仕入れに係る消費税額とみなします（法37①）。実際の課税仕入れの額は使いません。", "note": ""}, {"cat": "問2⑶・2以上の事業", "ctx": "簡易課税制度を適用している農家Cの課税売上げは、食用の米の販売（第二種事業）が80%、飼料用の米の販売（第三種事業）が20%で、それぞれ区分している。", "q": "みなし仕入率の適用として正しいものはどれか。", "choices": ["一種類の事業の課税売上高が75%以上なので、全体に第二種事業のみなし仕入率80%を適用できる（原則の加重平均計算との有利選択）", "2以上の事業を行っているので、必ず加重平均のみなし仕入率で計算しなければならない", "最も低いみなし仕入率（70%）を全体に適用しなければならない", "飼料用の米が25%未満なので、飼料用の米の売上げは課税標準に含めない"], "exp": "2以上の事業を営む場合、原則として事業ごとのみなし仕入率で計算しますが、一種類の事業の課税売上高が全体の75%以上であれば、その事業のみなし仕入率を全体に適用できます（令57③一）。ここでは第二種事業が80%なので、全体に80%を適用でき、原則計算と比べて有利な方を選べます。", "note": "【資料の補足】本試験の問題文には売上高の割合がないため、規定を確かめるための設例を補っています。"}]}, {"year": "R01", "label": "令和元年度（第69回）", "questions": [{"cat": "問1⑴イ・輸出免税の対象取引", "ctx": "課税事業者A社（国内の事業者）は、自社製品を外国の取引先に直接輸出した（本邦からの輸出として行う譲渡）。", "q": "この譲渡の取扱いとして正しいものはどれか。", "choices": ["輸出免税の対象。本邦からの輸出として行われる資産の譲渡に当たり、輸出の証明があれば消費税が免除される", "非課税取引。輸出は国内取引に当たらないので非課税となる", "不課税取引。国外で消費されるので課税の対象にならない", "課税取引。国内の事業者が行う譲渡なので、税率10%で課税される"], "exp": "事業者（免税事業者を除く）が国内で行う課税資産の譲渡等のうち、本邦からの輸出として行われる資産の譲渡又は貸付けは、消費税が免除されます（法7①一）。輸出取引は国内取引で課税取引ですが、税が免除される（0%課税）点が、非課税・不課税との違いです。", "note": ""}, {"cat": "問1⑴イ・輸出免税の対象取引", "ctx": "次の取引は、いずれも課税事業者が行ったものである。\n①国内と外国の間の旅客・貨物の輸送（国際輸送）\n②船舶運航事業者に対する外航船舶の修理\n③非居住者に対する役務の提供で、国内のホテルでの宿泊にあたるもの", "q": "輸出免税の対象になるものの組合せとして正しいものはどれか。", "choices": ["①と②だけ。③は国内で直接便益を受けるものなので、非居住者に対するものでも免税にならない", "①・②・③すべて。相手が非居住者なら役務の内容を問わず免税になる", "①だけ。船舶の修理は役務の提供なので免税にならない", "②と③だけ。旅客の輸送は免税にならない"], "exp": "国際輸送・国際通信（法7①三）、外航船舶等の譲渡・貸付け・修理（法7①四・五、令17①）は輸出免税の対象です。非居住者に対する役務の提供も原則として免税ですが、国内に所在する資産の運送・保管、国内での飲食・宿泊など、国内で直接便益を受けるものは除かれます（令17②七）。", "note": ""}, {"cat": "問1⑴イ・輸出免税の適用要件", "ctx": "課税事業者B社は、外国の取引先に商品を輸出したが、税関長の輸出許可書など、輸出したことを証明する書類も帳簿も保存していない。", "q": "B社のこの譲渡の取扱いとして正しいものはどれか。", "choices": ["輸出免税は適用されない。輸出取引等に当たることの証明がされたものでない場合は適用しないとされている", "実際に輸出していれば、書類がなくても輸出免税が適用される", "証明がない場合は非課税取引として扱われる", "申告期限までに税務署長の承認を受ければ、書類がなくても輸出免税が適用される"], "exp": "輸出免税は、その課税資産の譲渡等が輸出取引等に該当するものであることにつき証明がされたものでない場合には、適用されません（法7②）。証明は、輸出許可書等の書類又は帳簿を整理し、譲渡等を行った日の属する課税期間の末日の翌日から2月を経過した日から7年間、納税地等に保存することで行います（規5①）。", "note": ""}, {"cat": "問1⑴イ・証明方法", "ctx": "課税事業者C社は、次の2つの方法で商品を海外の取引先に送った。\n①一般の貨物として輸出（郵便物ではない）\n②価格15万円の商品を郵便物として輸出（寄贈物品ではない）", "q": "それぞれの輸出免税の証明方法として正しいものはどれか。", "choices": ["①は税関長から交付を受けた輸出許可書、②は輸出の事実を記載した帳簿又は書類", "①も②も税関長の輸出許可書", "①は輸出の事実を記載した帳簿、②は税関長の輸出許可書", "①も②も取引先との契約書"], "exp": "郵便物以外の貨物の輸出は、税関長から交付を受けた輸出の許可があったことを証する書類（輸出許可書）で証明します。郵便物として輸出する場合は、価格が20万円を超えるもの（寄贈物品等を除く）を除き、輸出の事実を記載した帳簿又は書類で証明できます（規5①一・二）。②は20万円以下なので帳簿等でよいことになります。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問1⑴イ・証明方法", "ctx": "課税事業者D社は、国内と国外にわたる貨物の輸送（国際輸送）を行った。", "q": "この取引について輸出免税を受けるための証明方法として正しいものはどれか。", "choices": ["輸送の事実（年月日・内容・対価の額・相手方の氏名等）を記載した帳簿又は書類を保存する", "税関長の輸出許可書を保存する", "輸送先の国の税務当局が発行した証明書を保存する", "役務の提供なので証明は不要である"], "exp": "国際輸送・国際通信・国際郵便・国際信書便は、その事実を記載した帳簿又は書類で証明します（規5①三）。それ以外の免税取引（外国貨物の譲渡、外航船舶等の譲渡、非居住者への役務の提供など）は、契約書その他の書類で輸出取引等に当たることの事実が記載されたものを保存して証明します（規5①四）。", "note": ""}, {"cat": "問1⑴ロ・輸出免税の趣旨", "ctx": "日本の課税事業者が製品を輸出し、その製品は外国で消費される。輸出先の国でも付加価値税が課される。", "q": "輸出免税制度が採用されている理由として最も適切なものはどれか。", "choices": ["消費地課税主義の原則（消費される国で課税する）に従い、国外で消費されるものには日本の消費税を課さないため。課税取引のまま免税とし、仕入税額控除も認める", "輸出は国内取引ではないので、そもそも課税の対象にならないため", "輸出取引を非課税とし、仕入税額控除を認めないことで税収を確保するため", "輸出先の国と日本の両方で課税し、税の取りもれを防ぐため"], "exp": "消費税は消費に負担を求める税なので、国境を越える取引では消費される国で課税する「消費地課税主義」が国際的な原則です。日本でも消費税を課すと輸出先の税と二重に課税され、国際競争力も下がります。そこで輸出取引は課税取引としたうえで消費税を免除し（0%課税）、その仕入れにかかった税は控除できるようにしています。", "note": ""}, {"cat": "問1⑵・国外移送（輸出取引とみなされる場合）", "ctx": "課税事業者E社（本店は国内）は、次のことを行った。\n①海外支店で販売するための商品を国内で購入し、海外支店に輸出した\n②海外支店で使う事務機器を国内で購入し、海外支店に輸出した\nいずれも輸出したことの証明がされている。", "q": "これらの輸出について、仕入税額控除の取扱いとして正しいものはどれか。", "choices": ["①②とも、資産の譲渡等には当たらないが、課税資産の譲渡等に係る輸出取引等に当たるものとみなして、仕入税額控除の規定を適用する", "①は輸出取引とみなされるが、②は自己の使用のためなので輸出取引とはみなされない", "①②とも資産の譲渡等に当たらないので、その仕入れは課税売上げに対応しないものとして控除できない", "①②とも、通常の輸出免税（法7条）の対象になる"], "exp": "事業者（免税事業者を除く）が国外における資産の譲渡等又は自己の使用のために資産を輸出した場合、輸出の証明がされたときは、課税資産の譲渡等に係る輸出取引等に当たるものとみなして、仕入税額控除の規定を適用します（法31②）。支店への移送は同じ会社の中の移動で資産の譲渡等ではありませんが、国外で使われるので輸出と同じように扱います。", "note": ""}, {"cat": "問1⑵・国外移送と課税売上割合", "ctx": "課税事業者F社は、国内で購入した宅配ボックス（購入価額378,000円）を、国外の自社所有の賃貸マンションに取り付けるために輸出した（輸出時の本船甲板渡し価格400,000円）。輸出の証明はされている。", "q": "この輸出について、課税売上割合の計算での取扱いとして正しいものはどれか。", "choices": ["本船甲板渡し価格400,000円を、分母（資産の譲渡等の対価の額の合計額）と分子（課税資産の譲渡等の対価の額の合計額）の両方に含める", "対価を受けていないので、分母にも分子にも含めない", "本船甲板渡し価格400,000円を分母だけに含める", "国内での購入価額378,000円を分母と分子の両方に含める"], "exp": "国外移送で輸出取引とみなされるものは、その資産が対価を得て輸出されるものとした場合の本船甲板渡し価格（FOB価格）を、資産の譲渡等の対価の額の合計額と課税資産の譲渡等の対価の額の合計額の両方に含めます（法31②、令51③・④）。本試験の計算問題でも、この宅配ボックスの400,000円を分母・分子に含めています。", "note": ""}, {"cat": "問1⑵・国外移送の適用除外", "ctx": "課税事業者G社は、国外での資産の譲渡等のために次の資産を輸出した。\n①有価証券\n②支払手段\n③商品（棚卸資産）", "q": "国外移送の特例（輸出取引とみなす規定）の対象にならないものはどれか。", "choices": ["①と②（有価証券・支払手段の輸出は国外移送の特例の対象外）", "③だけ", "①・②・③すべて対象になる", "①だけ"], "exp": "有価証券、支払手段、金銭債権の輸出は、国外移送の場合の資産の輸出には含まれません（令51①）。商品や事務機器などは対象になります。なお、金銭債権の輸出も同じく対象外です。", "note": ""}, {"cat": "問1⑵・国外移送の主体", "ctx": "免税事業者H（個人）は、海外で販売するための商品を国内で仕入れ、自ら輸出した。輸出の証明はある。", "q": "この輸出に国外移送の特例（法31②）は適用されるか。", "choices": ["適用されない。この特例は事業者のうち免税事業者を除く者に限られ、免税事業者は仕入税額控除そのものを行わない", "適用され、仕入れに係る消費税の還付を受けられる", "適用され、免税事業者でもその課税期間は課税事業者とみなされる", "輸出の証明があれば、事業者かどうかに関係なく適用される"], "exp": "国外移送の特例は「事業者（免税事業者を除く）」が対象です（法31②）。免税事業者は納税義務がなく仕入税額控除も行わないので、この特例は関係ありません。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑴イ・簡易課税の適用要件", "ctx": "個人事業者A（課税事業者。これまで簡易課税は選択していない）は、前年（前課税期間）の1月1日に父Bの事業を承継（相続ではない）した。Aは本年12月中に「消費税簡易課税制度選択届出書」を提出し、翌年から簡易課税を受けたいと考えている。\nAの翌年の基準期間（前年）の課税売上高は、承継した事業を含めて税抜4,800万円である。", "q": "Aの翌年の簡易課税の適用について正しいものはどれか。", "choices": ["適用できる。基準期間の課税売上高が5,000万円以下で、適用を受けようとする課税期間の前課税期間の末日（本年末）までに届出書を提出しているため", "適用できない。届出書を提出した課税期間から適用されるので、翌年ではなく本年から適用される", "適用できない。基準期間の課税売上高が1,000万円を超えているため", "適用できない。事業を承継した場合は、承継した年から3年間は簡易課税を選択できない"], "exp": "簡易課税は、基準期間の課税売上高が5,000万円以下の課税期間について、簡易課税制度選択届出書を提出した場合に、提出日の属する課税期間の翌課税期間以後に適用されます（法37①）。本年末までに提出すれば、翌年から適用できます。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑴イ・簡易課税の適用要件（基準期間の判定）", "ctx": "個人事業者A（不動産貸付業、課税事業者）は、前年の1月1日に父Bのケーキ製造業を承継（相続ではない）した。Aは本年12月中に簡易課税制度選択届出書を提出する。\nAの前年（翌年の基準期間）の課税売上高は、不動産貸付業が税抜2,700万円、ケーキ製造業が税抜2,350万円で、合計税抜5,050万円である。", "q": "Aは翌年に簡易課税を適用できるか。", "choices": ["適用できない。届出書を出していても、基準期間の課税売上高（税抜）が5,000万円を超える課税期間には適用されない", "適用できる。届出書を本年末までに提出しているため", "適用できる。不動産貸付業とケーキ製造業を別々に判定すると、どちらも5,000万円以下のため", "適用できる。承継したケーキ製造業の売上げは父Bの売上げなので、Aの基準期間の課税売上高に含めないため"], "exp": "簡易課税は、基準期間の課税売上高が5,000万円以下の課税期間に限り適用されます（法37①）。基準期間の課税売上高は事業ごとではなく、その事業者の全事業の合計で判定します。承継したケーキ製造業も、承継後にA自身が行った事業の売上げはAの課税売上高に含まれます。合計5,050万円＞5,000万円なので、届出書を出していても翌年は適用できません（届出の効力は残り、5,000万円以下の年には適用されます）。", "note": "※出題当時は税率8%で、本試験の金額（税込で約2,500万円＋約3,000万円）を100/108で割り戻すと50,925,925円となり5,000万円を超えていました。令和元年10月から標準税率10%・軽減税率8%（ケーキなどの飲食料品）の複数税率になり、税込金額からの割戻しが変わるため、現行法で判断できるよう税抜の金額で設例を示しています。"}, {"cat": "問2⑴ロ・簡易課税選択届出書の提出制限", "ctx": "個人事業者A（課税事業者。課税事業者選択届出書は提出したことがなく、基準期間の課税売上高が1,000万円を超えるので課税事業者になっている）は、本年中に一般課税で製造用機械（税抜900万円）を購入した。Aは本年12月中に簡易課税制度選択届出書を提出したい。", "q": "この機械の購入により、Aの簡易課税制度選択届出書の提出は制限されるか。", "choices": ["制限されない。機械は調整対象固定資産だが高額特定資産（税抜1,000万円以上）には当たらず、Aは課税事業者を選択した事業者でも新設法人等でもないため", "制限される。一般課税の課税期間中に調整対象固定資産を購入した事業者は、すべて3年間提出できない", "制限される。税抜100万円以上の固定資産は高額特定資産に当たるため", "制限されない。個人事業者には提出制限の規定が一切適用されないため"], "exp": "簡易課税制度選択届出書の提出が制限されるのは、①課税事業者を選択した事業者が強制適用期間中に調整対象固定資産の仕入れ等をした場合、②新設法人・特定新規設立法人が基準期間がない事業年度に調整対象固定資産の仕入れ等をした場合、③高額特定資産の仕入れ等をした場合などです（法37③）。税抜900万円の機械は調整対象固定資産（100万円以上）ですが高額特定資産（1,000万円以上）ではなく、Aは①②にも当たらないので制限はありません。高額特定資産なら個人事業者も制限を受けるので、「個人には一切適用されない」は誤りです。", "note": ""}, {"cat": "問2⑴ロ・提出制限の期間", "ctx": "課税事業者I社（3月決算、一般課税）は、令和8年5月10日に税抜1,500万円の機械（高額特定資産、自己建設ではない）を購入した。", "q": "I社が簡易課税制度選択届出書を提出できない期間として正しいものはどれか。", "choices": ["令和8年4月1日（仕入れの日の属する課税期間の初日）から令和10年3月31日（その初日から3年を経過する日の属する課税期間の初日の前日）まで", "令和8年5月10日から令和11年5月9日まで", "令和9年4月1日から令和12年3月31日まで", "令和8年4月1日から令和9年3月31日まで"], "exp": "高額特定資産の仕入れ等をした場合は、仕入れ等の日の属する課税期間の初日（令和8年4月1日）から、その初日以後3年を経過する日（令和11年3月31日）の属する課税期間（令和10年4月1日〜令和11年3月31日）の初日の前日（令和10年3月31日）までは、簡易課税制度選択届出書を提出できません（法37③三）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑴ロ・提出制限と既提出の届出書", "ctx": "課税事業者J社（3月決算、一般課税）は、令和8年4月20日に簡易課税制度選択届出書を提出した。その後、同じ課税期間中の令和8年6月1日に高額特定資産を購入した。", "q": "この届出書の取扱いとして正しいものはどれか。", "choices": ["届出書の提出はなかったものとみなされる。提出制限期間に当たる課税期間中に、高額特定資産の仕入れ等の前に提出した届出書は無効になる", "届出書は有効で、翌課税期間（令和9年4月1日〜）から簡易課税が適用される", "届出書は有効で、高額特定資産を購入した課税期間から簡易課税が適用される", "届出書は有効だが、適用は購入の日から3年を経過した日からになる"], "exp": "簡易課税制度選択届出書を提出した後、同じ課税期間中に高額特定資産の仕入れ等を行い提出制限に該当することになった場合は、その届出書の提出はなかったものとみなされます（法37④）。", "note": "【資料の補足】本試験の問題文には具体的な日付・金額がないため、規定を確かめるための設例を補っています。"}, {"cat": "問2⑵・事業区分（第一種・第二種）", "ctx": "次の事業者は、いずれも他の者から購入した家電を、性質・形状を変えずに販売している。\n①家電を小売店（事業者）に販売する\n②家電を一般消費者に販売する", "q": "それぞれの事業区分として正しいものはどれか。", "choices": ["①は第一種事業（卸売業）、②は第二種事業（小売業）", "①は第二種事業、②は第一種事業", "①②とも第一種事業", "①②とも第三種事業"], "exp": "第一種事業（卸売業）は、他の者から購入した商品をその性質・形状を変更しないで他の事業者に対して販売する事業です。第二種事業（小売業）は、同じく性質・形状を変えずに販売する事業で、卸売業以外のものです（法37①、令57⑥）。販売先が事業者か消費者かで区分します。", "note": ""}, {"cat": "問2⑵・事業区分（第三種）", "ctx": "ケーキ製造業者が、自社工場で製造したケーキを、自社の店舗で一般消費者に持ち帰り用として販売している。", "q": "この事業の事業区分として正しいものはどれか。", "choices": ["第三種事業（製造業。製造した棚卸資産を小売する事業を含む）", "第二種事業（消費者に販売するので小売業）", "第四種事業（飲食店業）", "第五種事業（サービス業）"], "exp": "第三種事業は、農業・林業・漁業・鉱業・建設業・製造業・電気業・ガス業・熱供給業・水道業で、製造業には製造した棚卸資産を小売する事業を含みます（令57⑤三）。自ら製造したものを売る場合は、販売先が消費者でも第二種ではなく第三種です。", "note": ""}, {"cat": "問2⑵・事業区分（第三種の除外）", "ctx": "製造業者が、取引先から材料の無償支給を受けて加工だけを行い、加工賃を受け取っている。", "q": "この事業の事業区分として正しいものはどれか。", "choices": ["第四種事業。加工賃その他これに類する料金を対価とする役務の提供は第三種事業から除かれる", "第三種事業。製造業に当たるため", "第五種事業。サービス業に当たるため", "第一種事業。他の事業者に対する販売のため"], "exp": "第三種事業からは、加工賃その他これに類する料金を対価とする役務の提供を行う事業が除かれており、これは第四種事業になります（令57⑤三・六）。", "note": ""}, {"cat": "問2⑵・事業区分（第五種・第六種）", "ctx": "課税事業者K社は次の収入を得ている。\n①不動産の仲介手数料収入\n②損害保険会社から受け取った保険代理店手数料収入\n③事務所用建物の賃貸料収入", "q": "事業区分の組合せとして正しいものはどれか。", "choices": ["①は第六種、②は第五種、③は第六種", "①は第五種、②は第五種、③は第六種", "①②③すべて第六種", "①は第六種、②は第四種、③は第五種"], "exp": "第五種事業は運輸通信業、金融業及び保険業、サービス業（飲食店業を除く）です。第六種事業は不動産業（第一種〜第五種に当たるものを除く）です（令57⑤四・五）。不動産の仲介・貸付けは不動産業として第六種、保険代理店は保険業として第五種です。", "note": ""}, {"cat": "問2⑵・みなし仕入率", "ctx": "簡易課税制度で用いる、事業区分ごとのみなし仕入率を考える。", "q": "各事業区分のみなし仕入率の組合せとして正しいものはどれか。", "choices": ["第一種90%・第二種80%・第三種70%・第四種60%・第五種50%・第六種40%", "第一種90%・第二種80%・第三種70%・第四種50%・第五種60%・第六種40%", "第一種80%・第二種70%・第三種60%・第四種50%・第五種40%・第六種30%", "第一種90%・第二種80%・第三種60%・第四種70%・第五種50%・第六種40%"], "exp": "みなし仕入率は、第一種90%、第二種80%、第三種70%、第四種60%、第五種50%、第六種40%です（令57①⑤）。飲食店業は第四種（60%）、サービス業は第五種（50%）なので、取り違えに注意します。第四種（飲食店業など、その他の事業）が60％、第五種（サービス業など）が50％で、第四種の方が高い点を取り違えやすいので注意します。", "note": "※出題当時（平成31年4月時点）は、農業・林業・漁業はすべて第三種事業でした。令和元年10月1日以後は、農業・林業・漁業のうち飲食料品の譲渡を行う部分は第二種事業（80%）となったため、現行法で解答しています。"}, {"cat": "問2⑶・控除税額の計算方法（原則）", "ctx": "簡易課税を適用する事業者が、1種類の事業だけを営んでいる。課税期間の課税標準額に対する消費税額は500万円、売上げに係る対価の返還等の金額に係る消費税額は20万円である。", "q": "控除対象仕入税額の計算方法として正しいものはどれか。", "choices": ["（課税標準額に対する消費税額500万円 − 売上げの対価の返還等に係る消費税額20万円）× みなし仕入率", "課税標準額に対する消費税額500万円 × みなし仕入率（返還等は考えない）", "実際の課税仕入れに係る消費税額 × みなし仕入率", "（課税標準額に対する消費税額500万円 ＋ 売上げの対価の返還等に係る消費税額20万円）× みなし仕入率"], "exp": "簡易課税の控除税額は、課税標準額に対する消費税額から売上げに係る対価の返還等の金額に係る消費税額の合計額を控除した残額に、みなし仕入率を乗じて計算します（法3 }
function saveProg(next){const g=G;if(!g||!g.deck)return;const i=next?g.i+1:g.i;
 if(i>=g.deck.length||g.life===0){st.prog=null}else{st.prog={mode:g.mode,f:g.f||"",deck:g.deck.map(id),i,pts:g.pts,combo:g.combo,maxc:g.maxc,ok:g.ok,life:g.life,miss:g.miss.map(id),cat:g.cat}}
 save()}
function resume(){const p=st.prog;if(!p)return;
 G={mode:p.mode,f:p.f,deck:p.deck.map(byKey).filter(Boolean),i:p.i,pts:p.pts,combo:p.combo,maxc:p.maxc,ok:p.ok,life:p.life,miss:(p.miss||[]).map(byKey).filter(Boolean),cat:p.cat||{}};
 if(!G.deck.length||G.i>=G.deck.length){st.prog=null;save();menu();return}
 show()}
function hud(){const g=G;
 $("hud").innerHTML=`<div class="hud"><span class="pts" id="pts">${g.pts}</span><span>点</span>
 <span class="mono">${Math.min(g.i+1,g.deck.length)} / ${g.deck.length}</span>
 ${g.life!=null?`<span class="life">${"♥".repeat(g.life)}${"♡".repeat(3-g.life)}</span>`:""}
 ${g.combo>=2?`<span class="combo">${g.combo} コンボ</span>`:""}
 <span style="flex:1"></span><button class="btn sec" style="padding:4px 10px;font-size:13px" id="qt">中断</button></div>
 <div class="prog"><i style="width:${g.i/g.deck.length*100}%"></i></div><div class="timer"><i id="tm"></i></div>`;
 $("qt").onclick=()=>{menu()};
}
function show(){const g=G;clearInterval(g.t);
 if(g.i>=g.deck.length||g.life===0)return end();
 saveProg(false);hud();const q=g.deck[g.i],opts=sh(q[3]);
 $("main").innerHTML=`<div class="pop"><span class="tag">${q[6]}</span> <span class="tag">${q[0]}</span><div class="ctx"><b>資料</b>${q[1]}</div><p class="q">${q[2]}</p>`+opts.map(o=>`<button class="c">${o}</button>`).join("")+`<div id="res"></div></div>`;
 g.t0=Date.now();
 g.t=setInterval(()=>{const r=Math.max(0,1-(Date.now()-g.t0)/1000/LIMIT);$("tm").style.width=r*100+"%";if(r===0&&g.mode==="survival")answer(null,q)},200);
 document.querySelectorAll("button.c").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(b,q){const g=G;clearInterval(g.t);
 const sec=(Date.now()-g.t0)/1000,ok=!!b&&b.textContent===q[3][0],qi=id(q);
 document.querySelectorAll("button.c").forEach(x=>{x.disabled=true;if(x.textContent===q[3][0])x.classList.add("ok")});
 const c=q[0];g.cat[c]=g.cat[c]||[0,0];g.cat[c][1]++;
 let gain=0,msg;
 if(ok){g.ok++;g.combo++;g.maxc=Math.max(g.maxc,g.combo);g.cat[c][0]++;
  const speed=Math.max(0,Math.round((LIMIT-sec)/LIMIT*50));gain=100+speed+Math.min(g.combo-1,5)*20;g.pts+=gain;
  st.wrong=st.wrong.filter(x=>x!==qi);
  msg=`正解 <span class="gain">+${gain}</span>（基本100・速さ+${speed}${g.combo>1?`・${g.combo}コンボ+${Math.min(g.combo-1,5)*20}`:""}）`;
 }else{if(b)b.classList.add("ng");g.combo=0;g.miss.push(q);if(g.life!=null)g.life--;
  if(!st.wrong.includes(qi))st.wrong.push(qi);
  msg=(b?"不正解":"時間切れ")+" — 正解："+q[3][0];}
 saveProg(true);hud();$("pts").textContent=g.pts;
 const last=g.i+1>=g.deck.length||g.life===0;
 $("res").innerHTML=`<div class="exp"><b>${msg}</b><br>${q[4]}</div><div class="nav"><button class="btn" id="nx">${last?"結果を見る":"次の問題"}</button></div>`;
 $("nx").onclick=()=>{g.i++;show();window.scrollTo(0,0)};$("res").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function end(){const g=G;clearInterval(g.t);st.prog=null;save();
 const n=g.mode==="survival"?g.i+(g.life===0?1:0):g.deck.length,p=n?Math.round(g.ok/n*100):0;
 const rank=p>=90?"S":p>=80?"A":p>=70?"B":p>=50?"C":"D";
 const cm={S:"合格確実レベル",A:"合格ライン",B:"ボーダー付近",C:"要復習",D:"基礎から確認を"}[rank];
 const bk=g.mode;const nb=st.best[bk]==null||g.pts>st.best[bk];if(g.mode!=="review"&&nb){st.best[bk]=g.pts;save()}
 $("hud").innerHTML="";
 const rows=Object.entries(g.cat).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,v])=>`<tr><td>${k}</td><td class="n">${v[0]}/${v[1]}</td><td class="n">${Math.round(v[0]/v[1]*100)}%</td></tr>`).join("");
 $("main").innerHTML=`<div class="pop"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="rank">${rank}</div>
 <div><div class="big">${g.pts} 点${g.mode!=="review"&&nb?' <span class="gain" style="font-size:14px">自己ベスト更新</span>':""}</div>
 <div>${g.ok} / ${n} 問正解（${p}%）・最大 ${g.maxc} コンボ ― ${cm}</div></div></div>
 <div class="tblwrap"><table><tr><th>論点</th><th style="text-align:right">正解</th><th style="text-align:right">正答率</th></tr>${rows}</table></div>
 ${g.miss.length?`<p style="margin:14px 0 4px;font-weight:700">今回間違えた問題（${g.miss.length}問）</p><ul class="miss">${g.miss.map(q=>`<li>${q[2]}<br><span style="color:var(--page-accent)">→ ${q[3][0]}</span></li>`).join("")}</ul>`:""}
 <div class="nav">${g.miss.length?'<button class="btn" id="rv">今回間違えた問題を再出題</button>':''}
 ${st.wrong.length?`<button class="btn sec" id="rw">苦手リスト全体（${st.wrong.length}問）</button>`:""}
 <button class="btn sec" id="mn">メニューへ</button></div></div>`;
 if(g.miss.length)$("rv").onclick=()=>{const m=g.miss;G={mode:"review",f:"",deck:sh(m),i:0,pts:0,combo:0,maxc:0,ok:0,life:null,miss:[],cat:{}};show()};
 if(st.wrong.length)$("rw").onclick=()=>start("review","");
 $("mn").onclick=menu;
}
menu();
</script></body></html>
